name: "Install gitleaks (gepinntes Binary, SHA256-verifiziert)"
description: >-
  Lädt das gitleaks-Release-Binary (Linux x64) direkt von GitHub Releases,
  verifiziert die SHA256-Prüfsumme gegen einen fest gepinnten Wert und legt
  das Binary für nachfolgende Steps in PATH ab. Bewusst NICHT über den
  Org-lizenzpflichtigen "gitleaks-action"-Wrapper (ADR-0001-projekt-skelett.md
  §10.3, devops-lead-Votum 4). Lizenz gitleaks: MIT.

runs:
  using: "composite"
  steps:
    - name: gitleaks-Binary herunterladen + Checksumme verifizieren
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        # SHA256 von gitleaks_8.30.1_linux_x64.tar.gz, ermittelt aus
        # gitleaks_8.30.1_checksums.txt (GitHub-Release-Asset), 2026-07-09.
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        set -euo pipefail
        asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
        dest="${RUNNER_TEMP}/gitleaks-install"
        mkdir -p "${dest}"

        echo "==> Lade ${url} ..."
        curl --fail --location --silent --show-error --output "${dest}/${asset}" "${url}"

        echo "${GITLEAKS_SHA256}  ${dest}/${asset}" > "${dest}/${asset}.sha256"
        echo "==> Verifiziere SHA256-Checksumme ..."
        (cd "${dest}" && sha256sum -c "${asset}.sha256")

        tar -xzf "${dest}/${asset}" -C "${dest}" gitleaks
        chmod +x "${dest}/gitleaks"
        echo "${dest}" >> "${GITHUB_PATH}"

    - name: gitleaks-Version bestätigen
      shell: bash
      run: gitleaks version
