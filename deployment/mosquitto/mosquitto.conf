# Mosquitto — Dev-Broker für den EDMS-Ingest-Worker (ADR-0005 §13–§17)
#
# ZWECK: EDMS-Systemgrenze für die Messdaten-Ingestion. ChirpStack liegt
# ausserhalb dieses Stacks (F2, ADR-0005 §13) — im Dev speist ausschliesslich
# der synthetische Publisher (`publisher-main.ts`) ein. Der Ingest-Worker
# abonniert. Es fliessen KEINE realen personenbezogenen Messdaten
# (synthetic-only, Ingest-Gate ZU).
#
# LIZENZ: Mosquitto steht unter EPL-2.0/EDL-1.0 und laeuft als eigenstaendiger
# Dienst ueber die Netzwerkgrenze — lizenzrechtlich unkritisch, siehe
# `.claude/rules/dependencies.md` ("Dienste ueber Netzwerkgrenze").
#
# ==========================================================================
# DEV-PROFIL — NICHT produktionstauglich
# ==========================================================================
# Dieses Profil nutzt einen KLARTEXT-Listener auf 1883. Das ist ausschliesslich
# fuer den lokalen synthetic-only-Dev-Stack zulaessig.
#
# VOR REAL-INGEST ZWINGEND (Gate-Auflagen, ADR-0005 §31):
#   - SA-3: TLS 1.3 exklusiv + mTLS Worker<->Broker (`listener 8883`,
#     `cafile`/`certfile`/`keyfile`, `tls_version tlsv1.3`,
#     `require_certificate true`), Klartext-Listener entfaellt.
#   - SEC-3: Verschluesselung-at-Rest fuer `persistence_location` (Volume-/
#     Storage-Ebene) + `max_queued_messages`/`max_queued_bytes` +
#     Message-Expiry, damit der Offline-Puffer begrenzt bleibt.

listener 1883

# --------------------------------------------------------------------------
# AuthN/AuthZ — Least Privilege (ADR-0005 §26.4-Gedanke auf Broker-Ebene)
# --------------------------------------------------------------------------
# Bewusst KEIN `allow_anonymous true`: schon im Dev sollen Worker und
# Publisher getrennte Identitaeten mit je nur EINEM erlaubten Recht haben
# (Worker liest, Publisher schreibt) — das haelt die Rollen-Trennung ehrlich
# und deckt Konfigurationsfehler frueh auf, statt sie bis Prod zu verschleppen.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --------------------------------------------------------------------------
# Persistenz — Offline-Puffer (ADR-0005 §15, M3)
# --------------------------------------------------------------------------
# Persistente Session + Broker-Persistenz sind der Puffer, der Uplinks
# ueberbrueckt, waehrend der Worker neu startet (QoS 1, Ack-nach-Commit).
persistence true
persistence_location /mosquitto/data/

# --------------------------------------------------------------------------
# Logging — RL-2 (ADR-0005 §14/§22)
# --------------------------------------------------------------------------
# KEIN `log_type debug` und kein Topic-Detail-Logging: der MQTT-Topic enthaelt
# die Klartext-DevEUI (`application/+/device/<DevEUI>/event/up`). Ein
# mitloggender Broker wuerde damit genau das Quasi-Identifikator-Merkmal
# preisgeben, das der Worker sorgfaeltig nie persistiert.
log_type error
log_type warning
log_type notice
