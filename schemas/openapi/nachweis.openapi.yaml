# EDMS Nachweis-API — STUFE 1+2 (ADR-0007 Teil B/C) — OpenAPI-Contract
# (backend-lead-Arbeitsauftrag, Status: proposed)
#
# STUFE 1: Vollständigkeits-Preflight + Einspar-Lauf.
# STUFE 2 (Auflagen A13/A14/A15/A19/A20/A21/A23): Export (`nachweis.export*`)
# + Einreichung (`nachweis.einreichung*`) — fünf zusätzliche Pfade:
# `POST /nachweis/einsparlaeufe/{id}/exporte`, `GET /nachweis/exporte/{id}`,
# `GET /nachweis/exporte/{id}/dateien/{dateiname}`,
# `POST /nachweis/exporte/{id}/einreichungen`,
# `GET /nachweis/einreichungen/{id}[/differenzen]`.
#
# Regel-Konformität (.claude/rules/api-contracts.md):
#   - OpenAPI 3.1; info.title/version (SemVer)/servers[].url gesetzt.
#   - Security-Scheme oauth2 als GLOBALER Default (JwtAuthGuard) — kein
#     öffentlicher Endpoint.
#   - Fehler-Shape: application/problem+json (RFC 9457).
#   - Alle `POST`-Routen tragen `Idempotency-Key` (PFLICHT) — Muster
#     `berechnung.openapi.yaml` (Header-Präsenz/-Format geprüft, ECHTE
#     Replay-Deduplizierung dokumentierter Gap).
#   - Alle Listen-Routen sind Cursor-paginiert (`cursor`+`limit`, max. 100),
#     niemals `offset`.
#   - `create:foerderjahr`/`create:nachweis_preflight`/`create:einsparlauf`/
#     `create:nachweis_export`/`create:einreichung` sind PORTFOLIOWEITE
#     Aktionen (B1/B10) — KEIN `endkundeId`-Bezug im Request/in der
#     Ressourcenauflösung (RBAC statt ABAC-Scoping, s.
#     `docs/adr/ADR-0007-einsparberechnung-bafa-export.md` B10).
#   - A19/B10-Asymmetrie: `read:nachweis_export` ist NUR Rolle `betrieb`
#     (eigene Auditor-Deny-Regel im PDP) — `read:einreichung` bleibt
#     AUCH für `compliance-auditor` zugänglich (Metadaten sind sein
#     Prüfgegenstand, nicht sein Risiko).
#   - `GET .../dateien/{dateiname}` liefert `text/csv` bzw. — fuer
#     `einsparungsnachweis.xlsx` seit Exportschema v3 — eine BINAERE
#     XLSX-Arbeitsmappe (KEIN JSON). Der einzige Nicht-JSON-Response-Body
#     dieser Spec, s. Response-Definition.
#
# Fachlicher Kern: `src/backend/src/nachweis/{foerderjahr,preflight,
# einsparlauf}.service.ts`, `src/backend/src/nachweis/export/
# nachweis-export.service.ts`, `src/backend/src/nachweis/einreichung.
# service.ts` und ADR-0007 Teil B (B1-B4, B13, B5-B7) + Teil C (Auflagen
# A11/A13/A14/A15/A19/A20/A21/A23).

openapi: 3.1.0

info:
  title: EDMS Nachweis-API (Stufe 1+2 — Preflight, Einspar-Lauf, Export, Einreichung)
  version: 0.3.0
  summary: >
    Vollständigkeits-Preflight (DE-02), Förderjahres-Einsparaggregation
    (Technisches Merkblatt v2.2 Kap. 9.1) und der kanonische Nachweis-Export
    (D5/D6) + die Einreichung an die Bewilligungsbehörde (D7) für das
    BAFA-Pilotprogramm Einsparzähler — ausschließlich auf Basis bestehender
    ADR-0006-Berechnungsläufe (B7: keine eigene Aggregation auf Messwerte,
    kein Lesepfad nach `einfluss.*`).
  description: >
    Eigener fachlicher Kontext `nachweis` (analog `berechnung`), NICHT
    innerhalb `stammdaten` verschachtelt. ALLE Ressourcen sind append-only
    (`nachweis.preflight`/`preflight_befund`/`einsparlauf`/
    `einsparlauf_bindung`/`einsparlauf_ergebnis`/`export`/`export_datei`/
    `einreichung`/`einreichung_differenz`) — es gibt weder PATCH noch DELETE.
    Export-Dateien werden NIE als Bytes gespeichert (O-B10) — der
    Download-Endpoint rendert bei JEDEM Aufruf deterministisch NEU und
    verifiziert vor der Auslieferung gegen den persistierten Hash (A.8.24).
  contact:
    name: EDMS Studio
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:3000
    description: Lokale Dev-Umgebung (Docker Compose, NestJS-Backend/BFF)

tags:
  - name: foerderjahr
    description: Parametrisierte Förderjahr-Definition (O1 — Kalenderjahr ODER Bewilligungszeitraum).
  - name: preflight
    description: Vollständigkeits-Preflight je Förderjahr (DE-02, D4).
  - name: einsparlauf
    description: Förderjahres-Einsparaggregation je (Endkunde, Energieträger) — append-only Nachweis-Lauf (D1).
  - name: export
    description: Kanonischer Nachweis-Export (CSV je DE-03-Kategorie + Metablatt + Manifest) — deterministisch, KEINE Byte-Ablage (D5/D6, O-B10).
  - name: einreichung
    description: Einreichungs-Vermerk an die Bewilligungsbehörde (D7) — bezeugt die Erklärung des Bedieners, NICHT den Empfang durch die Behörde.

security:
  - oauth2: []

paths:
  /nachweis/foerderjahre:
    post:
      operationId: foerderjahrAnlegen
      tags: [foerderjahr]
      summary: Förderjahr-Stammdaten anlegen
      description: >
        ABAC-Aktion `create:foerderjahr` (PORTFOLIOWEIT, kein `endkundeId`-
        Bezug). Rolle `betrieb`. `vonMonat`/`bisMonat` sind BEIDE INKLUSIVE
        Monatsanfänge (anders als `BerechnungslaufAnlegen.periodeBis`, dort
        exklusiv).

        **Taggenaue Grenzen (seit V0070).** Ein Förderjahr aus dem
        Bewilligungsbescheid beginnt selten am Monatsersten; Kap. 9.1 des
        Technischen Merkblatts v2.2 verlangt, die Einsparung zeitanteilig zu
        ermitteln, wenn der relevante Zeitraum kleiner ist als das
        Förderjahr. Wer `vonTag`/`bisTag` mitgibt, bekommt genau diesen
        Zeitraum — die Randmonate werden dann angeschnitten gerechnet, und
        zwei aufeinanderfolgende Förderjahre dürfen sich einen Kalendermonat
        teilen.

        Ohne die beiden Felder gilt wie bisher das VOLLE Monatsfenster. Sie
        sind wechselseitig Pflicht (eine halbe Angabe wäre ein Förderjahr,
        dessen eines Ende beschieden und dessen anderes gerundet ist) und
        müssen in den Monaten liegen, die `vonMonat`/`bisMonat` nennen — die
        Monatsangaben sind das Etikett der taggenauen Grenzen, nicht eine
        zweite Wahrheit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoerderjahrAnlegen'
      responses:
        '201':
          description: Förderjahr angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foerderjahr'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    get:
      operationId: foerderjahrListeLesen
      tags: [foerderjahr]
      summary: Förderjahre auflisten (Cursor-paginiert)
      description: >
        ABAC-Aktion `read:stammdaten` (B10 — Lesen läuft über die BESTEHENDE
        Fachaktion, KEIN eigenes `read:foerderjahr`). Rollen `betrieb`/
        `compliance-auditor`.
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Seite von Förderjahren.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoerderjahrListe'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/foerderjahre/{foerderjahrId}:
    parameters:
      - $ref: '#/components/parameters/FoerderjahrIdPath'
    get:
      operationId: foerderjahrLesen
      tags: [foerderjahr]
      summary: Förderjahr lesen
      description: ABAC-Aktion `read:stammdaten`. Rollen `betrieb`/`compliance-auditor`.
      responses:
        '200':
          description: Förderjahr.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foerderjahr'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/preflights:
    post:
      operationId: preflightAusfuehren
      tags: [preflight]
      summary: Vollständigkeits-Preflight ausführen (wiederholbar, append-only)
      description: >
        ABAC-Aktion `create:nachweis_preflight` (PORTFOLIOWEIT). Rolle
        `betrieb`. Wendet den Regel-Startsatz FJ-01..FJ-09 an (FJ-07 gemäß
        Auflage A11 als FJ-07a/b/c differenziert — Art.-18-Sperren sind ein
        PAAR-Ausschluss, NIEMALS ein Förderjahr-Blocker, C2). „Grün" heißt
        NULL Blocker; Warnungen sind zulässig. Jeder Aufruf erzeugt einen
        NEUEN, eigenständigen Datensatz (append-only, idempotent im fachlichen
        Sinn: gleiche Eingabe → gleiches Ergebnis, nicht „kein zweiter Lauf").
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreflightAusfuehren'
      responses:
        '201':
          description: Preflight durchgeführt (Kopf + alle Befunde).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightMitBefunden'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/preflights/{preflightId}:
    parameters:
      - $ref: '#/components/parameters/PreflightIdPath'
    get:
      operationId: preflightLesen
      tags: [preflight]
      summary: Preflight-Kopf lesen
      description: ABAC-Aktion `read:nachweis_preflight` (portfolioweit, Existenz-Auflösung ohne `endkundeId`-Scope). Rollen `betrieb`/`compliance-auditor`.
      responses:
        '200':
          description: Preflight-Kopf.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preflight'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/preflights/{preflightId}/befunde:
    parameters:
      - $ref: '#/components/parameters/PreflightIdPath'
    get:
      operationId: preflightBefundeLesen
      tags: [preflight]
      summary: Preflight-Befunde auflisten (Cursor-paginiert)
      description: >
        ABAC-Aktion `read:nachweis_preflight`. Befunde sind PII- und wertfrei
        (Regel-Code, Paar-Referenz als Pseudonym, Monat, Schwere, klassierte
        Kennzahl — NIEMALS kWh-Mengen, A15).
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Seite von Preflight-Befunden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightBefundListe'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/einsparlaeufe:
    post:
      operationId: einsparlaufAnlegen
      tags: [einsparlauf]
      summary: Einspar-Lauf starten (synchron, EINE Transaktion)
      description: >
        ABAC-Aktion `create:einsparlauf` (PORTFOLIOWEIT). Rolle `betrieb`.
        Fail-closed-Vorbedingung (D4): `art=foerderjahr_nachweis` verlangt
        einen GRÜNEN referenzierten Preflight (`409`, sonst); `art=
        zwischenstand` darf auf einem roten Preflight aufsetzen. Bindet
        monatsscharf GENAU EINEN nicht-ersetzten `analytics.berechnungslauf`
        je (Endkunde, Energieträger, Monat) im Förderjahres-Umfang (D2) und
        aggregiert nach dem Rechenmodell B13 (Verrechnung OHNE Kappung,
        Ausschluss `nicht_ausweisbarer` Monate, 75-%-Jahres-Abdeckungsfloor).
        `nachweis.einsparlauf_ergebnis` trägt EINE Zeile je (Endkunde,
        Energieträger)-Paar im Umfang, AUCH für ausgeschlossene (DE-02-
        Vollständigkeit — Art.-18-FJ-07c-Paare und Substitutionsfälle bleiben
        sichtbar, nur ohne Zahlenwert).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EinsparlaufAnlegen'
      responses:
        '201':
          description: Einspar-Lauf erfolgreich abgeschlossen und persistiert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinsparlaufAntwort'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }
    get:
      operationId: einsparlaufListeLesen
      tags: [einsparlauf]
      summary: Einspar-Läufe auflisten (Cursor-paginiert)
      description: ABAC-Aktion `read:einsparlauf`. Rollen `betrieb`/`compliance-auditor`.
      parameters:
        - $ref: '#/components/parameters/FoerderjahrQuery'
        - $ref: '#/components/parameters/ArtQuery'
        - $ref: '#/components/parameters/NurAktuelleQuery'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Seite von Einspar-Lauf-Zusammenfassungen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinsparlaufListe'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/einsparlaeufe/{einsparlaufId}:
    parameters:
      - $ref: '#/components/parameters/EinsparlaufIdPath'
    get:
      operationId: einsparlaufLesen
      tags: [einsparlauf]
      summary: Einspar-Lauf + Jahres-Ergebniszeilen lesen
      description: ABAC-Aktion `read:einsparlauf`. Rollen `betrieb`/`compliance-auditor`. PII-frei (`endkundeId` ist Pseudonym).
      responses:
        '200':
          description: Einspar-Lauf inkl. `ergebnisse`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinsparlaufAntwort'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/einsparlaeufe/{einsparlaufId}/ergebnisse:
    parameters:
      - $ref: '#/components/parameters/EinsparlaufIdPath'
    get:
      operationId: einsparlaufErgebnisseLesen
      tags: [einsparlauf]
      summary: Jahres-Ergebniszeilen auflisten (Cursor-paginiert, INKLUSIVE Ausschlüssen)
      description: >
        ABAC-Aktion `read:einsparlauf`. DE-02-Vollständigkeit: eine Zeile je
        (Endkunde, Energieträger)-Paar im Umfang, AUCH für
        `status=ausgeschlossen`.
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Seite von Jahres-Ergebniszeilen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinsparlaufErgebnisListe'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/einsparlaeufe/{einsparlaufId}/bindungen:
    parameters:
      - $ref: '#/components/parameters/EinsparlaufIdPath'
    get:
      operationId: einsparlaufBindungenLesen
      tags: [einsparlauf]
      summary: Monatsbindungen auflisten (Cursor-paginiert)
      description: >
        ABAC-Aktion `read:einsparlauf`. Monatsscharfe Bindung an genau einen
        `analytics.berechnungslauf` je (Endkunde, Energieträger, Monat, D2) —
        eingefrorene `referenzKwh`/`istKwh`, `kandidatenAnzahl > 1` zeigt eine
        aufgelöste Mehrdeutigkeit an (identische Werte, D2).
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Seite von Monatsbindungen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinsparlaufBindungListe'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/einsparlaeufe/{einsparlaufId}/exporte:
    parameters:
      - $ref: '#/components/parameters/EinsparlaufIdPath'
    post:
      operationId: nachweisExportErzeugen
      tags: [export]
      summary: Nachweis-Export erzeugen (deterministisch gerendert, KEINE Byte-Ablage)
      description: >
        ABAC-Aktion `create:nachweis_export` (PORTFOLIOWEIT). Rolle `betrieb`.
        Rendert das kanonische CSV-Dateibündel (`baseline_lauf`,
        `baseline_klima_tag`, `einflussgroessen_intervall`,
        `einspardaten_monat`, `einspardaten_jahr`, optional
        `einspardaten_differenz` bei Korrektur-Läufen,
        `geraeteerkennung_quote`, `geraeteerkennung_gruppe`, `metablatt`,
        `manifest`) und persistiert AUSSCHLIESSLICH Metadaten/Hashes.

        Seit **Schema-Version 3** (V0075) kommt `einsparungsnachweis.xlsx`
        hinzu — der technische Erfolgsnachweis in der Form der BAFA-Vorlage
        ([Q3] Kap. 9 + VN-Merkblatt Kap. 4.3.4), neun Blätter mit denselben
        Zahlen wie die CSVs, aber in der Gliederung des behördlichen
        Formulars. Die EINZIGE binäre Datei des Bündels; sie trägt Formeln,
        damit der Empfänger jede Zahl nachrechnen kann.

        Neue Exporte entstehen unter **Schema-Version 3** (V0075). Ein
        bestehender Export behält seine gespeicherte Version und wird beim
        Download unverändert darunter neu gerendert — sonst erschiene jeder
        bereits eingereichte Nachweis rückwirkend als gedriftet.

        Die beiden `geraeteerkennung_*`-Dateien belegen TB-05 ([Q3] Kap. 5,
        20/25/30/35/40 % je Projektjahr, nicht kumulativ): Quote je
        (Endkunde, Energieträger) gegen die Sollquote und die Zuordnung je
        Gerätegruppe samt **Methode** und **Genauigkeit**. Die
        Gruppen-Bezeichnung ist Freitext und wird wie die Station behandelt
        (Auflage A13): pseudonymisiert als `GG-<lfd>`, Klarname nur bei
        `stationDarstellung=klarname`.
        Kategorie `rohdaten` ist in v1 UNBEDINGT ausgeschlossen (Auflage
        A12 — Anschlussnutzer-Sperren im vereinfachten Messkonzept sind
        strukturell nicht auflösbar; im Metablatt ausgewiesen).
        `zweck='wissenschaftliche_auswertung'` ist fail-closed gesperrt
        (Auflage A23, `403`). `stationDarstellung='klarname'` verlangt eine
        aktenkundige `anfrageRef` (Auflage A13, `400` sonst) — DB-CHECK ist
        der Backstop.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NachweisExportErzeugen'
      responses:
        '201':
          description: Export erzeugt (Kopf + Datei-Manifest).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NachweisExportAntwort'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'RBAC/ABAC-Ablehnung ODER Auflage A23 (`zweck=wissenschaftliche_auswertung` fail-closed gesperrt).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/exporte/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportIdPath'
    get:
      operationId: nachweisExportLesen
      tags: [export]
      summary: Export-Kopf + Datei-Manifest lesen (Metadaten/Hashes, KEINE Dateiinhalte)
      description: >
        ABAC-Aktion `read:nachweis_export` — Auflage A19/B10: die
        schutzwürdigste Leseaktion dieses ADR, AUSSCHLIESSLICH Rolle
        `betrieb` (eigene, resource-lose Auditor-Deny-Regel
        `nachweis_export_auditor_verboten` im PDP — `compliance-auditor`
        erhält HIER `403`, ANDERS als bei `read:einreichung`).
      responses:
        '200':
          description: Export-Kopf + Datei-Manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NachweisExportAntwort'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/exporte/{exportId}/dateien/{dateiname}:
    parameters:
      - $ref: '#/components/parameters/ExportIdPath'
      - $ref: '#/components/parameters/DateinamePath'
    get:
      operationId: nachweisExportDateiLesen
      tags: [export]
      summary: Export-Datei herunterladen (rendert neu, verifiziert vor Auslieferung)
      description: >
        ABAC-Aktion `read:nachweis_export` (s. o., AUSSCHLIESSLICH `betrieb`).
        Rendert die angeforderte Datei aus dem eingefrorenen Einspar-Lauf
        NEU und vergleicht `datei_hash`/`manifest_hash` gegen das
        persistierte Artefakt (A.8.24) — bei Abweichung erfolgt KEINE
        Auslieferung (`500`), unabhängig vom Ergebnis wird
        `export.nachweis.abgerufen` auditiert (`rolle_erfassen=true`, JEDER
        Abruf, auch `permit`).
      responses:
        '200':
          description: >
            Dateiinhalt. Die CSV-Dateien als kanonisches CSV (RFC 4180, UTF-8,
            CRLF); `einsparungsnachweis.xlsx` seit Exportschema v3 (V0075) als
            XLSX-Arbeitsmappe — ein ZIP-Container, also ein BINÄRER Body. Ein
            Client, der die Antwort als Text liest, beschädigt die Mappe.
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '500':
          description: 'A.8.24: der neu gerenderte Inhalt weicht vom persistierten Hash ab — Auslieferung verweigert.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/exporte/{exportId}/einreichungen:
    parameters:
      - $ref: '#/components/parameters/ExportIdPath'
    post:
      operationId: einreichungVermerken
      tags: [einreichung]
      summary: Einreichung vermerken (Ehrlichkeitsklausel — "vermerkt", NICHT "zugestellt")
      description: >
        ABAC-Aktion `create:einreichung` (PORTFOLIOWEIT). Rolle `betrieb`,
        KEIN Vier-Augen-Prinzip (User-Beschluss B14/C8). Bezeugt die vom
        Bediener ERKLÄRTE Übermittlung (z. B. manueller BSCW-Upload) — NICHT
        den Empfang durch die Behörde; `belegRef` ist der Slot für eine
        spätere Empfangsbestätigung. Fail-closed-Vorbedingung (D7,
        DB-Trigger `nachweis.pruefe_einreichung_faehig()` als Backstop):
        nur ein Einspar-Lauf mit `art=foerderjahr_nachweis`,
        `synthetic=false` und grünem Preflight ist einreichbar (`409`
        sonst). Korrektur (`ersetztEinreichungId` + `korrekturGrundCode`,
        BEIDE gemeinsam): erzeugt eine NEUE, eigenständige Einreichung samt
        Differenz-Report (`nachweis.einreichung_differenz`) — die alte
        Einreichung bleibt UNVERÄNDERT (append-only, kein Überschreiben).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EinreichungAnlegen'
      responses:
        '201':
          description: Einreichung vermerkt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Einreichung'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409':
          description: 'D7 fail-closed: Einsparlauf nicht `art=foerderjahr_nachweis`, `synthetic=true`, oder Preflight nicht grün.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/einreichungen/{einreichungId}:
    parameters:
      - $ref: '#/components/parameters/EinreichungIdPath'
    get:
      operationId: einreichungLesen
      tags: [einreichung]
      summary: Einreichung lesen
      description: >
        ABAC-Aktion `read:einreichung` — B10: AUSDRÜCKLICH auditor-zugänglich
        (Rollen `betrieb`/`compliance-auditor`), KEINE eigene Deny-Regel im
        PDP — die Metadaten (wann, von wem, an wen, welcher Hash) sind der
        Prüfgegenstand des `compliance-auditor`, nicht sein Risiko. Bewusste
        Asymmetrie zu `read:nachweis_export`.
      responses:
        '200':
          description: Einreichung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Einreichung'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/einreichungen/{einreichungId}/differenzen:
    parameters:
      - $ref: '#/components/parameters/EinreichungIdPath'
    get:
      operationId: einreichungDifferenzenLesen
      tags: [einreichung]
      summary: Differenz-Report einer Korrektur-Einreichung auflisten (Cursor-paginiert)
      description: >
        ABAC-Aktion `read:einreichung` (s. o., auch `compliance-auditor`).
        TB-01/TB-08-Darlegung (D7 Punkt 4): je (Endkunde, Energieträger) die
        Werte VOR/NACH der Korrektur und das Delta — NUR bei
        Korrektur-Einreichungen nicht-leer. `monat` ist in v1 IMMER `null`
        (Jahres-Ebene, s. `EinreichungDifferenzZeile`).
      parameters:
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Seite von Differenzzeilen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinreichungDifferenzListe'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/art19-pflichten:
    get:
      operationId: art19PflichtenListe
      tags: [einreichung]
      summary: Mitteilungspflichten nach Art. 19 DSGVO
      description: >
        ABAC-Aktion `read:art19_pflicht`. Rollen `betrieb`/`compliance-auditor`
        — für den Auditor ist die Liste der OFFENEN Pflichten der eigentliche
        Prüffall.


        Art. 19 verpflichtet, allen Empfängern, denen Daten offengelegt
        wurden, jede Einschränkung (Art. 18) oder Löschung (Art. 17)
        mitzuteilen. Die Unverhältnismäßigkeits-Ausnahme greift hier NICHT:
        es gibt genau einen Empfänger, er ist aktenkundig, und die Zuordnung
        Person → Einreichung ist eine Abfrage über `einsparlauf_bindung`
        (Register nach A18).


        Der Report meldet und belegt — er teilt nicht selbst mit. Die
        Ausführung als Korrektur-Einreichung (A18) hängt am
        BSCW-Übermittlungsweg und wartet auf O-B9.


        Liefert offene UND erfüllte Pflichten; die erfüllten sind der Beleg.
      responses:
        '200':
          description: Pflichten-Report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Art19PflichtReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /nachweis/art19-pflichten/mitteilungen:
    post:
      operationId: art19MitteilungAnlegen
      tags: [einreichung]
      summary: Erfolgte Art.-19-Mitteilung dokumentieren
      description: >
        ABAC-Aktion `create:art19_mitteilung`. Rolle `betrieb` (der Auditor
        bleibt strikt lesend, DS-01).


        Fail-closed gegen das Register: dokumentiert wird NUR, was tatsächlich
        eine Pflicht ist (404 sonst). Eine zweite Meldung desselben Vorgangs
        wird abgelehnt (409) — eine spätere Löschung nach Art. 17 ist dagegen
        ein eigener Anlass und wird eigens dokumentiert.


        Zeitpunkt und Ausführender werden serverseitig gesetzt; der
        differenzierte Art.-18-Grund ist KEIN Feld und verlässt das System
        nicht (C4 Punkt 6). Audit
        `einreichung.nachweis.art19_mitgeteilt`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Art19MitteilungAnlegen'
      responses:
        '200':
          description: Mitteilung dokumentiert; Antwort ist der aktualisierte Pflichten-Report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Art19PflichtReport'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >
        OIDC via Keycloak (ADR-0002, Realm `edms`). Bearer-Access-Token,
        serverseitig gegen die Keycloak-JWKS validiert (JwtAuthGuard). AuthZ
        (RBAC @Roles + ABAC-PDP) im PolicyInterceptor; Default = deny.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.local/realms/edms/protocol/openid-connect/auth
          tokenUrl: https://auth.example.local/realms/edms/protocol/openid-connect/token
          scopes: {}

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-erzeugter Idempotenz-Schlüssel (UUID empfohlen). Präsenz/Format geprüft.
      schema:
        type: string
        minLength: 8
        maxLength: 200
    FoerderjahrIdPath:
      name: foerderjahrId
      in: path
      required: true
      description: Förderjahr-ID (`nachweis.foerderjahr.id`).
      schema: { type: string, format: uuid }
    PreflightIdPath:
      name: preflightId
      in: path
      required: true
      description: Preflight-ID (`nachweis.preflight.id`).
      schema: { type: string, format: uuid }
    EinsparlaufIdPath:
      name: einsparlaufId
      in: path
      required: true
      description: Einspar-Lauf-ID (`nachweis.einsparlauf.id`).
      schema: { type: string, format: uuid }
    ExportIdPath:
      name: exportId
      in: path
      required: true
      description: Export-ID (`nachweis.export.id`).
      schema: { type: string, format: uuid }
    DateinamePath:
      name: dateiname
      in: path
      required: true
      description: 'Entitätsfreier Dateiname aus der geschlossenen, kategoriebasierten Liste (Auflage A19, DB-CHECK `ck_export_datei_kategorie_dateiname`), z. B. `einspardaten_jahr.csv`.'
      schema: { type: string, pattern: '^[a-z_]+\.csv$' }
    EinreichungIdPath:
      name: einreichungId
      in: path
      required: true
      description: Einreichungs-ID (`nachweis.einreichung.id`).
      schema: { type: string, format: uuid }
    FoerderjahrQuery:
      name: foerderjahr
      in: query
      required: false
      description: Filter auf `foerderjahrId`.
      schema: { type: string, format: uuid }
    ArtQuery:
      name: art
      in: query
      required: false
      schema: { $ref: '#/components/schemas/EinsparlaufArt' }
    NurAktuelleQuery:
      name: nurAktuelle
      in: query
      required: false
      description: 'Nur nicht-ersetzte Läufe (`ersetzt_einsparlauf_id IS NULL`).'
      schema: { type: boolean }
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaker Cursor der Vorseite (`seite.naechsterCursor`), niemals offset.
      schema: { type: string, maxLength: 512 }
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximale Seitengröße (Default 50, max. 100).
      schema: { type: integer, minimum: 1, maximum: 100 }

  responses:
    UngueltigeEingabe:
      description: Ungültige Eingabe (Validierung fehlgeschlagen). PII-frei.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Kein/ungültiges/abgelaufenes Access-Token (AuthN, JwtAuthGuard).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: AuthZ-Ablehnung (RBAC/ABAC, PolicyInterceptor). PII-frei, strukturierter Grund.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NichtGefunden:
      description: Ressource nicht gefunden (Förderjahr, Preflight, Einspar-Lauf).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Konflikt:
      description: >
        D4 fail-closed: `art=foerderjahr_nachweis` ohne grünen referenzierten
        Preflight — kein neuer Einspar-Lauf zulässig.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unerwartet:
      description: Unerwarteter Fehler. PII-/stacktrace-frei (DS-10).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Art19Anlass:
      type: string
      enum: [einschraenkung_art18, loeschung_art17]
      description: >
        Welche Rechtsfolge mitgeteilt wurde. Art. 19 nennt Berichtigung,
        Löschung UND Einschränkung — im EDMS entstehen beide letzteren:
        Art. 18 über den Sperr-Pfad, Art. 17 über das Krypto-Shredding.
    Art19PflichtItem:
      type: object
      additionalProperties: false
      required: [einreichungId, empfaenger, uebermitteltAt, subjektTyp, subjektId, anlass, mitgeteiltAm, offen]
      properties:
        einreichungId: { type: string, format: uuid }
        empfaenger:
          type: string
          description: Aktenkundiger Empfänger der Einreichung — der Adressat der Mitteilung.
        uebermitteltAt: { type: string, format: date-time }
        subjektTyp:
          type: string
          enum: [endkunde, anschlussnutzer]
        subjektId: { type: string, format: uuid }
        anlass: { $ref: '#/components/schemas/Art19Anlass' }
        mitgeteiltAm:
          type: [string, 'null']
          format: date-time
          description: '`null` = Pflicht offen; sonst der Zeitpunkt der dokumentierten Mitteilung.'
        offen: { type: boolean }
    Art19PflichtReport:
      type: object
      additionalProperties: false
      required: [items, offenAnzahl]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Art19PflichtItem' }
        offenAnzahl: { type: integer }
    Art19MitteilungAnlegen:
      type: object
      additionalProperties: false
      description: >
        Kein Feld für Zeitpunkt oder Ausführenden (serverseitig — sonst wäre
        der Beleg rückdatierbar bzw. einem Dritten zuschreibbar) und keines
        für den Einschränkungsgrund (er verlässt das System nicht).
      required: [einreichungId, subjektTyp, subjektId, anlass, kanal]
      properties:
        einreichungId: { type: string, format: uuid }
        subjektTyp:
          type: string
          enum: [endkunde, anschlussnutzer]
        subjektId: { type: string, format: uuid }
        anlass: { $ref: '#/components/schemas/Art19Anlass' }
        kanal:
          type: string
          enum: [postalisch, elektronisch, telefonisch, persoenlich]
          description: >
            Dieselbe geschlossene Liste wie die Art.-18-Unterrichtung — es ist
            derselbe Vorgangstyp, und zwei getrennte Listen würden
            auseinanderlaufen.
    Problem:
      type: object
      description: Fehlerobjekt nach RFC 9457 (application/problem+json).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail:
          type: string
          description: Menschenlesbare, PII-freie Detailbeschreibung.
        instance: { type: string, format: uri }

    SeitenInfo:
      type: object
      additionalProperties: false
      required: [naechsterCursor, limit]
      properties:
        naechsterCursor:
          type: [string, 'null']
          description: Cursor der nächsten Seite; `null` = letzte Seite.
        limit: { type: integer, minimum: 1, maximum: 100 }

    DefinitionQuelle:
      type: string
      enum: [kalenderjahr, bewilligungszeitraum]
      description: 'O1 — Förderjahr-Zuschnitt, parametrisiert (NIE hartkodiert).'

    FoerderjahrAnlegen:
      type: object
      additionalProperties: false
      required: [code, vorhabenRef, nummer, vonMonat, bisMonat, definitionQuelle]
      properties:
        code: { type: string, minLength: 1, maxLength: 32, description: "z. B. 'FJ-2027', UNIQUE." }
        vorhabenRef: { type: string, minLength: 1, maxLength: 128, description: Aktenzeichen/Bescheid-Bezug (Slot, kein FK). }
        nummer: { type: integer, minimum: 1, maximum: 20, description: Projektjahr 1..5 (TB-05-kompatibel). }
        vonMonat: { type: string, format: date, description: Monatserster, INKLUSIVER Förderjahres-Beginn. }
        bisMonat: { type: string, format: date, description: Monatserster, INKLUSIVES Förderjahres-Ende. }
        vonTag:
          type: string
          format: date
          description: >
            Optional, seit V0070 — der taggenaue Beginn (INKLUSIV) aus dem
            Bewilligungsbescheid. Nur gemeinsam mit `bisTag` zulässig; fehlt
            beides, gilt das volle Monatsfenster.
        bisTag:
          type: string
          format: date
          description: >
            Optional, seit V0070 — erster Tag NACH dem Förderjahr
            (EXKLUSIV, anders als `bisMonat`). Nur gemeinsam mit `vonTag`.
        definitionQuelle: { $ref: '#/components/schemas/DefinitionQuelle' }
        bescheidRef: { type: string, maxLength: 128 }

    Foerderjahr:
      type: object
      additionalProperties: false
      required: [id, code, vorhabenRef, nummer, vonMonat, bisMonat, vonTag, bisTag, definitionQuelle, bescheidRef, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        vorhabenRef: { type: string }
        nummer: { type: integer }
        vonMonat: { type: string, format: date, description: Etikett — der Monat, in dem `vonTag` liegt. }
        bisMonat: { type: string, format: date, description: Etikett — der Monat, in dem der letzte enthaltene Tag liegt. }
        vonTag: { type: string, format: date, description: Erster Tag des Förderjahres (INKLUSIV). }
        bisTag: { type: string, format: date, description: Erster Tag NACH dem Förderjahr (EXKLUSIV). }
        definitionQuelle: { $ref: '#/components/schemas/DefinitionQuelle' }
        bescheidRef: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    FoerderjahrListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten:
          type: array
          items: { $ref: '#/components/schemas/Foerderjahr' }
        seite: { $ref: '#/components/schemas/SeitenInfo' }

    PreflightAusfuehren:
      type: object
      additionalProperties: false
      required: [foerderjahrId, profilCode]
      properties:
        foerderjahrId: { type: string, format: uuid }
        profilCode:
          type: string
          const: foerderjahr_preflight_de02
          description: '`analytics.verfahren_version`-Katalogcode (art=nachweispruefung, V0024) — v1 kennt genau EINEN Wert.'

    PreflightErgebnis:
      type: string
      enum: [gruen, rot]
      description: "'gruen' == NULL Blocker (DB-CHECK) — Warnungen sind zulässig."

    Preflight:
      type: object
      additionalProperties: false
      required:
        - id
        - foerderjahrId
        - profilCode
        - profilVersion
        - ergebnis
        - blockerAnzahl
        - warnungAnzahl
        - hinweisAnzahl
        - umfangPaareAnzahl
        - monateErwartet
        - synthetic
        - ausgefuehrtAt
        - ausgefuehrtVonSub
      properties:
        id: { type: string, format: uuid }
        foerderjahrId: { type: string, format: uuid }
        profilCode: { type: string }
        profilVersion: { type: integer, minimum: 1 }
        ergebnis: { $ref: '#/components/schemas/PreflightErgebnis' }
        blockerAnzahl:
          type: integer
          minimum: 0
          description: >
            A11/C2: `FJ-07c`-Befunde (Art.-18-Paar-Ausschluss) zählen NICHT
            in diese Zahl — sie sind paar-scoped, kein Förderjahr-Blocker.
        warnungAnzahl: { type: integer, minimum: 0 }
        hinweisAnzahl: { type: integer, minimum: 0 }
        umfangPaareAnzahl: { type: integer, minimum: 0 }
        monateErwartet: { type: integer, minimum: 0 }
        synthetic: { type: boolean }
        ausgefuehrtAt: { type: string, format: date-time }
        ausgefuehrtVonSub: { type: string, description: Opake Akteurs-Referenz (KEIN Klartext-Name). }

    PreflightSchwere:
      type: string
      enum: [blocker, warnung, hinweis]

    PreflightBefund:
      type: object
      additionalProperties: false
      required: [preflightId, lfd, regelCode, schwere, endkundeId, energietraeger, monat, kennzahlKlasse]
      properties:
        preflightId: { type: string, format: uuid }
        lfd: { type: integer, minimum: 1 }
        regelCode:
          type: string
          description: "FJ-01..FJ-06, FJ-07a/b/c (A11), FJ-08 (A20), FJ-09 — aus dem Verfahrenskatalog gelesen, hier nicht abschließend aufgezählt."
        schwere: { $ref: '#/components/schemas/PreflightSchwere' }
        endkundeId: { type: [string, 'null'], format: uuid, description: Pseudonym. }
        energietraeger: { type: [string, 'null'] }
        monat: { type: [string, 'null'], format: date }
        kennzahlKlasse:
          type: [string, 'null']
          description: KLASSIERT (z. B. `kandidaten_2`, `grund_fehlt`) — NIEMALS kWh/Prozent (A15/B12.5-Muster).

    PreflightMitBefunden:
      type: object
      additionalProperties: false
      required: [preflight, befunde]
      properties:
        preflight: { $ref: '#/components/schemas/Preflight' }
        befunde:
          type: array
          items: { $ref: '#/components/schemas/PreflightBefund' }

    PreflightBefundListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten:
          type: array
          items: { $ref: '#/components/schemas/PreflightBefund' }
        seite: { $ref: '#/components/schemas/SeitenInfo' }

    EinsparlaufArt:
      type: string
      enum: [foerderjahr_nachweis, zwischenstand]

    EinsparlaufAusloeser:
      type: string
      enum: [manuell, job, korrektur]

    QualitaetsStufe:
      type: string
      enum: [belastbar, eingeschraenkt, nicht_ausweisbar]
      description: Monats-/Lauf-Kopf-Qualitätsstufe (identisch zur ADR-0006-Domäne).

    EinsparlaufAnlegen:
      type: object
      additionalProperties: false
      required: [foerderjahrId, preflightId, art]
      properties:
        foerderjahrId: { type: string, format: uuid }
        preflightId:
          type: string
          format: uuid
          description: >
            Referenziert den GENAUEN Preflight-Lauf, dessen Ergebnis für die
            D4-Fail-closed-Vorbedingung herangezogen wird (explizit, nicht
            implizit „jüngster Preflight" — Preflights sind wiederholbar).
        art: { $ref: '#/components/schemas/EinsparlaufArt' }
        ausloeser: { $ref: '#/components/schemas/EinsparlaufAusloeser' }
        ersetztEinsparlaufId:
          type: string
          format: uuid
          description: Verweist auf einen abgelösten Vorgänger-Lauf desselben Förderjahres (Neuberechnung).

    EinsparlaufErgebnisStatus:
      type: string
      enum: [ausgewiesen, nicht_nachweisbar, ausgeschlossen]

    AusschlussGrundCode:
      type: string
      enum:
        - datenschutzrechtliche_einschraenkung
        - energietraeger_substitution_v1_nicht_unterstuetzt
        - nicht_nachweisbar
      description: >
        Geschlossene Liste (A11). `datenschutzrechtliche_einschraenkung` =
        FJ-07c (der differenzierte Art.-18-Grund bleibt INTERN in
        `energy.endkunde`); `energietraeger_substitution_v1_nicht_
        unterstuetzt` = FJ-06/B13.4 (Erkennung heute ein dokumentierter Stub,
        O-B3b); `nicht_nachweisbar` = struktureller Sammelcode für sonstige
        Nichtaufnahme (z. B. keine bindbare Analytics-Zeile trotz FJ-02-
        Ausnahme).

    EinsparlaufErgebnis:
      type: object
      additionalProperties: false
      required:
        - einsparlaufId
        - endkundeId
        - energietraeger
        - status
        - ausschlussGrundCode
        - referenzKwhSumme
        - istKwhSumme
        - einsparungKwhEndenergie
        - monateAusgewiesen
        - monateErsatz
        - monateFehlend
        - qualitaetsStufeMin
        - wissAuswertungAusgenommen
      properties:
        einsparlaufId: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid, description: Pseudonym. }
        energietraeger: { type: string }
        status: { $ref: '#/components/schemas/EinsparlaufErgebnisStatus' }
        ausschlussGrundCode:
          oneOf:
            - $ref: '#/components/schemas/AusschlussGrundCode'
            - type: 'null'
        referenzKwhSumme: { type: [number, 'null'] }
        istKwhSumme: { type: [number, 'null'] }
        einsparungKwhEndenergie:
          type: [number, 'null']
          description: 'E_{k,t}^{FJ} — B13.1/B13.2, kein `max(·,0)`. `null` genau bei `status ≠ ausgewiesen`.'
        monateAusgewiesen: { type: integer, minimum: 0 }
        monateErsatz: { type: integer, minimum: 0, description: 'v1 immer 0 (keine Ersatz-/Hochrechnung, B13.3/B14).' }
        monateFehlend: { type: integer, minimum: 0 }
        qualitaetsStufeMin:
          type: string
          enum: [belastbar, eingeschraenkt, nicht_nachweisbar]
          description: Jahres-Status/-Qualitätsstufe (B13.3) — EIGENE Domäne, `nicht_nachweisbar` statt `nicht_ausweisbar`.
        wissAuswertungAusgenommen: { type: boolean, description: 'DE-04-Kennzeichnung (D6).' }

    EinsparlaufAntwort:
      type: object
      additionalProperties: false
      required:
        - id
        - foerderjahrId
        - art
        - verfahrenCode
        - verfahrenVersion
        - parameter
        - preflightId
        - umfangPaareAnzahl
        - monateErwartet
        - monateGebunden
        - gebundeneLaeufeAnzahl
        - qualitaetsStufeMin
        - ausloeser
        - codeRevision
        - synthetic
        - ersetztEinsparlaufId
        - erstelltAt
        - erstelltVonSub
        - ergebnisse
      properties:
        id: { type: string, format: uuid }
        foerderjahrId: { type: string, format: uuid }
        art: { $ref: '#/components/schemas/EinsparlaufArt' }
        verfahrenCode: { type: string }
        verfahrenVersion: { type: integer, minimum: 1 }
        parameter:
          type: object
          description: 'Vorzeichenregel/Lückenregel/Floor/Rundung (B13) — vollständiger, eingefrorener Parametersatz.'
        preflightId: { type: string, format: uuid }
        umfangPaareAnzahl: { type: integer, minimum: 0 }
        monateErwartet: { type: integer, minimum: 0 }
        monateGebunden: { type: integer, minimum: 0 }
        gebundeneLaeufeAnzahl: { type: integer, minimum: 0 }
        qualitaetsStufeMin: { $ref: '#/components/schemas/QualitaetsStufe' }
        ausloeser: { $ref: '#/components/schemas/EinsparlaufAusloeser' }
        codeRevision: { type: string }
        synthetic: { type: boolean }
        ersetztEinsparlaufId: { type: [string, 'null'], format: uuid }
        erstelltAt: { type: string, format: date-time }
        erstelltVonSub: { type: string }
        ergebnisse:
          type: array
          items: { $ref: '#/components/schemas/EinsparlaufErgebnis' }

    EinsparlaufListItem:
      type: object
      additionalProperties: false
      required: [id, foerderjahrId, art, qualitaetsStufeMin, ersetztEinsparlaufId, erstelltAt]
      properties:
        id: { type: string, format: uuid }
        foerderjahrId: { type: string, format: uuid }
        art: { $ref: '#/components/schemas/EinsparlaufArt' }
        qualitaetsStufeMin: { $ref: '#/components/schemas/QualitaetsStufe' }
        ersetztEinsparlaufId: { type: [string, 'null'], format: uuid }
        erstelltAt: { type: string, format: date-time }

    EinsparlaufListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten:
          type: array
          items: { $ref: '#/components/schemas/EinsparlaufListItem' }
        seite: { $ref: '#/components/schemas/SeitenInfo' }

    EinsparlaufErgebnisListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten:
          type: array
          items: { $ref: '#/components/schemas/EinsparlaufErgebnis' }
        seite: { $ref: '#/components/schemas/SeitenInfo' }

    MonatsBehandlung:
      type: string
      enum: [gemessen, ausgeschlossen]
      description: 'v1 kennt KEIN `ersatz` (keine Hochrechnung, B13.3/B14).'

    EinsparlaufBindung:
      type: object
      additionalProperties: false
      required:
        - einsparlaufId
        - endkundeId
        - energietraeger
        - monat
        - berechnungslaufId
        - referenzKwh
        - istKwh
        - deltaKwh
        - deltaAusgewiesenKwh
        - qualitaetsStufe
        - behandlung
        - kandidatenAnzahl
      properties:
        einsparlaufId: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid, description: Pseudonym. }
        energietraeger: { type: string }
        monat: { type: string, format: date }
        berechnungslaufId: { type: string, format: uuid, description: '`analytics.berechnungslauf.id` (ADR-0006, D2).' }
        referenzKwh: { type: number, minimum: 0 }
        istKwh: { type: number, minimum: 0 }
        deltaKwh: { type: number, description: 'R_m − A_m, VOR Vorzeichenregel.' }
        deltaAusgewiesenKwh: { type: number, description: 'NACH Vorzeichen-/Lückenregel (F2/F3) — 0 bei `behandlung=ausgeschlossen`.' }
        qualitaetsStufe: { $ref: '#/components/schemas/QualitaetsStufe' }
        behandlung: { $ref: '#/components/schemas/MonatsBehandlung' }
        kandidatenAnzahl:
          type: integer
          minimum: 1
          description: '> 1 zeigt eine aufgelöste Mehrdeutigkeit an (D2, identische Werte — abweichende Werte sind ein FJ-05-Preflight-Blocker).'

    EinsparlaufBindungListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten:
          type: array
          items: { $ref: '#/components/schemas/EinsparlaufBindung' }
        seite: { $ref: '#/components/schemas/SeitenInfo' }

    # =====================================================================
    # STUFE 2 — Export (D5/D6, Auflagen A13/A14/A15/A19/A20/A23)
    # =====================================================================

    NachweisExportZweck:
      type: string
      enum: [nachweis, erfolgskontrolle, wissenschaftliche_auswertung]
      description: >
        Auflage A14: `de04_auszug` wird DB-seitig AUS `zweck` abgeleitet
        (`GENERATED ALWAYS AS (zweck = 'wissenschaftliche_auswertung')`).
        `wissenschaftliche_auswertung` ist Auflage A23 fail-closed gesperrt
        (DB-CHECK `ck_export_zweck_wiss_auswertung_gesperrt`) — Empfänger/
        Rolle/Rechtsgrundlage sind ungeklärt.

    ExportStationDarstellung:
      type: string
      enum: [pseudonymisiert, klarname]
      description: >
        Default `pseudonymisiert` (Art. 25 Abs. 2). Auflage A13 —
        Ehrlichkeitsklausel: die Ersetzung ist KEINE Anonymisierung, weil
        die mitgelieferte Klima-Tagesreihe die Station gegen frei
        verfügbare DWD-Referenzreihen bestimmbar macht (im Metablatt
        ausgewiesen). `klarname` nur bei aktenkundiger Anforderung
        (`anfrageRef` PFLICHT, DB-CHECK).

    NachweisExportErzeugen:
      type: object
      additionalProperties: false
      properties:
        zweck:
          allOf: [{ $ref: '#/components/schemas/NachweisExportZweck' }]
          default: nachweis
        stationDarstellung:
          allOf: [{ $ref: '#/components/schemas/ExportStationDarstellung' }]
          default: pseudonymisiert
        anfrageRef:
          type: string
          minLength: 1
          maxLength: 128
          description: 'PFLICHT bei `stationDarstellung=klarname` (Auflage A13, aktenkundige Anforderung).'

    ExportKategorie:
      type: string
      enum: [rohdaten, baseline, einflussgroessen, einspardaten, geraeteerkennung, einsparungsnachweis, meta]
      description: >
        DE-03-Kategorien (D5) plus `geraeteerkennung` (Exportschema v2,
        V0064 — TB-05-Quotennachweis) plus `einsparungsnachweis`
        (Exportschema v3, V0075 — die Nachweis-Mappe in der Form der
        BAFA-Vorlage). `rohdaten` erscheint NIE in einer
        `NachweisExportAntwort.dateien`-Liste (Auflage A12).

    NachweisExportDatei:
      type: object
      additionalProperties: false
      required: [exportId, dateiname, kategorie, zeilenAnzahl, dateiHash]
      properties:
        exportId: { type: string, format: uuid }
        dateiname: { type: string }
        kategorie: { $ref: '#/components/schemas/ExportKategorie' }
        zeilenAnzahl: { type: string, description: 'Zeilenzahl OHNE Header, als String (`bigint`-Herkunft).' }
        dateiHash: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 über den kanonischen Dateiinhalt, hex. Dieselbe Schreibweise wie in der ausgelieferten `manifest.csv` — sie soll ohne Umrechnung vergleichbar sein.' }

    NachweisExportAntwort:
      type: object
      additionalProperties: false
      required:
        - id
        - einsparlaufId
        - schemaCode
        - schemaVersion
        - format
        - zweck
        - de04Auszug
        - pseudonymProfil
        - stationDarstellung
        - anfrageRef
        - manifestHash
        - dateienAnzahl
        - zeilenAnzahlGesamt
        - erzeugtAt
        - erzeugtVonSub
        - dateien
      properties:
        id: { type: string, format: uuid }
        einsparlaufId: { type: string, format: uuid }
        schemaCode: { type: string, const: nachweis_export_kanonisch }
        schemaVersion: { type: integer, minimum: 1 }
        format: { type: string, enum: [csv, 'csv+xlsx'], description: 'v1 rendert AUSSCHLIESSLICH `csv` (keine XLSX-Beilage, D5).' }
        zweck: { $ref: '#/components/schemas/NachweisExportZweck' }
        de04Auszug: { type: boolean, description: 'DB-abgeleitet (`zweck=wissenschaftliche_auswertung`) — in v1 immer `false` (A23 gesperrt).' }
        pseudonymProfil: { type: string, const: standard }
        stationDarstellung: { $ref: '#/components/schemas/ExportStationDarstellung' }
        anfrageRef: { type: [string, 'null'] }
        manifestHash: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 über die sortierte Dateiliste, hex.' }
        dateienAnzahl: { type: integer, minimum: 0 }
        zeilenAnzahlGesamt: { type: string }
        erzeugtAt: { type: string, format: date-time }
        erzeugtVonSub: { type: string, description: Opake Akteurs-Referenz (KEIN Klartext-Name). }
        dateien:
          type: array
          items: { $ref: '#/components/schemas/NachweisExportDatei' }

    # =====================================================================
    # STUFE 2 — Einreichung (D7, Auflage A18/A21/A22)
    # =====================================================================

    EinreichungArt:
      type: string
      enum: [verwendungsnachweis, zwischennachweis, anfrage_bafa, stichprobe]
      description: 'DE-01 "nur auf Anfrage" — der Anlass wird am Artefakt geführt.'

    EinreichungUebermittlungsweg:
      type: string
      enum: [bscw_manuell, email_geschuetzt, api]
      description: '`email_geschuetzt` setzt eine Übertragung nach BSI TR-02102 voraus (Auflage A22, organisatorisches TOM — hier NICHT technisch erzwungen).'

    KorrekturGrundCode:
      type: string
      enum:
        - messwert_korrektur
        - klima_revision
        - baseline_korrektur
        - einflussgroesse_korrektur
        - verfahren_version_neu
        - parameter_korrektur
        - foerderjahr_definition_geaendert
        - sonstige
      description: Geschlossene Liste (D7) — NUR zusammen mit `ersetztEinreichungId`.

    EinreichungAnlegen:
      type: object
      additionalProperties: false
      required: [art, uebermittlungsweg, uebermitteltAt]
      properties:
        art: { $ref: '#/components/schemas/EinreichungArt' }
        anfrageRef: { type: string, maxLength: 128, description: 'DE-01 "nur auf Anfrage" → Aktenzeichen.' }
        empfaenger: { type: string, minLength: 1, maxLength: 128, default: bafa }
        uebermittlungsweg: { $ref: '#/components/schemas/EinreichungUebermittlungsweg' }
        uebermitteltAt:
          type: string
          format: date-time
          description: 'ISO-8601-UTC-Zeitpunkt der ERKLÄRTEN Übermittlung durch den Bediener (Ehrlichkeitsklausel — "vermerkt", nicht "zugestellt").'
        belegRef: { type: string, format: uuid, description: 'Slot für eine spätere Empfangsbestätigung — KEIN FK (eigenes Beleg-ADR).' }
        ersetztEinreichungId: { type: string, format: uuid, description: 'Korrektur (D7 Punkt 3) — NUR gemeinsam mit `korrekturGrundCode`.' }
        korrekturGrundCode: { $ref: '#/components/schemas/KorrekturGrundCode' }

    Einreichung:
      type: object
      additionalProperties: false
      required:
        - id
        - exportId
        - einsparlaufId
        - art
        - anfrageRef
        - empfaenger
        - uebermittlungsweg
        - manifestHash
        - uebermitteltAt
        - eingereichtVonSub
        - belegRef
        - ersetztEinreichungId
        - korrekturGrundCode
        - createdAt
      properties:
        id: { type: string, format: uuid }
        exportId: { type: string, format: uuid }
        einsparlaufId: { type: string, format: uuid }
        art: { $ref: '#/components/schemas/EinreichungArt' }
        anfrageRef: { type: [string, 'null'] }
        empfaenger: { type: string }
        uebermittlungsweg: { $ref: '#/components/schemas/EinreichungUebermittlungsweg' }
        manifestHash: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Eingefroren, = `export.manifestHash` zum Einreichungszeitpunkt; hex.' }
        uebermitteltAt: { type: string, format: date-time }
        eingereichtVonSub: { type: string, description: Opake Akteurs-Referenz (KEIN Klartext-Name). }
        belegRef: { type: [string, 'null'], format: uuid }
        ersetztEinreichungId: { type: [string, 'null'], format: uuid }
        korrekturGrundCode:
          oneOf:
            - $ref: '#/components/schemas/KorrekturGrundCode'
            - type: 'null'
        createdAt: { type: string, format: date-time }

    EinreichungDifferenzZeile:
      type: object
      additionalProperties: false
      required: [einreichungId, endkundeId, energietraeger, monat, wertAltKwh, wertNeuKwh, deltaKwh, ursacheCode]
      properties:
        einreichungId: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid, description: Pseudonym. }
        energietraeger: { type: string }
        monat: { type: 'null', description: 'v1 IMMER `null` — nur Jahres-Ebene (s. Renderer-Dok, monatsscharfe Differenzen sind additiv möglich, aber nicht Teil dieser Version).' }
        wertAltKwh: { type: [number, 'null'] }
        wertNeuKwh: { type: [number, 'null'] }
        deltaKwh: { type: number, description: 'wertNeuKwh − wertAltKwh (fehlende Seite zählt als 0).' }
        ursacheCode: { $ref: '#/components/schemas/KorrekturGrundCode' }

    EinreichungDifferenzListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten:
          type: array
          items: { $ref: '#/components/schemas/EinreichungDifferenzZeile' }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
