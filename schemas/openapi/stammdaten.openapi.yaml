    get:
      operationId: anschlussnutzerLesen
      tags: [anschlussnutzer]
      summary: Anschlussnutzer-Detail (PII DS-07-Innensicht-maskiert)
      description: >
        ABAC-Aktion `read:stammdaten`. Rollen `betrieb`/`compliance-auditor`
        (D2/D6-Auflösung). `stammdatenPii` nur soweit für Zuordnung/Pflege
        erforderlich und rollen-/status-erlaubt (D6 fail-closed, §6.5) —
        `compliance-auditor` => null.
      responses:
        '200':
          description: Anschlussnutzer-Detail.
          content:
