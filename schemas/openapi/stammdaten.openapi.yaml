                $ref: '#/components/schemas/AnschlussnutzerListe'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    post:
      operationId: anschlussnutzerAnlegen
      tags: [anschlussnutzer]
      summary: Anschlussnutzer anlegen (PII feldverschlüsselt, DS-07)
      description: >
        ABAC-Aktion `create:anschlussnutzer`. Rolle `betrieb`. PII (Name/Kontakt)
        des Datensubjekts der Verbrauchsdaten wird envelope-verschlüsselt nach
        identity.anschlussnutzer_pii geschrieben. Audit
        `anschlussnutzer.stammdaten.angelegt`.
      parameters:
