        ABAC-Aktion `read:monitoring` — BEWUSST NICHT `read:verbrauch_detail`:
        „wann kam zuletzt etwas an" ist ein Betriebs-Metadatum (Freshness-
        Zeitstempel aus `ingest.kanal_status`), KEIN Verbrauchsinhalt (kein
        Messwert, kein Lastgang) — ein break-glass-Zwang würde schlichtes
        Betriebsmonitoring praktisch unbenutzbar machen. Rollen `betrieb`/
        `compliance-auditor`. Liefert je Messkanal (ALLE, unabhängig vom
        Status — ergänzt die bestehende Messkanäle-Tabelle um „Letzte
        Übertragung") `letzteUebertragung` (`null` = noch nie empfangen,
        EMPTY-STATE) und `ueberfaellig` (gegen dieselbe TB-04-Schwelle wie
        `/monitoring/ausfaelle` berechnet).
      responses:
        '200':
          description: Freshness je Messkanal (leere Liste bei einem Zähler ohne Messkanäle).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MesskanalFreshnessItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

