        default: { $ref: '#/components/responses/Unerwartet' }

  # =====================================================================
  # Art.-18-Sperre des Anschlussnutzers (ADR-0007 A11.6, 0.10.0)
  # Bis hierher gab es UEBERHAUPT keinen Schreibpfad fuer
  # `verarbeitungs_status` an `energy.anschlussnutzer`: der Preflight WERTETE
  # die Sperre bereits aus (FJ-11a/b/c), setzen konnte sie niemand.
  # =====================================================================
  /stammdaten/anschlussnutzer/{anschlussnutzerId}/sperren:
    parameters:
      - $ref: '#/components/parameters/AnschlussnutzerIdPath'
    post:
      operationId: anschlussnutzerSperren
      tags: [anschlussnutzer]
      summary: Anschlussnutzer sperren (Art. 18 — kein Hard-Delete, Grund ist Pflicht)
      description: >
        ABAC-Aktion `sperren:anschlussnutzer`. Rolle `betrieb`. Setzt
        verarbeitungsStatus=gesperrt (energy) + pii_status=gesperrt (identity)
        sowie `einschraenkungGrundCode` und `gesperrtSeit` (letzteres
        serverseitig, kein Client-Wert).


        Der Anschlussnutzer ist eine EIGENE betroffene Person mit eigenen
        Betroffenenrechten — seine Einschränkung ist unabhängig von der des
        Endkunden und wird im Nachweis unter FJ-11a/b/c ausgewertet
        (ADR-0006 P4 / ADR-0007 A12), während die Endkunden-Sperre unter
        FJ-07a/b/c läuft.


        Semantik identisch zu `POST /stammdaten/endkunden/{id}/sperren`:
        gleicher Grund => 200 unverändert; ABWEICHENDER Grund => 409 ohne
        Schreibvorgang (ein bestehender Grund wird nie überschrieben); bereits
        gesperrt OHNE Grund => 409 (Nacherfassung ist ein eigener Vorgang);
        bereits nach Art. 17 gelöscht => 409.


        Audit `anschlussnutzer.stammdaten.gesperrt`
        (kontext={synthetic,einschraenkung_grund_code}, V0033).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnschlussnutzerSperren'
      responses:
        '200':
          description: Anschlussnutzer gesperrt (oder war mit demselben Grund bereits gesperrt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnschlussnutzerDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/anschlussnutzer/{anschlussnutzerId}/einschraenkung-unterrichtung:
    parameters:
      - $ref: '#/components/parameters/AnschlussnutzerIdPath'
    post:
      operationId: anschlussnutzerUnterrichten
      tags: [anschlussnutzer]
      summary: Unterrichtung nach Art. 18 Abs. 3 dokumentieren (Schritt 1 von 2)
      description: >
        ABAC-Aktion `entsperren:anschlussnutzer`. Rolle `betrieb`. Dokumentiert, dass die
        betroffene Person über die bevorstehende Aufhebung der
        Verarbeitungseinschränkung unterrichtet wurde.


        Art. 18 Abs. 3 DSGVO ist eine Ordnungsvorschrift MIT Reihenfolge —
        unterrichten, dann aufheben. Eine eigene Route statt eines Feldes am
        Entsperren, weil sich die Reihenfolge nur so belegen lässt.


        Der Nachweis wird an GENAU DIESE Einschränkung gebunden (über den
        Sperrzeitpunkt). Ein Nachweis aus einer früheren Einschränkung desselben
        Subjekts hebt eine spätere NICHT auf. Nur im Zustand `gesperrt`
        zulässig (409 sonst). Audit `anschlussnutzer.stammdaten.einschraenkung_unterrichtet`
        (kontext={synthetic,kanal}, V0036).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EinschraenkungUnterrichtung'
      responses:
        '200':
          description: Unterrichtung dokumentiert; Antwort ist das unveränderte Subjekt-Detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnschlussnutzerDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/anschlussnutzer/{anschlussnutzerId}/entsperren:
    parameters:
      - $ref: '#/components/parameters/AnschlussnutzerIdPath'
    post:
      operationId: anschlussnutzerEntsperren
      tags: [anschlussnutzer]
      summary: Verarbeitungseinschränkung aufheben (Art. 18, Schritt 2 von 2)
      description: >
        ABAC-Aktion `entsperren:anschlussnutzer`. Rolle `betrieb`. Setzt in EINER Transaktion
        verarbeitungsStatus=aktiv, einschraenkungGrundCode=NULL,
        gesperrtSeit=NULL sowie pii_status=aktiv — der Kohärenz-CHECK aus V0024
        lässt nichts anderes zu.


        FAIL-CLOSED: wird abgelehnt (409), solange keine an dieselbe
        Einschränkung gebundene Unterrichtung dokumentiert ist.


        NUR aus dem Zustand `gesperrt`. Bereits `aktiv` => 200 idempotent.
        Nach Art. 17 gelöscht => 409, ausdrücklich KEINE stille Quittung.


        NACH der Aufhebung ist in `energy.*` keine Spur des Art.-18-Vorgangs
        mehr vorhanden — die Audit-Zeile `anschlussnutzer.stammdaten.entsperrt`
        (kontext={synthetic,einschraenkung_grund_code}, V0036) und
        `energy.einschraenkung_unterrichtung` (V0035) sind die einzigen Belege.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Einschränkung aufgehoben (oder das Subjekt war bereits aktiv).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnschlussnutzerDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

