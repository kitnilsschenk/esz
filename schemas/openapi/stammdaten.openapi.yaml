# EDMS Stammdaten-CRUD + Betriebs-Monitoring — OpenAPI-Contract
# (ADR-0008 Teil B, Phase 2, Status: proposed)
#
# Regel-Konformität (.claude/rules/api-contracts.md):
#   - OpenAPI 3.1; info.title/version (SemVer)/servers[].url gesetzt.
#   - Security-Scheme oauth2 als GLOBALER Default (JwtAuthGuard, ADR-0002 D1);
#     KEIN öffentlicher Endpoint in diesem Contract — jede Route ist
#     Bearer-geschützt und läuft zusätzlich durch PolicyInterceptor (RBAC
#     @Roles + ABAC-PDP) und AuditActionInterceptor (ADR-0002 §15).
#   - Fehler-Shape: application/problem+json (RFC 9457).
#   - Pagination: CURSOR-basiert (cursor + limit, max 100); niemals offset.
#   - Alle DELETE-Operationen sind IDEMPOTENT (Löschen = Sperre/Stilllegung/
#     Krypto-Shredding, KEIN Hard-Delete — ADR-0008 §6.7 Linie 3, ADR-0004 §16).
#   - Alle schreibenden Operationen (POST/PATCH/DELETE) verlangen den
#     `Idempotency-Key`-Header (Ingest-/Mutations-Idempotenz).
#   - Request-DTOs: additionalProperties:false; keine generischen object-Responses.
#
# ===========================================================================
# DSGVO-/DS-07-Markierung (ADR-0008 §6.7 Linie 2, §26; ADR-0004 Anhang B):
# ===========================================================================
#   - LISTEN tragen NIEMALS Klartext-PII: nur Pseudonym-Surrogate
#     (energy.*.id, UUIDv7), Beziehungs-IDs, Status und erforderliche
#     Nicht-PII. Alle *ListItem-Schemas sind PII-FREI.
#   - PII (Name/Anschrift/Kontakt aus identity.*_enc, AES-256-GCM
#     feldverschlüsselt; Byte-Layout maßgeblich nonce||ciphertext||tag,
#     ADR-0008 §19) erscheint AUSSCHLIESSLICH im *Detail-Schema als
#     optionaler, nullable `stammdatenPii`-Block und wird zur LAUFZEIT durch die
#     injectable `PiiProjektionsPolicy` (fail-closed) projektions-maskiert
#     (ADR-0008 D6): befüllt nur für Rolle `betrieb` bei verarbeitungsStatus=aktiv;
#     für `compliance-auditor` bzw. gesperrte/geschredderte Subjekte => null. Der
#     Contract deklariert die MAXIMALFORM; die Maskierung ist Policy-Laufzeit, nicht
#     Schema.
#   - Rollen-Zugang (ADR-0008 D2, Auflösung D2/D6): Detail-Routen sind für `betrieb`
#     UND `compliance-auditor` erreichbar; die PII-Maskierung (D6) ist die scharfe
#     zweite Verteidigungslinie. Schreib-/Shredding-Routen: nur `betrieb`. `admin`
#     erhält KEINE Stammdaten-Rolle (DS-01). Listen/Monitoring: `betrieb`+
#     `compliance-auditor`.
#   - Der PDP zieht selbst KEINE PII (ADR-0008 D3): Ressourcen-Attribute
#     (datenklasse, verarbeitungsStatus, DE-04-Flag) stammen ausschließlich
#     aus dem `energy`-Namensraum.
#   - break-glass `read:verbrauch_detail` (Header X-Edms-Zugriffszweck):
#     in v1 KEIN Verbrauchs-Endpoint (measurement = ADR-0005); die PDP-Logik
#     ist PDP-ready (ADR-0008 D4), hier NICHT als Endpoint modelliert. Der PDP
#     ist für diese Aktion DENY-BY-DEFAULT (ADR-0008 §16); die Härtung
#     (Begründung Pflicht, Velocity/Quota, MAX_FENSTER, Echtzeit-DSB-Alert,
#     periodische Review) ist bindende VORBEDINGUNG für ADR-0005.
#   - `energy.zaehler.geraete_referenz` ist in V0002 NICHT vorhanden
#     (Quasi-Identifier, Klassifizierung offen — ADR-0004 O4); dieser Contract
#     führt daher KEIN geraeteReferenz-Feld (ADR-0008 §12).
#   - problem+json: kein Stacktrace, kein roher DB-/Krypto-/IdP-Fehlertext,
#     keine PII (DS-10).
#
# Synthetic-only (ADR-0008 §6.6/D10): Alle Schreibpfade laufen unter
# EDMS_SYNTHETIC_ONLY=true (Default) gegen Dev-KMS/Dev-DB; Real-PII-Betrieb
# ist gate-pflichtig (compliance-director).

openapi: 3.1.0

info:
  title: EDMS Stammdaten & Betriebs-Monitoring API
  version: 0.12.0
  summary: >
    Interne, ABAC-geschützte und auditierte CRUD-API für Endkunde, System/
    Messstelle, Zähler/Messkanal, Messkonzept (lesen + versioniert anlegen),
    Anschlussnutzer/Nutzungsverhältnis (strukturell), Vier-Augen-Krypto-
    Shredding-Workflow (ADR-0009), Geräte-Zuordnung (O4-Provisioning,
    ADR-0005 §26) sowie das DE-02-Vollständigkeits-/Lücken-Monitoring (nur
    Metadaten).
  description: >
    Erste Fach-Anwendung der ADR-0002-Maschinerie (JwtAuthGuard +
    PolicyInterceptor + AuditActionInterceptor) auf dem V0002-Kern-Datenmodell
    (ADR-0004). Namensraum-Trennung identity (PII, feldverschlüsselt) / energy
    (Fachdaten, pseudonym). "Löschen" = Sperre (Art. 18) / Krypto-Shredding
    (Art. 17, jetzt Vier-Augen-/Freigabe-Workflow, ADR-0009) / Stilllegung —
    kein Hard-Delete. Status: proposed (Phase-2-Entwurf, Review durch
    backend-lead + security-lead + access-control-engineer).

    **0.3.0 — SemVer-Waiver (ADR-0009 §2.4/§6, dokumentierte Abweichung von
    `.claude/rules/api-contracts.md` „Breaking Changes: neue Major-Version"):**
    der Direkt-Endpoint `POST /stammdaten/endkunden/{endkundeId}/kryptoshredding`
    wurde ENTFERNT (nicht deprecatet — ein parallel weiterlaufender
    Direktpfad würde die neue Vier-Augen-Kontrolle für die Dauer einer
    Deprecation-Frist wirkungslos machen) und durch den Antrag→Freigabe/
    Ablehnung→Ausführung-Workflow (`.../shred-antraege/**`) ersetzt. Der
    Versionssprung bleibt `0.2.0 → 0.3.0` (Minor), NICHT `1.0.0`: solange die
    Spec `0.x` ist, gilt SemVer selbst noch nicht als stabil; ein Sprung auf
    `1.0.0` würde fälschlich Produktiv-/Go-Live-Reife signalisieren, die
    (synthetic-only, pre-go-live, ADR-0008 §0) explizit nicht gegeben ist.
    Kein Präzedenzfall für künftige Breaking Changes außerhalb der
    synthetic-only-Phase.

    **0.4.0 (additiv, Minor):** neue Ressource `geraet-zuordnung` (ADR-0005
    §26, O4-Provisioning — DevEUI↔Zähler-Korrelation). NUR Anlegen/
    Deaktivieren (`create:geraet_zuordnung`/`update:geraet_zuordnung`); Lesen/
    Reverse-Auflösung (`read:geraet_zuordnung`, break-glass-gehärtet) war zu
    diesem Zeitpunkt ein separater Folgeauftrag und bewusst NICHT Teil
    dieser Version.

    **0.5.0 (additiv, Minor):** der in 0.4.0 zurückgestellte Folgeauftrag
    ist jetzt umgesetzt — neuer Endpunkt
    `POST /stammdaten/geraet-zuordnungen/{geraetZuordnungId}/reverse-aufloesung`
    (`read:geraet_zuordnung`, EIGENSTÄNDIGE break-glass-Härtung SEC-5: Rolle
    `geraete-support`, Ticket-Pflicht, eigene Zweck-Whitelist, Velocity/
    Quota — ADR-0005 §26.4 SEC-5). Zwei neue Schemas
    (`GeraetReverseAufloesungAnfrage`/`-Ergebnis`); `GeraetZuordnungDetail`
    unverändert (weiterhin ohne DevEUI-Feld). Keine bestehende Route/Schema
    geändert.

    **0.6.0 (additiv, Minor):** neue Ressource `standort`
    (Standort-/Gebäudestruktur, ADR-0010) — `energy.standort`
    (self-referencing, materialisierter Pfad D6), `energy.zaehler_standort`
    (temporale Verortung D3), `identity.standort_pii` (Label/Adresse,
    feldverschlüsselt, D4, WIEDERVERWENDETER Endkunden-DEK). Neue
    PolicyActions `read:standort`/`read:standort_pii`/`create:standort`/
    `update:standort`/`delete:standort`/`create:zaehler_standort`/
    `update:zaehler_standort` — ZWEI strikt getrennte Lesestufen (D5):
    Baum/Struktur (PII-frei) vs. Batch-Label-Entschlüsselung (immer
    auditiert, ein Event je Aufruf). Neun neue Audit-Event-Codes
    (`standort.stammdaten.*`, `standort.pii.*`, `zaehler.standort.*`,
    bereits geseedet in `migrations/V0018`). `ShreddingErgebnis` erweitert um
    `standortPiiNeutralisiert` (neue Shred-Dimension "Standort-PII", analog
    ADR-0005 §26 GB-C). Keine bestehende Route/Schema geändert.

    **0.7.0 (additiv, Minor):** zwei Betriebs-UI-Lesepfade-Lücken (UX-Konzept
    `docs/ux/betriebs-ui-konzept.md`) geschlossen. (1) `GET
    /stammdaten/zaehler/{zaehlerId}/verortung` — die bislang fehlende
    Umkehrrichtung zu `GET /stammdaten/standorte/{id}/zaehler` (D6): liefert
    die AKTUELLE Verortung eines Zählers inklusive Breadcrumb-Pfad
    (materialisierter Pfad, D6, Wurzel zuerst). ABAC-Aktion `read:standort`
    (identische Struktur-Lesestufe, D5 — PII-frei, NIEMALS Bezeichnung/
    Adresse; Labels bleiben dem bestehenden Batch-Endpunkt
    `POST .../standorte/labels` vorbehalten). Neue Schemas
    `StandortPfadEintrag`/`ZaehlerStandortAktuellDetail`. (2) TB-04-Ausfall-/
    Freshness-Lesepfade (ADR-0005 §27, D15) — `ingest.kanal_status`/
    `ingest.ausfall_vorgang` wurden bereits geschrieben, aber von keinem
    Endpunkt gelesen: `GET /monitoring/ausfaelle` (Dashboard-Kachel „Zähler
    mit Datenausfall", Cursor-Pagination, neue Schemas
    `AusfallListeItem`/`AusfallListe`/`AusfallVorgangStatus`) und `GET
    /stammdaten/zaehler/{zaehlerId}/freshness` (Zähler-Detailseite, neues
    Schema `MesskanalFreshnessItem`) — BEIDE ABAC-Aktion `read:monitoring`
    (identische, bereits bestehende Aktion — ADR-0005 §27 bestätigt „kein
    neuer PDP-Fall nötig"; bewusst NICHT `read:verbrauch_detail`, da reines
    Betriebs-Metadatum ohne Messwertbezug, sonst wäre Alltagsmonitoring
    break-glass-pflichtig). Keine bestehende Route/Schema geändert.

    **0.8.0 (additiv, Minor):** neue Ressource `einflussgroesse`
    (`einfluss.katalog`/`.intervall`/`.befund`, ADR-0006 Teil B, B8/B10,
    `migrations/V0020`/`V0021`) — DREI neue PolicyActions `create:/read:/
    update:einflussgroesse`. `read:einflussgroesse` ist eine Klartext-PII-
    Leseaktion (`wertNum`/`wertCode` unverschlüsselt, eigener Namensraum
    `einfluss`) — IMMER auditiert, `compliance-auditor` strukturell
    ausgeschlossen (RBAC + eigenständige PDP-Deny-Regel, analog `read:
    standort_pii`). Drei neue Audit-Event-Codes (`einflussgroesse.
    stammdaten.{erfasst,geaendert,einsicht}`, bereits geseedet in
    `migrations/V0021`). `PATCH .../einflussgroessen/{id}` kann BIS ZU ZWEI
    Audit-Events je Aufruf emittieren (Schließen + optionale Korrektur-Zeile).
    v1-Scope-Grenze: NUR CRUD + Befund-LESEN, KEINE Schwellwert-Erkennung
    (`tb03_schwellwert` im Katalog noch überall `NULL`). Keine bestehende
    Route/Schema geändert.
  contact:
    name: EDMS Studio
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:3000
    description: Lokale Dev-Umgebung (Docker Compose, NestJS-Backend/BFF)

tags:
  - name: endkunde
    description: Endkunde/Vertragspartner (energy.endkunde + identity.endkunde_pii).
  - name: system
    description: System/Messstelle (energy.system).
  - name: zaehler
    description: Zähler + Messkanal (energy.zaehler, energy.messkanal).
  - name: messkonzept
    description: Versioniertes Messkonzept je Endkunde (TB-01, append-only Versionen).
  - name: anschlussnutzer
    description: Anschlussnutzer + Nutzungsverhältnis (DS-07-Beziehung, strukturell).
  - name: shred-antrag
    description: >
      Vier-Augen-/Freigabe-Workflow für Krypto-Shredding (Art. 17 DSGVO,
      ADR-0009, Folgeauftrag ADR-0008 §29(C4)). Antrag stellen (harmlos,
      `shred:endkunde`) → Freigabe/Ablehnung durch eine ZWEITE `betrieb`-Person
      (`shred:endkunde:freigeben`/`:ablehnen`, ABAC-Deny-by-default bei
      Selbstfreigabe) → Ausführung (atomar mit der Freigabe gekoppelt).
  - name: monitoring
    description: DE-02-Vollständigkeits-/Lücken-Monitoring (nur Metadaten).
  - name: geraet-zuordnung
    description: >
      O4-Kernkorrelation DevEUI↔Zähler (device.geraet_zuordnung, ADR-0005
      §26). Provisioning (`create:geraet_zuordnung`/`update:geraet_zuordnung`,
      Rolle `betrieb`) — DevEUI wird AES-256-GCM feldverschlüsselt + als
      Blind-Index (HMAC-SHA256, systemweiter Pepper) abgelegt, NIE über
      `GeraetZuordnungDetail` im Klartext zurückgegeben. Reverse-Auflösung
      (`read:geraet_zuordnung`, EIGENSTÄNDIGE break-glass-Härtung SEC-5:
      Rolle `geraete-support`, Ticket-Pflicht, eigene Zweck-Whitelist,
      Velocity/Quota) liefert als EINZIGER Endpunkt im Contract die
      Klartext-DevEUI zurück (`GeraetReverseAufloesungErgebnis`).
  - name: standort
    description: >
      Standort-/Gebäudestruktur (energy.standort/energy.zaehler_standort,
      identity.standort_pii, ADR-0010). `energy.standort` ist VOLLSTÄNDIG
      PII-frei (RL-1) — Label/Adresse liegen ausschließlich feldverschlüsselt
      in `identity.standort_pii`, gebunden an den WIEDERVERWENDETEN
      Endkunden-DEK (D4/A2, kein eigener Schlüssel je Standort). ZWEI
      Lesestufen, STRIKT getrennt (D5): `read:standort` (Baum/Struktur,
      PII-frei, für Auswerte-Rollen) vs. `read:standort_pii`
      (Batch-Entschlüsselung, IMMER auditiert — EIN Event je Aufruf, nicht
      je Knoten). Materialisierter Pfad (`pfad uuid[]`, D6) trägt die
      Kern-Query "alle Zähler unter Knoten X zum Stichtag T" ohne
      `identity`-Zugriff. Zähler-Verortung (`energy.zaehler_standort`, D3)
      ist temporal (`gueltig_von`/`gueltig_bis`, EXCLUDE-Overlap-Schutz) —
      "Umsetzen" schließt die alte Zeitscheibe atomar beim Öffnen der neuen.
  - name: einflussgroesse
    description: >
      Einflussgrößen (`einfluss.katalog`/`.intervall`/`.befund`, ADR-0006
      Teil B, B8/B10) — Zustands-Zeitreihe je System (RL-B1, Bilanzebene) für
      TB-03-Einflussfaktoren (Personenzahl, Nutzfläche, Nutzungszweck,
      Energieträger-Mix, Geräteabschaffung). `wertNum`/`wertCode` sind
      Klartext-PII OHNE Verschlüsselung/Pseudonymisierung (eigener
      Namensraum `einfluss`, eigene DB-Rolle `edms_einfluss`) — `read:
      einflussgroesse` ist daher IMMER auditiert und für `compliance-auditor`
      strukturell ausgeschlossen (RBAC + eigenständige PDP-Deny-Regel,
      Defense-in-Depth). Erfassungsmodell: append-only Zustands-Zeitreihe
      (`gueltigAbMonat`/`gueltigBisMonat`) — eine "Korrektur" schließt das
      fehlerhafte Intervall und legt eine NEUE Zeile an, Werte werden NIE
      überschrieben. v1 deckt NUR CRUD + Befund-LESEN ab — die Schwellwert-
      **Erkennung** (TB-03) ist NICHT Teil dieser Version.

# Default-Security für ALLE Operationen: oauth2 (Bearer via Keycloak, ADR-0002).
# Kein Endpoint überschreibt dies mit `security: []` — es gibt keine
# öffentlichen Routen in diesem Contract.
security:
  - oauth2: []

paths:
  # =====================================================================
  # Endkunde
  # =====================================================================
  /stammdaten/endkunden/labels:
    post:
      operationId: endkundeLabelsBatch
      tags: [endkunde]
      summary: Endkunden-Labels batch-entschlüsseln (Listen/Auswahlfelder, PII-Lesestufe)
      description: >
        ABAC-Aktion `read:endkunde_pii`. Rolle `betrieb` NUR
        (`compliance-auditor` bleibt strukturell ausgeschlossen — RBAC UND eine
        eigenständige PDP-Regel `endkunde_pii_auditor_verboten`,
        Defense-in-Depth). ADR-0008 D12, AUSDRÜCKLICH KEIN Break-glass (A8 —
        der Name ist ein Stammdatum, das dieselbe Rolle als Dauerrecht hat),
        aber IMMER auditiert: GENAU EIN Audit-Event `endkunde.pii.einsicht` je
        Aufruf (kontext={synthetic,anzahl_angefragt,anzahl_endkunden}), NICHT
        eines je Endkunde. Die Antwort trägt AUSSCHLIESSLICH `{id, name}` —
        KEINE Anschrift, KEIN Kontakt (A1, bewusste Abweichung vom
        Standort-Vorbild). Endkunden-Ids, die nicht existieren oder deren
        `PiiProjektionsPolicy` je Datensatz `false` liefert (Art.-18-Sperre,
        Art.-17-Shredding, nicht-aktiver Verarbeitungsstatus), werden STILL aus
        dem Ergebnis gefiltert (kein Fehler, kein Existenz-Leak, A4). Die
        Antwort ist ein blankes Array und NICHT paginiert: die Mengengrenze 100
        (A2) macht 1 Aufruf = 1 dargestellte Seite = 1 Audit-Event. KEIN
        `Idempotency-Key` (N1): Der Header ist für schreibende Operationen
        vorgesehen; POST ist hier nur gewählt, weil eine Id-Menge nicht in den
        Query-String gehört. Seine Semantik ("Wiederholung ohne den Effekt zu
        duplizieren") legte zudem nahe, das Audit-Event bei Wiederholung zu
        unterdrücken — ein A6-Bruch, denn jede Einsicht ist eine Einsicht.
        Synthetic-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndkundeLabelsAnfrage'
      responses:
        '200':
          description: >
            Batch-entschlüsselte Labels (nur auflösbare/berechtigte Ids). Die
            Antwortmenge kann kleiner sein als die Anfragemenge; die Differenz
            wird NICHT begründet (A4).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EndkundeLabelItem' }
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/endkunden:
    get:
      operationId: endkundenListe
      tags: [endkunde]
      summary: Endkunden auflisten (PII-frei, Cursor-Pagination)
      description: >
        ABAC-Aktion `read:stammdaten`. Rollen `betrieb`/`compliance-auditor`.
        Liefert AUSSCHLIESSLICH Pseudonym-Surrogate + Nicht-PII (Linie 2) —
        kein Name/keine Anschrift.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Seite von Endkunden (PII-frei).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndkundeListe'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    post:
      operationId: endkundeAnlegen
      tags: [endkunde]
      summary: Endkunde anlegen (PII feldverschlüsselt)
      description: >
        ABAC-Aktion `create:endkunde`. Rolle `betrieb`. Der PII-Block wird
        app-seitig envelope-verschlüsselt (AES-256-GCM, per-Subjekt-DEK, D7)
        und nach identity.endkunde_pii geschrieben; energy.endkunde erhält den
        Pseudonym-Anker. consent_status bleibt Slot (Default `fehlt`, nicht
        setzbar — Consent-ADR). Synthetic-only (D10). Audit
        `endkunde.stammdaten.angelegt` (objektRef=Pseudonym-id).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndkundeAnlegen'
      responses:
        '201':
          description: Endkunde angelegt.
          headers:
            Location:
              description: Ressourcen-URI des neuen Endkunden.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndkundeDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/endkunden/{endkundeId}:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
    get:
      operationId: endkundeLesen
      tags: [endkunde]
      summary: Endkunde-Detail (PII rollen-/status-maskiert)
      description: >
        ABAC-Aktion `read:stammdaten`. Rollen `betrieb`/`compliance-auditor`
        (D2/D6-Auflösung: beide erreichen die Route, `PiiProjektionsPolicy`
        maskiert fail-closed). `stammdatenPii` ist nur für Rolle `betrieb` bei
        verarbeitungsStatus=aktiv befüllt; für `compliance-auditor` und
        gesperrte/geschredderte Subjekte => null (DS-07-Innensicht, D6).
      responses:
        '200':
          description: Endkunde-Detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndkundeDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    patch:
      operationId: endkundeAendern
      tags: [endkunde]
      summary: Endkunde ändern (PII feldverschlüsselt)
      description: >
        ABAC-Aktion `update:endkunde`. Rolle `betrieb`. Teil-Update; gesetzte
        PII-Felder werden neu envelope-verschlüsselt. Audit
        `endkunde.stammdaten.geaendert`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndkundeAendern'
      responses:
        '200':
          description: Endkunde geändert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndkundeDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  # =====================================================================
  # Art.-18-Sperre (ADR-0007 A11, C8-Folgeauftrag, 0.9.0)
  # ERSETZT `DELETE /stammdaten/endkunden/{endkundeId}`: mit dem Pflicht-Grund
  # wird aus dem Löschen eine Aktion (Muster `.../standorte/{id}/stilllegen`).
  # Die alte Route ist ERSATZLOS entfernt, nicht deprecated — bliebe sie ohne
  # Grund benutzbar, wäre die Pflichtangabe mit einem Aufruf umgehbar.
  # =====================================================================
  /stammdaten/endkunden/{endkundeId}/sperren:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
    post:
      operationId: endkundeSperren
      tags: [endkunde]
      summary: Endkunde sperren (Art. 18 — kein Hard-Delete, Grund ist Pflicht)
      description: >
        ABAC-Aktion `sperren:endkunde`. Rolle `betrieb`. Setzt
        verarbeitungsStatus=gesperrt (energy) + pii_status=gesperrt (identity)
        sowie `einschraenkungGrundCode` und `gesperrtSeit` (letzteres
        serverseitig, kein Client-Wert). Daten bleiben vollständig erhalten
        (Schlüssel intakt); die Verarbeitung wird durch die ABAC-Policy
        blockiert (ADR-0004 §16).


        Der Grund ist PFLICHT und stammt aus der geschlossenen Liste des
        Art. 18 Abs. 1 — ohne ihn ist Art. 18 Abs. 2 nicht anwendbar, und das
        System müsste die betroffene Person fail-closed aus dem Nachweis
        ausschließen, obwohl bei 1a/1c der Ausweis MIT Kennzeichnung der
        richtige Weg wäre.


        IDEMPOTENZ ist an den Grund gebunden: gleicher Grund => 200,
        unveränderter Zustand. ABWEICHENDER Grund => 409, kein Schreibvorgang
        (ein bestehender Grund wird über diesen Pfad NIE überschrieben).
        Bereits gesperrt OHNE Grund (Bestandsdaten) => 409, die nachträgliche
        Erfassung ist ein eigener Vorgang. Bereits nach Art. 17 gelöscht =>
        409, keine stille Quittung.


        Für die endgültige Löschung (Art. 17) siehe den Vier-Augen-Workflow
        unter `.../shred-antraege` (ADR-0009). Audit
        `endkunde.stammdaten.gesperrt`
        (kontext={synthetic,einschraenkung_grund_code}, V0032).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndkundeSperren'
      responses:
        '200':
          description: Endkunde gesperrt (oder war mit demselben Grund bereits gesperrt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndkundeDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/endkunden/{endkundeId}/einschraenkung-unterrichtung:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
    post:
      operationId: endkundeUnterrichten
      tags: [endkunde]
      summary: Unterrichtung nach Art. 18 Abs. 3 dokumentieren (Schritt 1 von 2)
      description: >
        ABAC-Aktion `entsperren:endkunde`. Rolle `betrieb`. Dokumentiert, dass die
        betroffene Person über die bevorstehende Aufhebung der
        Verarbeitungseinschränkung unterrichtet wurde.


        Art. 18 Abs. 3 DSGVO ist eine Ordnungsvorschrift MIT Reihenfolge —
        unterrichten, dann aufheben. Eine eigene Route statt eines Feldes am
        Entsperren, weil sich die Reihenfolge nur so belegen lässt.


        Der Nachweis wird an GENAU DIESE Einschränkung gebunden (über den
        Sperrzeitpunkt). Ein Nachweis aus einer früheren Einschränkung desselben
        Subjekts hebt eine spätere NICHT auf. Nur im Zustand `gesperrt`
        zulässig (409 sonst). Audit `endkunde.stammdaten.einschraenkung_unterrichtet`
        (kontext={synthetic,kanal}, V0036).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EinschraenkungUnterrichtung'
      responses:
        '200':
          description: Unterrichtung dokumentiert; Antwort ist das unveränderte Subjekt-Detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndkundeDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/endkunden/{endkundeId}/entsperren:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
    post:
      operationId: endkundeEntsperren
      tags: [endkunde]
      summary: Verarbeitungseinschränkung aufheben (Art. 18, Schritt 2 von 2)
      description: >
        ABAC-Aktion `entsperren:endkunde`. Rolle `betrieb`. Setzt in EINER Transaktion
        verarbeitungsStatus=aktiv, einschraenkungGrundCode=NULL,
        gesperrtSeit=NULL sowie pii_status=aktiv — der Kohärenz-CHECK aus V0024
        lässt nichts anderes zu.


        FAIL-CLOSED: wird abgelehnt (409), solange keine an dieselbe
        Einschränkung gebundene Unterrichtung dokumentiert ist.


        NUR aus dem Zustand `gesperrt`. Bereits `aktiv` => 200 idempotent.
        Nach Art. 17 gelöscht => 409, ausdrücklich KEINE stille Quittung.


        NACH der Aufhebung ist in `energy.*` keine Spur des Art.-18-Vorgangs
        mehr vorhanden — die Audit-Zeile `endkunde.stammdaten.entsperrt`
        (kontext={synthetic,einschraenkung_grund_code}, V0036) und
        `energy.einschraenkung_unterrichtung` (V0035) sind die einzigen Belege.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Einschränkung aufgehoben (oder das Subjekt war bereits aktiv).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndkundeDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  # =====================================================================
  # Shred-Antrag (Vier-Augen-Krypto-Shredding-Workflow, ADR-0009, Folgeauftrag
  # ADR-0008 §29(C4)) — ERSETZT den entfernten Direkt-Endpoint
  # POST /stammdaten/endkunden/{endkundeId}/kryptoshredding (0.3.0-Waiver, s.
  # info.description oben).
  # =====================================================================
  /stammdaten/endkunden/{endkundeId}/shred-antraege:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
    get:
      operationId: shredAntraegeListe
      tags: [shred-antrag]
      summary: Shred-Anträge auflisten (offene + historische, Cursor-Pagination)
      description: >
        ABAC-Aktion `read:stammdaten`. Rollen `betrieb`/`compliance-auditor`
        (Auditor bleibt strikt lesend, DS-01). Liefert alle Anträge des
        Endkunden (jeder Status), älteste zuerst über die gemeinsame
        Cursor-Konvention.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Seite von Shred-Anträgen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShredAntragListe'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    post:
      operationId: shredAntragBeantragen
      tags: [shred-antrag]
      summary: Krypto-Shredding beantragen (Art. 17 — Vier-Augen-Antrag, harmlos)
      description: >
        ABAC-Aktion `shred:endkunde` (unverändert gegenüber dem vormaligen
        Direkt-Endpoint — dieser Schritt selbst ist harmlos, die eigentliche
        Kontrolle liegt bei der Freigabe, ADR-0009 §2.2). Rolle `betrieb`.
        Legt einen neuen Antrag im Status `beantragt` an (`gueltigBis` =
        jetzt + Verfallsfrist, ADR-0009 §2.1/§5/§8). Höchstens EIN offener
        Antrag je Endkunde (Pflicht-Unique-Index, §2.1/§5) — ein Retry mit
        demselben Antragsteller liefert den bestehenden offenen Antrag
        zurück (Idempotency-Replay, kein Duplikat, kein 500 über den
        Unique-Index); ein ANDERER Antragsteller erhält `409`. Audit
        `endkunde.stammdaten.shred_beantragt`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KryptoShreddingAnweisung'
      responses:
        '201':
          description: Antrag gestellt (oder bereits offener Antrag desselben Antragstellers zurückgegeben).
          headers:
            Location:
              description: Ressourcen-URI des Antrags.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShredAntrag'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/endkunden/{endkundeId}/shred-antraege/{antragId}/freigeben:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
      - $ref: '#/components/parameters/AntragIdPath'
    post:
      operationId: shredAntragFreigeben
      tags: [shred-antrag]
      summary: Shred-Antrag freigeben (Vier-Augen — löst die Ausführung UNWIDERRUFLICH aus)
      description: >
        ABAC-Aktion `shred:endkunde:freigeben` (NEU, ADR-0009 §2.2). Rolle
        `betrieb`. Deny-by-default: NUR eine ZWEITE Person (`sub` ≠
        Antragsteller-`sub`) darf freigeben, NUR wenn der Antrag noch im
        Status `beantragt` ist — sonst `403`
        (`vier_augen_selbstfreigabe_verboten`/`shred_antrag_ungueltig`). Die
        zweite Person bestätigt bewusst über ein EIGENES Type-to-confirm
        (`bestaetigung`), nicht durch bloßes Anklicken der
        Antragsentscheidung. Freigabe + Ausführung sind ATOMAR in EINER
        Transaktion gekoppelt (ADR-0009 §2.1): vernichtet den
        per-Subjekt-DEK (unwiderruflich), neutralisiert die PII-Zeile,
        `verarbeitungsStatus=geloescht`. Audit
        `endkunde.stammdaten.shred_freigegeben` DANN
        `endkunde.stammdaten.geschreddert` (logische Reihenfolge, MANUELL
        emittiert — KEIN `@AuditAction` auf dieser Route, ADR-0009 §2.3
        Finding P2).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShredFreigebenAnweisung'
      responses:
        '200':
          description: Antrag freigegeben, Endkunde krypto-geschreddert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShredFreigebenErgebnis'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/endkunden/{endkundeId}/shred-antraege/{antragId}/ablehnen:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
      - $ref: '#/components/parameters/AntragIdPath'
    post:
      operationId: shredAntragAblehnen
      tags: [shred-antrag]
      summary: Shred-Antrag ablehnen (Vier-Augen, terminal)
      description: >
        ABAC-Aktion `shred:endkunde:ablehnen` (NEU, ADR-0009 §2.2). Rolle
        `betrieb`. Deny-by-default analog `freigeben` (zweite Person, Status
        `beantragt`). Terminal — der Antragsteller kann erneut beantragen.
        Audit `endkunde.stammdaten.shred_abgelehnt`
        (`kontext.ablehnungsgrund`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShredAblehnenAnweisung'
      responses:
        '200':
          description: Antrag abgelehnt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShredAntrag'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

