  # =====================================================================
  # Monitoring / Vollständigkeit (DE-02) — nur Metadaten
  # =====================================================================
  /monitoring/einschraenkung-fristen:
    get:
      operationId: einschraenkungFristen
      tags: [monitoring]
      summary: Wiedervorlage der befristeten Art.-18-Einschränkungen
      description: >
        ABAC-Aktion `read:monitoring`. Rollen `betrieb`/`compliance-auditor`.


        Listet die offenen Verarbeitungseinschränkungen mit einem der beiden
        BEFRISTETEN Tatbestände des Art. 18 Abs. 1 — `art18_1a_richtigkeit`
        („für eine Dauer, die es dem Verantwortlichen ermöglicht, die
        Richtigkeit zu überprüfen") und `art18_1d_widerspruch` („solange noch
        nicht feststeht …").


        `art18_1b_unrechtmaessig` und
        `art18_1c_rechtsverteidigung_betroffener` erscheinen NICHT: sie enden
        nicht von selbst. 1b besteht auf Wunsch der betroffenen Person, die
        die Löschung abgelehnt hat; 1c endet mit dem Rechtsstreit, nicht mit
        einer Prüffrist. Sie mitzuführen würde regelkonform fortbestehende
        Vorgänge als überfällig melden.


        Der Report MELDET, er entscheidet nicht — eine überfällige
        Einschränkung wird nicht automatisch aufgehoben (Art. 18 Abs. 3
        verlangt die Unterrichtung vorher, und der Wegfall des Grundes ist
        eine fachliche Feststellung, keine Zeitfunktion).


        Enthält KEINE PII: nur Pseudonym-UUIDs, den geschlossenen Grund-Code
        und Zeitangaben.
      parameters:
        - name: schwelleTage
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 3650, default: 30 }
          description: >
            Ab wie vielen Tagen ein Vorgang als überfällig markiert wird.
            Art. 18 nennt KEINE Zahl; die Vorgabe 30 ist an die
            Art.-12-Abs.-3-Reaktionsfrist angelehnt und eine betriebliche
            Setzung, keine Rechtsfolge — die organisatorische Bestätigung
            steht aus (analog A16).
      responses:
        '200':
          description: Wiedervorlage-Report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinschraenkungFristReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/erhebungs-entscheidungen:
    get:
      operationId: erhebungsEntscheidungen
      tags: [monitoring]
      summary: Entscheidungen über die weitere Messdaten-Erhebung (Auflage C-8)
      description: >
        ABAC-Aktion `read:monitoring`. Rollen `betrieb`/`compliance-auditor`.


        Listet alle bestehenden Art.-18-Einschränkungen mit Sperrgrund
        `art18_1b_unrechtmaessig` oder `art18_1d_widerspruch` — die beiden
        Tatbestände, bei denen ausdrücklich zu entscheiden ist, ob WEITER
        ERHOBEN wird (Auflage C-8, Spalte `neuerhebung_fortsetzen`, V0087).


        Eigener Endpunkt neben `/monitoring/einschraenkung-fristen`: Jener
        fragt „läuft diese Einschränkung länger als vorgesehen?", dieser
        „wirkt hier eine Entscheidung über die Messung, und hat sie jemand
        getroffen?". Die Gründe überschneiden sich zufällig bei lit. d, die
        Fragen nicht.


        Zwei Zustände brauchen Aufmerksamkeit, aus entgegengesetzten
        Gründen: `entscheidung_offen` — eine Bestandssperre aus der Zeit vor
        V0087, bei der niemand entschieden hat (das Gate misst weiter, und
        niemand hat das je so beschlossen); `erhebung_gestoppt` — eine
        korrekte, dokumentierte Lage, die aber niemand von selbst beendet
        und die jeden Tag eine nicht nachfüllbare Messlücke erzeugt.


        Der Report MELDET, er entscheidet nicht — weder das Nachtragen einer
        Entscheidung noch das Wiederaufnehmen der Messung geschieht
        automatisch.


        Enthält KEINE PII: Pseudonym-UUIDs, geschlossener Grund-Code,
        Zeitangaben, ein Zustand aus drei Werten.
      responses:
        '200':
          description: Bericht über die Erhebungs-Entscheidungen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErhebungsEntscheidungReport'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/vollstaendigkeit:
    get:
      operationId: vollstaendigkeitListe
      tags: [monitoring]
      summary: Vollständigkeits-/Lücken-Report (DE-02, nur Metadaten)
      description: >
        ABAC-Aktion `read:monitoring`. Rollen `betrieb`/`compliance-auditor`.
        Liefert je Endkunde/System/Zähler die fehlenden Stammdaten
        (Lücken-Metadaten) — KEIN Verbrauchsinhalt, KEINE PII (§6.5).
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: endkundeId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: nurMitLuecken
          in: query
          required: false
          description: Nur Einträge mit mindestens einer Lücke.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Seite von Vollständigkeits-Einträgen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VollstaendigkeitListe'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/ausfaelle:
    get:
      operationId: ausfaelleListe
      tags: [monitoring]
      summary: Kanäle mit TB-04-Ausfall oder überfälliger Freshness (nur Metadaten)
      description: >
        ABAC-Aktion `read:monitoring` — DIESELBE Aktion wie
        `/monitoring/vollstaendigkeit` (ADR-0005 §27 bestätigt ausdrücklich
        „kein neuer PDP-Fall nötig", da DE-02 und TB-04 innerhalb derselben
        Aktion laufen). Rollen `betrieb`/`compliance-auditor`. Liefert
        Kanäle, deren `ingest.kanal_status.letzter_ts` die
        Überfälligkeits-Schwelle überschreitet (60 h = 24 h TB-09-
        Mindestkadenz + 36 h Puffer, ADR-0005 §27 — benannte Konstante
        `TB04_FRESHNESS_SCHWELLE_STUNDEN`), ODER die bereits einen
        dokumentierten, NICHT behobenen `ingest.ausfall_vorgang`-Eintrag
        tragen. Kanäle, die noch NIE Daten geliefert haben (kein
        `ingest.kanal_status`-Eintrag — das ist der strukturell getrennte
        DE-02-Fall, `/monitoring/vollstaendigkeit`), und stillgelegte
        Zähler/Messkanäle sind AUSGESCHLOSSEN. PII-frei, Cursor-Pagination
        (Sortierung `letzter_ts ASC` — am längsten ausgefallene Kanäle
        zuerst).
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Seite von Kanälen mit Ausfall/überfälliger Freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AusfallListe'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/geraetetypen:
    get:
      operationId: geraetetypKatalogLesen
      tags: [zaehler]
      summary: Bekannte Geraetetypen samt der Messkanaele, die sie liefern
      description: >
        ABAC-Aktion `read:stammdaten`, Rollen `betrieb`/`compliance-auditor`.
        PII-frei, keine Pagination (der Katalog ist eine kurze,
        code-getragene Liste, keine Datenmenge).

        **Wozu:** `energy.messkanal.messgroesse`/`.einheit`/`.art` sind
        Freitext bzw. Werteliste und muessen ZEICHENGENAU zu dem passen, was
        der Decoder des jeweiligen Geraetetyps liefert — sonst landet jeder
        Uplink in der Quarantaene (`kanal_unbekannt` bzw.
        `einheit_inkonsistent`). Bisher stand dieses Wissen ausschliesslich im
        Backend-Code, waehrend ein Mensch die Felder beim Anlegen abtippte.
        Dieser Katalog macht es sichtbar; die Oberflaeche bietet daraus die
        passende Kanal-Vorlage an.

        Die Liste kommt AUS der Decoder-Registry, nicht aus einer daneben
        gepflegten Tabelle — eine zweite Liste waere frueher oder spaeter
        abgewichen, ohne dass es jemand bemerkt haette.

        `erwarteteKanaele` darf LEER sein: Der synthetische Referenz-Decoder
        etwa liest Messgroesse und Einheit aus dem Payload und legt sie nicht
        fest.
      responses:
        '200':
          description: Katalog der bekannten Geraetetypen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeraetetypKatalog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/ingest/status:
    get:
      operationId: ingestStatusLesen
      tags: [monitoring]
      summary: Betriebszustand der Messdaten-Aufnahme (aus der Datenbank abgeleitet)
      description: >
        ABAC-Aktion `read:monitoring` — DIESELBE Aktion wie
        `/monitoring/vollstaendigkeit` und `/monitoring/ausfaelle` (kein neuer
        PDP-Fall: derselbe Betriebs-Blick auf dieselben Ingest-Tabellen).
        Rollen `betrieb`/`compliance-auditor`. PII-frei.

        Liefert `quellen` — EINE Zeile je Netzserver, der sich je gemeldet
        hat (ADR-0011 D8) — sowie die über alle Quellen zusammengefassten
        Zeitpunkte und Quarantäne-Zahlen. Beides ist nötig: Die Summe
        beantwortet „kommt überhaupt etwas an?", die Aufschlüsselung „von
        welchem Netz nicht mehr?".

        **Zum Verbindungszustand:** Der Ingest-Worker ist ein eigener
        Prozess; er schreibt seinen Zustand regelmäßig in
        `ingest.quelle_status` (V0039). Maßgeblich ist `lebendig` — es
        verlangt BEIDES: eine gemeldete Verbindung UND einen frischen
        Herzschlag. `verbunden` allein wäre eine Falschaussage, sobald der
        Prozess abstürzt: Er kann das Flag dann nicht mehr zurücksetzen, und
        die Zeile bliebe für immer grün.

        Eine leere `quellen`-Liste heißt: Es lief noch nie ein Worker.
      responses:
        '200':
          description: Betriebszustand der Aufnahme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/ingest/quarantaene:
    get:
      operationId: ingestQuarantaeneListe
      tags: [monitoring]
      summary: Liegengebliebene Uplinks mit Grund (Cursor-paginiert, PII-frei)
      description: >
        ABAC-Aktion `read:monitoring`, Rollen `betrieb`/`compliance-auditor`.
        Jeder Uplink, den die Aufnahme nicht schreiben konnte, steht hier mit
        seinem Grund — der Arbeitsvorrat beim Anschließen eines Zählers.
        Sortierung `empfangen_at DESC` (neueste zuerst), optionaler Filter
        `grund`.

        **Bewusst NICHT ausgegeben:** der DevEUI-Blind-Index (stabiler
        Korrelations-Schlüssel über alle Uplinks eines Geräts — RL-2 verbietet
        die Klartext-DevEUI, und ein dauerhaft gleicher Ersatzschlüssel wäre
        an einer Betriebsliste dasselbe Problem in Grün), der
        `payload_hash` und der Rohpayload selbst. Aus dem redigierten
        Envelope wird EIN Feld übernommen — `fPort` —, weil sich ohne die
        Portnummer ein `decode_fehler` nicht einordnen lässt.
      parameters:
        - $ref: '#/components/parameters/IngestGrundQuery'
        - $ref: '#/components/parameters/IngestQuelleQuery'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Seite liegengebliebener Uplinks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestQuarantaeneListe'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/ingest/herkunft:
    get:
      operationId: herkunftMappingListe
      tags: [monitoring]
      summary: Herkunfts-Zuordnungen auflisten (Netzserver-Kennung → EDMS-Standort, PII-frei)
      description: >
        ABAC-Aktion `read:monitoring`, Rollen `betrieb`/`compliance-auditor`.
        Übersetzt die opaken ChirpStack-Kennungen in EDMS-Stammdaten:
        Tenant → Endkunde (n:1), Application → Standort (1:1).

        **Bewusst OHNE Pagination:** eine Zeile je ChirpStack-Application,
        also die Größenordnung „Gebäude im Bestand"; die Pflege-Sicht will
        ohnehin alles auf einmal sehen, um Lücken zu erkennen.

        **Bewusst OHNE Namen — auf beiden Seiten.** Die ChirpStack-Namen
        (`tenantName`, `applicationName`) werden gar nicht erst gelesen
        (ADR-0011 D1: Freitext aus einem fremden System, im Beleg faktisch
        eine Anschrift). Der EDMS-Standortname liegt feldverschlüsselt in
        `identity.standort_pii` und ist PII — `/monitoring/ingest` ist eine
        PII-freie Fläche (ADR-0011 O12).
      responses:
        '200':
          description: Alle Herkunfts-Zuordnungen, neueste zuerst.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HerkunftMapping'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    post:
      operationId: herkunftMappingAnlegen
      tags: [monitoring]
      summary: ChirpStack-Application einem EDMS-Standort zuordnen
      description: >
        ABAC-Aktion `create:herkunft_mapping`. Rolle `betrieb` — NICHT
        `compliance-auditor` (DS-01, strikt lesend). Die Route liegt unter
        `/monitoring`, ist aber keine Monitoring-Handlung: Seit ADR-0011 B3
        entscheidet die Zuordnung mit darüber, WESSEN Messwerte eingespeist
        werden.

        Drei Regeln setzt die Datenbank durch (V0042), nicht der
        Anwendungscode: eine Application gehört zu genau einem Standort
        (409), ein Tenant zu genau einem Endkunden (409), und der Standort
        muss dem angegebenen Endkunden gehören (400).

        Audit `herkunft_mapping.ingest.zugeordnet` (kontext={synthetic,
        chirpstack_tenant_id, chirpstack_application_id, endkunde_id,
        standort_id, quelle_code}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HerkunftMappingAnlegen'
      responses:
        '201':
          description: Zuordnung angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HerkunftMapping'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/ingest/herkunft/{herkunftId}:
    parameters:
      - name: herkunftId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: herkunftMappingEntfernen
      tags: [monitoring]
      summary: Herkunfts-Zuordnung entfernen
      description: >
        ABAC-Aktion `delete:herkunft_mapping`. Rolle `betrieb`.

        **Folge, die in der Oberfläche zu benennen ist:** Für diesen Tenant
        greift der Herkunfts-Abgleich (ADR-0011 B3/D4) danach nicht mehr —
        Uplinks werden wieder ungeprüft eingespeist.

        Antwortet mit der ENTFERNTEN Zeile statt mit `204`: Der Audit-Kontext
        braucht die Kennungen einer Zeile, die es danach nicht mehr gibt.
        Idempotent im Sinne der Zustandswirkung — ein zweiter Aufruf ändert
        nichts mehr und antwortet `404`.

        Es gibt bewusst KEIN Ändern: Umhängen läuft als Entfernen +
        Neuzuordnung, damit der Übergang lückenlos aus zwei Audit-Zeilen
        hervorgeht statt aus einem `geändert` ohne Vorzustand.

        Audit `herkunft_mapping.ingest.entfernt`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Zuordnung entfernt; ausgegeben wird die entfernte Zeile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HerkunftMapping'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/ingest/quellen:
    get:
      operationId: ingestQuellenListe
      tags: [monitoring]
      summary: Datenquellen (Broker) auflisten — OHNE Zugangsdaten
      description: >
        ABAC-Aktion `read:monitoring`, Rollen `betrieb`/`compliance-auditor`.

        Die gepflegte Konfiguration der Messdaten-Quellen (`ingest.quelle`,
        V0059) — das Gegenstück zu `/monitoring/ingest/status`, das den
        Laufzeit-Zustand des Workers zeigt.

        **Ohne Pagination:** Ein Betrieb führt eine Handvoll Netze.

        **Geheimnisse werden NIE ausgegeben** — weder Klartext noch maskiert
        noch gehasht. Ein maskierter Wert verriete Länge und Ränder, ein Hash
        wäre ein Orakel für schwache Passwörter. Stattdessen nennt
        `hinterlegteGeheimnisse`, WELCHE Felder belegt sind.
      responses:
        '200':
          description: Liste der Datenquellen.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IngestQuelleKonfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    post:
      operationId: ingestQuelleAnlegen
      tags: [monitoring]
      summary: Datenquelle anlegen (inkl. Zugangsdaten/Zertifikat)
      description: >
        ABAC-Aktion `create:ingest_quelle`. Rolle `betrieb` — NICHT
        `compliance-auditor` (DS-01, strikt lesend).

        Wer eine Quelle anlegt, bestimmt, WOHER dieses System Messwerte
        bezieht. Deshalb eine eigene Aktion statt einer Ausweitung von
        `read:monitoring`.

        Zugangsdaten und Zertifikate werden feldverschlüsselt abgelegt
        (AES-256-GCM, Schlüssel je Quelle) und verlassen die Datenbank nur
        Richtung Ingest-Worker. Die Antwort trägt sie nicht.

        `brokerHost` ist NUR Host[:Port] — Zugangsdaten in der Adresse werden
        abgewiesen (400), auf Datenbank-Ebene zusätzlich durch einen CHECK.

        Bei `tlsModus: mtls` sind `clientZertifikat` UND `clientSchluessel`
        Pflicht: Ohne sie scheitert erst der Verbindungsaufbau, und zwar
        unbemerkt im Worker-Protokoll.

        Audit `quelle.ingest.angelegt`; wurden Geheimnisse hinterlegt,
        zusätzlich `quelle.ingest.zugangsdaten_hinterlegt`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestQuelleAnlegen' }
      responses:
        '201':
          description: Datenquelle angelegt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestQuelleKonfig' }
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /monitoring/ingest/quellen/{quelleId}:
    parameters:
      - name: quelleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: ingestQuelleDetail
      tags: [monitoring]
      summary: Datenquelle lesen — OHNE Zugangsdaten
      description: ABAC-Aktion `read:monitoring`, Rollen `betrieb`/`compliance-auditor`.
      responses:
        '200':
          description: Die Datenquelle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestQuelleKonfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    patch:
      operationId: ingestQuelleAendern
      tags: [monitoring]
      summary: Datenquelle ändern, deaktivieren oder Zugangsdaten ersetzen
      description: >
        ABAC-Aktion `update:ingest_quelle`. Rolle `betrieb`.

        Ein weggelassenes Feld bleibt unverändert — insbesondere bei den
        Geheimnissen: Wer eine Quelle umbenennt, löscht damit nicht ihr
        Passwort. Ein LEERER String entfernt ein hinterlegtes Geheimnis; das
        ist die einzige Art, es ohne Neuanlage loszuwerden.

        `quelleCode` lässt sich NICHT ändern: Über ihn lädt ein Worker seine
        Konfiguration, und bereits protokollierte Quarantäne-Zeilen zeigten
        danach auf nichts mehr.

        Deaktivieren (`status: inaktiv`) ist kein Löschen — die Kennung bleibt
        in Quarantäne-Zeilen und im Herkunfts-Abgleich referenziert. Ein
        Worker, dessen Quelle inaktiv ist, startet NICHT (fail-closed).

        Audit `quelle.ingest.geaendert`; wurden Geheimnisse gesetzt,
        zusätzlich `quelle.ingest.zugangsdaten_hinterlegt`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestQuelleAendern' }
      responses:
        '200':
          description: Datenquelle geändert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestQuelleKonfig' }
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  # =====================================================================
  # Standort-/Gebäudestruktur (ADR-0010) — energy.standort (PII-FREI, RL-1),
  # energy.zaehler_standort (temporale Verortung, D3), identity.standort_pii
  # (Label/Adresse, feldverschlüsselt, D4). ZWEI Lesestufen (D5): read:standort
  # (Baum/Struktur, PII-frei) vs. read:standort_pii (entschlüsseltes Label/
  # Adresse, IMMER auditiert). Kern-Query D6 (Zähler unter Knoten X zum
  # Stichtag T).
  # =====================================================================
  /stammdaten/endkunden/{endkundeId}/standorte:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
    get:
      operationId: standorteListe
      tags: [standort]
      summary: Standort-Baum auflisten (PII-frei, Struktur-Lesestufe)
      description: >
        ABAC-Aktion `read:standort`. Rollen `betrieb`/`compliance-auditor`
        (Auswerte-Rollen). Liefert AUSSCHLIESSLICH Pseudonyme/typ/ebene/pfad/
        status/hatAdresse/zaehlerAnzahl (Linie 2, D5) — NIEMALS Bezeichnung
        oder Adresse. Kommt strukturell OHNE jeden `identity`-Zugriff
        zustande. Bewusst KEINE Cursor-Pagination (das harte Tiefenlimit
        0-9, D2.3, begrenzt die Knotenzahl je Endkunde strukturell).
      parameters:
        - name: wurzelId
          in: query
          required: false
          description: Subtree-Filter (D6) — nur dieser Knoten + Nachfahren.
          schema: { type: string, format: uuid }
        - name: maxTiefe
          in: query
          required: false
          description: Relative Tiefe ab `wurzelId` (bzw. absolut ohne `wurzelId`).
          schema: { type: integer, minimum: 0, maximum: 9 }
        - name: nurAktive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Standort-Baum (flache Liste, Client rekonstruiert die Hierarchie über `parentId`/`pfad`).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StandortStruktur' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    post:
      operationId: standortAnlegen
      tags: [standort]
      summary: Standort anlegen (Struktur + PII in einer Transaktion)
      description: >
        ABAC-Aktion `create:standort`. Rolle `betrieb`. `bezeichnung` ist
        PFLICHT (D4: `identity.standort_pii.bezeichnung_enc` existiert auf
        JEDER Ebene) und wird feldverschlüsselt — mit dem WIEDERVERWENDETEN
        Endkunden-DEK (D4/A2: "Standort-DEK == Endkunden-DEK", KEIN neuer
        Schlüssel). `adresse` ist Pflicht auf Wurzelknoten, optional auf
        `gebaeude`, sonst unzulässig (D4). Die Antwort ist AUSSCHLIESSLICH
        `StandortStruktur` (D5-Trennung: auch die Create-Antwort trägt
        NIEMALS das soeben übermittelte Label zurück — Label-Lesen bleibt
        `read:standort_pii` vorbehalten). Synthetic-only. Audit
        `standort.stammdaten.angelegt`
        (kontext={synthetic,endkunde_id,typ,ebene,parent_id_neu}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandortAnlegen'
      responses:
        '201':
          description: Standort angelegt.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandortStruktur'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/endkunden/{endkundeId}/standorte/labels:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
    post:
      operationId: standortLabelsBatch
      tags: [standort]
      summary: Standort-Labels batch-entschlüsseln (Baum-UI, PII-Lesestufe)
      description: >
        ABAC-Aktion `read:standort_pii`. Rolle `betrieb` NUR
        (`compliance-auditor` bleibt strukturell ausgeschlossen — RBAC UND
        eine eigenständige PDP-Regel, Defense-in-Depth). ADR-0010 D5,
        AUSDRÜCKLICH KEIN Break-glass ("Adresslesen ist Alltagsbetrieb"),
        aber IMMER auditiert: GENAU EIN Audit-Event
        `standort.pii.einsicht` je Aufruf
        (kontext={synthetic,endkunde_id,anzahl_knoten}), NICHT eines je
        Knoten. Standort-Ids, die nicht zum angegebenen `endkundeId` gehören
        oder nicht existieren, werden STILL aus dem Ergebnis gefiltert (kein
        Fehler, kein Existenz-Leak). Synthetic-only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandortLabelsAnfrage'
      responses:
        '200':
          description: Batch-entschlüsselte Labels (nur auflösbare/berechtigte Ids).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StandortLabelItem' }
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/standorte/{standortId}:
    parameters:
      - $ref: '#/components/parameters/StandortIdPath'
    patch:
      operationId: standortAendern
      tags: [standort]
      summary: Standort-Struktur ändern (typ/sortierung — NICHT status/PII)
      description: >
        ABAC-Aktion `update:standort`. Rolle `betrieb`. AUSDRÜCKLICH NICHT
        für `status` (eigene Aktion `.../stilllegen`, D2.6) und NICHT für
        Label/Adresse (eigene Route `.../pii`, D5-Trennung). Audit
        `standort.stammdaten.geaendert` (kontext={synthetic,endkunde_id,typ}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandortAendern'
      responses:
        '200':
          description: Standort geändert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandortStruktur'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    delete:
      operationId: standortLoeschen
      tags: [standort]
      summary: Standort hart löschen (D2.6 — nur Blattknoten ohne Verortungshistorie)
      description: >
        ABAC-Aktion `delete:standort`. Rolle `betrieb`. Echtes Hard-DELETE —
        "Korrektur von Fehlanlagen", NUR zulässig für Blattknoten OHNE JEDE
        (auch historische) Verortungshistorie; sonst 409. Löscht in
        derselben Transaktion die zugehörige `identity.standort_pii`-Zeile
        (verhindert eine verwaiste PII-Zeile). IDEMPOTENT im HTTP-Sinn: der
        erste Aufruf liefert 200, ein wiederholter Aufruf auf die (nun nicht
        mehr existierende) Ressource liefert 404 — der Endzustand
        ("Ressource existiert nicht") ist in beiden Fällen identisch. Audit
        `standort.stammdaten.geloescht`
        (kontext={synthetic,endkunde_id,typ,parent_id_alt}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Standort gelöscht.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandortLoeschErgebnis'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/standorte/{standortId}/pii:
    parameters:
      - $ref: '#/components/parameters/StandortIdPath'
    put:
      operationId: standortPiiAendern
      tags: [standort]
      summary: Standort-Label/Adresse ändern (Vollersatz, feldverschlüsselt)
      description: >
        ABAC-Aktion `update:standort` (Schreiben ist kein Lesen, D5 —
        `read:standort_pii` bleibt der Batch-Lese-Route vorbehalten).
        `bezeichnung` PFLICHT, Vollersatz (kein Feld-Teil-Update: ein
        weggelassenes `adresse` LÖSCHT die hinterlegte Adresse). Adressregeln
        wie beim Anlegen (D4). Antwort ECHOT den soeben geschriebenen
        Klartext (keine erneute Entschlüsselung nötig — der Aufrufer kennt
        den Wert bereits, keine zusätzliche Offenlegung). Audit
        `standort.pii.geaendert` (kontext={synthetic,endkunde_id,pii_felder}
        — `pii_felder` = kommagetrennte Feldnamen, KEINE Werte). Synthetic-only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandortPiiAendern'
      responses:
        '200':
          description: Standort-PII geändert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandortPiiDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/standorte/{standortId}/verschieben:
    parameters:
      - $ref: '#/components/parameters/StandortIdPath'
    post:
      operationId: standortVerschieben
      tags: [standort]
      summary: Standort verschieben (Reparent, D6)
      description: >
        ABAC-Aktion `update:standort`. Rolle `betrieb`. `neuerParentId=null`
        verschiebt an die Wurzel (nur zulässig für `typ`
        `liegenschaft`/`gebaeude`, D2.4). Lehnt Zyklen (Ziel-Parent ist
        Nachfahre oder der Knoten selbst, D2.2), Tiefenlimit-Verletzungen
        (D2.3) und Mandanten-Fremdzugriff (D2.1) ab. Aktualisiert `pfad`/
        `ebene` ALLER Nachfahren in derselben DB-Anweisung (D6) — Response
        `nachfahrenAktualisiert` belegt die Reichweite. Audit
        `standort.stammdaten.verschoben`
        (kontext={synthetic,endkunde_id,parent_id_alt,parent_id_neu,ebene,nachfahren_anzahl}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandortVerschieben'
      responses:
        '200':
          description: Standort verschoben.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandortVerschobenErgebnis'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/standorte/{standortId}/stilllegen:
    parameters:
      - $ref: '#/components/parameters/StandortIdPath'
    post:
      operationId: standortStilllegen
      tags: [standort]
      summary: Standort stilllegen (Zustandswechsel, KEIN Hard-Delete, D2.6)
      description: >
        ABAC-Aktion `update:standort`. Rolle `betrieb`. Nur zulässig ohne
        aktive Kinder UND ohne offene Zähler-Verortungen am Knoten selbst
        (409 sonst). IDEMPOTENT. Audit `standort.stammdaten.stillgelegt`
        (kontext={synthetic,endkunde_id,status_alt,status_neu}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandortStilllegen'
      responses:
        '200':
          description: Standort stillgelegt (oder war es bereits).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandortStillgelegtErgebnis'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/standorte/{standortId}/zaehler:
    parameters:
      - $ref: '#/components/parameters/StandortIdPath'
    get:
      operationId: zaehlerUnterKnoten
      tags: [standort]
      summary: Kern-Query — alle Zähler unter diesem Knoten zum Stichtag T (D6)
      description: >
        ABAC-Aktion `read:standort`. Rollen `betrieb`/`compliance-auditor`.
        PII-frei, vollständig innerhalb `energy.*` (kein `identity`-Zugriff).
        `stichtag` Default `now()`; `inklusiveUnterknoten` Default `true`
        (gesamter Teilbaum via `pfad @> ARRAY[:knoten]`, D6).
      parameters:
        - name: stichtag
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: inklusiveUnterknoten
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Zähler, die zum Stichtag an diesem Knoten (bzw. Teilbaum) verortet waren.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ZaehlerUnterKnotenItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/zaehler/{zaehlerId}/verortung:
    parameters:
      - $ref: '#/components/parameters/ZaehlerIdPath'
    get:
      operationId: zaehlerAktuelleVerortung
      tags: [standort]
      summary: Aktuelle Verortung eines Zählers inkl. Breadcrumb-Pfad (D6, Wurzel zuerst)
      description: >
        ABAC-Aktion `read:standort` — dieselbe Struktur-Lesestufe wie die
        Baum-/Kern-Query-Routen (D5): liefert AUSSCHLIESSLICH `id`/`typ`/
        `ebene`/`status` je Pfadknoten, NIEMALS Bezeichnung/Adresse. Rollen
        `betrieb`/`compliance-auditor`. Schließt die bislang fehlende
        Umkehrrichtung zu `GET .../standorte/{id}/zaehler` (D6): „Wo hängt
        dieser Zähler?" (Betriebs-UI-Konzept). `pfad` ist die Vorfahrenkette
        (materialisierter Pfad, D6) INKLUSIVE des eigenen Standort-Knotens,
        WURZEL ZUERST (Breadcrumb-Reihenfolge) — Labels holt die UI wie
        gewohnt über den bestehenden Batch-Endpunkt
        `POST .../standorte/labels` (`read:standort_pii`); dieser Lesepfad
        führt KEINEN neuen Weg zu Bezeichnungen ein. `verortet=false`
        (EMPTY-STATE, 200 statt 404) sowohl bei einem Zähler OHNE jede
        Verortung als auch bei einem Zähler mit AUSSCHLIESSLICH
        historischen (bereits beendeten) Verortungen — nur die aktuell
        OFFENE Zeitscheibe (`gueltig_bis IS NULL`) zählt als "aktuell".
      responses:
        '200':
          description: Aktuelle Verortung (ggf. `verortet=false`, Empty-State — kein Fehler).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZaehlerStandortAktuellDetail'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    post:
      operationId: zaehlerVerortungAnlegen
      tags: [standort]
      summary: Zähler verorten ("Umsetzen" — beendet die offene Vorgänger-Verortung atomar)
      description: >
        ABAC-Aktion `create:zaehler_standort`. Rolle `betrieb`. Öffnet eine
        neue Zeitscheibe (`gueltig_bis IS NULL`) UND schließt — sofern
        vorhanden — die aktuell offene Vorgänger-Verortung dieses Zählers
        GENAU an `gueltigVon` (D3, "Umsetzen") in DERSELBEN Transaktion:
        zwei Zeitscheiben ohne Lücke, ohne Overlap. `EXCLUDE`-Constraint
        (D-EXCL) bleibt der atomare Garant gegen Races. Audit
        `zaehler.standort.zugeordnet`
        (kontext={synthetic,zaehler_id,standort_id,gueltig_von}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZaehlerVerortungAnlegen'
      responses:
        '201':
          description: Verortung angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZaehlerStandortDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/zaehler/{zaehlerId}/verortung/beenden:
    parameters:
      - $ref: '#/components/parameters/ZaehlerIdPath'
    post:
      operationId: zaehlerVerortungBeenden
      tags: [standort]
      summary: Aktuell offene Zähler-Verortung beenden
      description: >
        ABAC-Aktion `update:zaehler_standort`. Rolle `betrieb`. IDEMPOTENT
        bezüglich desselben Endzeitpunkts. Audit `zaehler.standort.beendet`
        (kontext={synthetic,zaehler_id,standort_id,gueltig_bis}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZaehlerVerortungBeenden'
      responses:
        '200':
          description: Verortung beendet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZaehlerStandortDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  # =====================================================================
  # Einflussgrößen (ADR-0006 Teil B, B8/B10 — einfluss.katalog/intervall/befund, V0020/V0021)
  # =====================================================================
  /stammdaten/systeme/{systemId}/einflussgroessen:
    parameters:
      - $ref: '#/components/parameters/SystemIdPath'
    post:
      operationId: einflussgroesseErfassen
      tags: [einflussgroesse]
      summary: Einflussgröße erfassen (Zustands-Zeitreihe, D8.2/D8.3)
      description: >
        ABAC-Aktion `create:einflussgroesse`. Rolle `betrieb`. `endkundeId`
        wird AUSSCHLIESSLICH aus dem System abgeleitet (RL-B1) — der
        Request-Body trägt bewusst KEIN `endkundeId`-Feld. `groesseCode`
        muss ein AKTIVER `einfluss.katalog`-Code sein; `wertNum` XOR
        `wertCode` je nach `wert_art` des Katalog-Eintrags. Bei
        `betroffenerTyp=anschlussnutzer` sind `rechtsgrundlage=art6_1f`,
        `abwaegungRef` und `art14InformationAt` zwingend (Art. 14 DSGVO).
        Bei gesetztem `standortId`: an/unter diesem Knoten muss im
        angegebenen Zeitraum eine Zähler-Verortung bestehen (RL-B1, ADR-0010
        D3), sonst 400. Ein offenes Vorgänger-Intervall derselben
        (`systemId`,`groesseCode`) wird atomar geschlossen ("Umsetzen",
        analog Zähler-Verortung); ein ECHTER zeitlicher Overlap liefert 409
        (`ex_einfluss_no_overlap`). Synthetic-only. Audit
        `einflussgroesse.stammdaten.erfasst`
        (kontext={synthetic,einflussgroesse_id,endkunde_id,system_id,groesse_code,gueltig_ab_monat,gueltig_bis_monat,betroffener_typ,quelle_typ,rechtsgrundlage}
        — AUSDRÜCKLICH KEIN wert_num/wert_code/anlass_code, A9).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EinflussgroesseErfassen'
      responses:
        '201':
          description: Einflussgröße erfasst.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinflussgroesseDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }
    get:
      operationId: einflussgroesseListe
      tags: [einflussgroesse]
      summary: Einflussgrößen eines Systems auflisten (Klartext, PII-Lesestufe)
      description: >
        ABAC-Aktion `read:einflussgroesse`. Rolle `betrieb` NUR
        (`compliance-auditor` bleibt strukturell ausgeschlossen — RBAC UND
        eine eigenständige PDP-Regel, Defense-in-Depth, B10: "Klartext-PII-
        Leseaktion"). Liefert die VOLLSTÄNDIGEN Intervall-Zeilen inkl.
        `wertNum`/`wertCode` — KEINE Verschlüsselung/Pseudonymisierung
        (`migrations/V0020` D-ROLLE). IMMER auditiert (auch bei Ablehnung),
        EIN Audit-Event je Aufruf
        (`einflussgroesse.stammdaten.einsicht`,
        kontext={synthetic,system_id,endkunde_id,anzahl_saetze}), NICHT
        eines je Zeile. Synthetic-only. Bewusst UNPAGINIERT (fachlich
        bounded: fünf Katalog-Codes je System).
      responses:
        '200':
          description: Einflussgrößen-Intervalle des Systems (Klartext).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EinflussgroesseDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/einflussgroessen/{einflussgroesseId}:
    parameters:
      - $ref: '#/components/parameters/EinflussgroesseIdPath'
    patch:
      operationId: einflussgroesseKorrigieren
      tags: [einflussgroesse]
      summary: Einflussgröße korrigieren (schließt + legt optional eine neue Zeile an)
      description: >
        ABAC-Aktion `update:einflussgroesse`. Rolle `betrieb`. Schließt IMMER
        das adressierte Intervall (`gueltigBisMonat` — die EINZIGE erlaubte
        UPDATE-Spalte, `migrations/V0020` D-UPDATE-SCOPE, spaltenscharfer
        GRANT). `korrektur` (optional) legt zusätzlich, in DERSELBEN
        Transaktion, eine NEUE Zeile mit `anlassCode=korrektur` an
        (append-only — Werte werden NIE überschrieben); `groesseCode` wird
        dabei vom ursprünglichen Intervall GEERBT (keine Änderung der
        Einflussgröße über diese Route). Emittiert BIS ZU ZWEI Audit-Events:
        IMMER `einflussgroesse.stammdaten.geaendert` (das Schließen,
        kontext wie beim Erfassen) UND — nur bei begleitender Korrektur-Zeile
        — ZUSÄTZLICH `einflussgroesse.stammdaten.erfasst` für die neue Zeile.
        Synthetic-only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EinflussgroesseKorrigieren'
      responses:
        '200':
          description: Intervall geschlossen (ggf. inkl. neuer Korrektur-Zeile).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EinflussgroesseKorrekturErgebnis'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/endkunden/{endkundeId}/einflussgroessen/befunde:
    parameters:
      - $ref: '#/components/parameters/EndkundeIdPath'
    get:
      operationId: einflussgroesseBefunde
      tags: [einflussgroesse]
      summary: TB-03-Schwellwertüberschreitungen eines Endkunden auflisten
      description: >
        ABAC-Aktion `read:einflussgroesse`. Rolle `betrieb` NUR (Auditor-
        Deny, analog der Liste je System). v1 NUR LESEND — die Schwellwert-
        **Erkennung** (schreibt `einfluss.befund`) ist NICHT Teil dieser
        Version (`tb03_schwellwert` im Katalog noch überall `NULL`). Liefert
        AUSSCHLIESSLICH klassierte Überschreitungen (`ueberschreitungKlasse`),
        NIEMALS einen Rohprozentsatz (B12.5). KEIN eigenes Audit-Event (kein
        Klartext-PII-Zugriff — `einfluss.befund` trägt keinen
        Einflussgrößen-Wert). Bewusst UNPAGINIERT.
      responses:
        '200':
          description: TB-03-Befunde (ggf. leer).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EinflussgroesseBefundItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: >
        OIDC via Keycloak (ADR-0002, Realm `edms`). Bearer-Access-Token,
        serverseitig gegen die Keycloak-JWKS validiert (JwtAuthGuard). AuthZ
        (RBAC @Roles + ABAC-PDP) im PolicyInterceptor; Default = deny.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.local/realms/edms/protocol/openid-connect/auth
          tokenUrl: https://auth.example.local/realms/edms/protocol/openid-connect/token
          scopes: {}

  parameters:
    IngestQuelleQuery:
      name: quelle
      in: query
      required: false
      description: Filtert auf EINEN Netzserver (ADR-0011 D8).
      schema: { type: string, maxLength: 63 }
    IngestGrundQuery:
      name: grund
      in: query
      required: false
      description: Filtert auf EINEN Quarantaene-Grund.
      schema: { $ref: '#/components/schemas/IngestQuarantaeneGrund' }
    CursorParam:
      name: cursor
      in: query
      required: false
      description: >
        Opaker Cursor der Vorseite (aus `seite.naechsterCursor`). Cursor-basiert,
        kein offset (api-contracts.md).
      schema:
        type: string
        maxLength: 512
    LimitParam:
      name: limit
      in: query
      required: false
      description: Seitengröße, max. 100 (api-contracts.md).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-erzeugter Idempotenz-Schlüssel (UUID empfohlen) je schreibender
        Operation. Wiederholung mit gleichem Schlüssel liefert dasselbe Ergebnis,
        ohne den Effekt zu duplizieren.
      schema:
        type: string
        minLength: 8
        maxLength: 200
    EndkundeIdPath:
      name: endkundeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SystemIdPath:
      name: systemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ZaehlerIdPath:
      name: zaehlerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MesskanalIdPath:
      name: messkanalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnschlussnutzerIdPath:
      name: anschlussnutzerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NutzungsverhaeltnisIdPath:
      name: nutzungsverhaeltnisId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionNrPath:
      name: versionNr
      in: path
      required: true
      description: Fortlaufende Versionsnummer der Messkonzept-Version.
      schema: { type: integer, minimum: 1 }
    AntragIdPath:
      name: antragId
      in: path
      required: true
      description: Shred-Antrag-ID (ADR-0009).
      schema: { type: string, format: uuid }
    GeraetZuordnungIdPath:
      name: geraetZuordnungId
      in: path
      required: true
      description: Geraete-Zuordnungs-ID (device.geraet_zuordnung.id, ADR-0005 §26).
      schema: { type: string, format: uuid }
    StandortIdPath:
      name: standortId
      in: path
      required: true
      description: Standort-ID (energy.standort.id, ADR-0010).
      schema: { type: string, format: uuid }
    EinflussgroesseIdPath:
      name: einflussgroesseId
      in: path
      required: true
      description: Einflussgrößen-Intervall-ID (einfluss.intervall.id, ADR-0006 Teil B).
      schema: { type: string, format: uuid }

  responses:
    UngueltigeEingabe:
      description: Ungültige Eingabe (Validierung fehlgeschlagen). PII-frei.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Kein/ungültiges/abgelaufenes Access-Token (AuthN, JwtAuthGuard).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: >
        AuthZ-Ablehnung (RBAC/ABAC, PolicyInterceptor) — Rolle fehlt, Datenklasse/
        Zustand nicht erlaubt, oder break-glass-Grenzen verletzt. Wird auditiert
        (`authz.zugriff.verweigert`, M2). PII-frei, strukturierter Grund.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NichtGefunden:
      description: Ressource nicht gefunden.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Konflikt:
      description: >
        Konflikt (z. B. Eindeutigkeits-/Overlap-Verletzung, oder Version bereits
        vorhanden). PII-frei.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unerwartet:
      description: Unerwarteter Fehler. PII-/stacktrace-frei (DS-10).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------------------------------------------------------------
    # Fehler + Pagination + Enums
    # ---------------------------------------------------------------
    Problem:
      # RFC 9457 erlaubt Extension-Member; daher bewusst KEIN
      # additionalProperties:false. Response-Objekt, kein Request-DTO.
      type: object
      description: Fehlerobjekt nach RFC 9457 (application/problem+json).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail:
          type: string
          description: >
            Menschenlesbare, PII-freie Detailbeschreibung. NIEMALS roher DB-/
            Krypto-/IdP-Fehlertext, kein Stacktrace, keine Tokens/Secrets/PII.
        instance: { type: string, format: uri }

    SeitenInfo:
      type: object
      additionalProperties: false
      required: [limit]
      description: Cursor-Pagination-Metadaten.
      properties:
        naechsterCursor:
          type: [string, 'null']
          description: Opaker Cursor der nächsten Seite; null = letzte Seite.
        limit:
          type: integer
          minimum: 1
          maximum: 100

    VerarbeitungsStatus:
      type: string
      enum: [aktiv, gesperrt, geloescht]
      description: aktiv | gesperrt (Art. 18) | geloescht/anonym (Art. 17).
    EinschraenkungGrund:
      type: string
      enum:
        - art18_1a_richtigkeit
        - art18_1b_unrechtmaessig
        - art18_1c_rechtsverteidigung_betroffener
        - art18_1d_widerspruch
      description: >
        Geschlossene Liste der vier Tatbestaende des Art. 18 Abs. 1 DSGVO
        (`energy.endkunde.einschraenkung_grund_code` /
        `energy.anschlussnutzer.einschraenkung_grund_code`, V0024, per
        CHECK erzwungen). Art. 18 Abs. 1 kennt KEINE Auffangklausel — es gibt
        daher bewusst keinen fuenften Code „sonstiges": ein solcher waere binnen
        Wochen der Sammeleimer und stellte den mit Auflage A11 beseitigten
        Pauschal-Blocker ueber die Hintertuer wieder her.


        WIRKUNG im Nachweis (ADR-0007 C4/A11): `art18_1a_richtigkeit` und
        `art18_1c_rechtsverteidigung_betroffener` => Ausweis MIT Kennzeichnung
        (Preflight-Regel FJ-07b bzw. FJ-11b beim Anschlussnutzer).
        `art18_1b_unrechtmaessig` und `art18_1d_widerspruch` => PAAR-Ausschluss
        (FJ-07c/FJ-11c) — hier wuerde die Uebermittlung genau den Zustand
        ausweiten, den die Einschraenkung einfrieren soll.
        1a und 1d sind ihrem Wortlaut nach BEFRISTET (vgl. `gesperrtSeit`).


        Nicht-Art.-18-Verarbeitungsstopps — Einwilligungswiderruf (Art. 7
        Abs. 3, separat ueber `consentStatus`), betrieblicher Legal-Hold,
        Incident-bedingtes Einfrieren — werden hierueber NICHT abgebildet.
    AnschlussnutzerSperren:
      type: object
      additionalProperties: false
      description: >
        Request-Body von
        `POST /stammdaten/anschlussnutzer/{anschlussnutzerId}/sperren`.
        Inhaltlich identisch zu `EndkundeSperren` — bewusst ein EIGENES Schema,
        weil es eine eigenstaendige Ressource mit eigener betroffener Person
        ist; die gemeinsame Substanz steckt im geteilten
        `EinschraenkungGrund`-Enum.
      required: [grund]
      properties:
        grund:
          allOf:
            - $ref: '#/components/schemas/EinschraenkungGrund'
          description: PFLICHT — s. `EndkundeSperren.grund`.
        neuerhebungFortsetzen:
          type: boolean
          description: >
            Auflage C-8 (ADR-0012 Stufe C) — die Entscheidung, ob die
            Messdaten-Erhebung waehrend der Einschraenkung FORTGESETZT wird.

            PFLICHT bei `art18_1b_unrechtmaessig` und `art18_1d_widerspruch`,
            UNZULAESSIG bei `art18_1a_richtigkeit` und
            `art18_1c_rechtsverteidigung_betroffener` — beides wird mit 400
            beantwortet. Grund fuer die Asymmetrie: Art. 18 Abs. 2 nimmt die
            SPEICHERUNG aus der Einschraenkung aus, die Frage stellt sich
            deshalb nur dort, wo die Rechtmaessigkeit des Erhebens selbst in
            Frage steht. Bei lit. a/lit. c waere eine Angabe eine Aussage, die
            niemand getroffen hat.

            KEIN Default: `true` hiesse weitermessen, obwohl die
            Rechtmaessigkeit bestritten ist; `false` hiesse eine Messluecke
            erzeugen, die sich nachtraeglich nicht schliessen laesst. Eine
            abweichende Wiederholung bei gleichem Grund wird mit 409
            abgelehnt statt still verworfen — die Aenderung der Entscheidung
            ist ein eigener dokumentierter Vorgang.
    EinschraenkungFristItem:
      type: object
      additionalProperties: false
      required: [subjektTyp, subjektId, endkundeId, einschraenkungGrundCode, gesperrtSeit, tageOffen, ueberfaellig]
      properties:
        subjektTyp:
          type: string
          enum: [endkunde, anschlussnutzer]
        subjektId: { type: string, format: uuid }
        endkundeId:
          type: string
          format: uuid
          description: >
            Bezugs-Endkunde — beim Endkunden er selbst, beim Anschlussnutzer
            sein Endkunde. Einstieg für die Sachbearbeitung.
        einschraenkungGrundCode: { $ref: '#/components/schemas/EinschraenkungGrund' }
        gesperrtSeit: { type: string, format: date-time }
        tageOffen:
          type: integer
          description: Tage seit `gesperrtSeit`, in der Datenbank gerechnet (eine Zeitbasis).
        ueberfaellig:
          type: boolean
          description: '`tageOffen >= schwelleTage`. Markiert, löst nichts aus.'
    EinschraenkungFristReport:
      type: object
      additionalProperties: false
      required: [schwelleTage, items, ueberfaelligAnzahl]
      properties:
        schwelleTage: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/EinschraenkungFristItem' }
        ueberfaelligAnzahl: { type: integer }
    ErhebungsEntscheidungReport:
      type: object
      additionalProperties: false
      required: [items, entscheidungOffenAnzahl, erhebungGestopptAnzahl]
      description: Auflage C-8 — Stand der Entscheidungen ueber die weitere Messdaten-Erhebung.
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ErhebungsEntscheidungItem' }
        entscheidungOffenAnzahl:
          type: integer
          description: Sperren mit lit. b / lit. d, bei denen niemand entschieden hat.
        erhebungGestopptAnzahl:
          type: integer
          description: Sperren, bei denen die Messung ausdruecklich gestoppt wurde.
    ErhebungsEntscheidungItem:
      type: object
      additionalProperties: false
      required: [subjektTyp, subjektId, endkundeId, einschraenkungGrundCode, gesperrtSeit, tageOffen, lage]
      properties:
        subjektTyp: { type: string, enum: [endkunde, anschlussnutzer] }
        subjektId: { type: string, format: uuid }
        endkundeId:
          type: string
          format: uuid
          description: Bezugs-Endkunde — beim Endkunden er selbst, beim Anschlussnutzer sein Endkunde.
        einschraenkungGrundCode: { $ref: '#/components/schemas/EinschraenkungGrund' }
        gesperrtSeit: { type: string, format: date-time }
        tageOffen: { type: integer }
        lage:
          type: string
          enum: [entscheidung_offen, erhebung_gestoppt, erhebung_laeuft]
          description: >
            `entscheidung_offen` heisst „nicht entschieden", NICHT
            „entschieden, nicht zu erheben". Die Unterscheidung ist der Zweck
            dieses Berichts — sie zu verwischen waere derselbe Fehler, den
            die Spalte ohne Default vermeidet.
    EinschraenkungUnterrichtung:
      type: object
      additionalProperties: false
      description: >
        Body der Unterrichtungs-Route (Art. 18 Abs. 3 DSGVO). Geteilt von
        Endkunde und Anschlussnutzer — der Vorgang ist für beide identisch.


        Kein Feld für den Zeitpunkt und keines für den Ausführenden: beides
        wird serverseitig gesetzt. Sonst wäre der Nachweis rückdatierbar bzw.
        einem Dritten zuschreibbar — und genau das soll er belegen.
      required: [kanal]
      properties:
        kanal:
          type: string
          enum: [postalisch, elektronisch, telefonisch, persoenlich]
          description: >
            Auf welchem Weg unterrichtet wurde. GESCHLOSSENE Liste, bewusst
            KEIN Freitext: ein Freitextfeld enthielte binnen Wochen
            Kontaktdaten („Mail an …") und trüge damit PII in eine Tabelle und
            ein Audit-Log, die beide bewusst keine führen.
    EndkundeSperren:
      type: object
      additionalProperties: false
      description: >
        Request-Body von `POST /stammdaten/endkunden/{endkundeId}/sperren`.
        Whitelisted Grund, kein Freitext (Linie 2, Muster
        `StandortStilllegen`).


        `gesperrtSeit` ist bewusst KEIN Feld: der Zeitpunkt wird serverseitig
        gesetzt, damit er nicht rueckdatiert werden kann (A11.3).
      required: [grund]
      properties:
        grund:
          allOf:
            - $ref: '#/components/schemas/EinschraenkungGrund'
          description: >
            PFLICHT. Ohne den Grund ist Art. 18 Abs. 2 nicht anwendbar — welcher
            der vier abschliessenden Erlaubnistatbestaende die Uebermittlung
            traegt, haengt am Sperrgrund. Fehlt er, muss fail-closed
            ausgeschlossen werden, was die betroffene Person SCHLECHTER stellt.
            Rechtsgrundlage der Speicherung: Art. 6 Abs. 1 lit. c i. V. m.
            Art. 18/Art. 12 und Art. 5 Abs. 2.
        neuerhebungFortsetzen:
          type: boolean
          description: >
            Auflage C-8 (ADR-0012 Stufe C) — die Entscheidung, ob die
            Messdaten-Erhebung waehrend der Einschraenkung FORTGESETZT wird.

            PFLICHT bei `art18_1b_unrechtmaessig` und `art18_1d_widerspruch`,
            UNZULAESSIG bei `art18_1a_richtigkeit` und
            `art18_1c_rechtsverteidigung_betroffener` — beides wird mit 400
            beantwortet. Grund fuer die Asymmetrie: Art. 18 Abs. 2 nimmt die
            SPEICHERUNG aus der Einschraenkung aus, die Frage stellt sich
            deshalb nur dort, wo die Rechtmaessigkeit des Erhebens selbst in
            Frage steht. Bei lit. a/lit. c waere eine Angabe eine Aussage, die
            niemand getroffen hat.

            KEIN Default: `true` hiesse weitermessen, obwohl die
            Rechtmaessigkeit bestritten ist; `false` hiesse eine Messluecke
            erzeugen, die sich nachtraeglich nicht schliessen laesst. Eine
            abweichende Wiederholung bei gleichem Grund wird mit 409
            abgelehnt statt still verworfen — die Aenderung der Entscheidung
            ist ein eigener dokumentierter Vorgang.
    ConsentStatus:
      type: string
      enum: [aktiv, fehlt, widerrufen]
      description: Consent-Slot — nur anzeigen/respektieren, nicht erfassen (Consent-ADR).
    Energietraeger:
      type: string
      enum: [strom, waerme, kaelte, gas, oel, biomasse]
      description: ESZ-Energieträger (F7); Wasser NICHT in v1.
    BetriebsStatus:
      type: string
      enum: [aktiv, stillgelegt]
      description: aktiv | stillgelegt (nie hart löschen).
    MessgroesseArt:
      type: string
      enum: [kumulativ_zaehlerstand, intervall_verbrauch]
    MesskonzeptTyp:
      type: string
      enum: [vereinfacht, standard, alternativ]
    Datenklasse:
      type: string
      enum: [abrechnungsminimum, detailverbrauch]
      description: ABAC-Steuergröße (DS-07); Default abrechnungsminimum.
    NutzungsRolle:
      type: string
      enum: [mieter, eigentuemer_selbstnutzer, gewerbe_nutzer, sonstige]
      description: >
        Rolle des Anschlussnutzers im Verhältnis. Enum-Set v1; Erweiterung mit
        dem ersten Mieter-Projekt (ADR-0004 §8.2/O3).
    LueckenTyp:
      type: string
      enum:
        - kein_messkonzept
        - kein_zaehler
        - kein_messkanal
        - kein_aktiver_consent
        - keine_mindestaufloesungs_zusage
      description: Fehlende Stammdaten je Entität (DE-02).

    # ---------------------------------------------------------------
    # Endkunde
    # ---------------------------------------------------------------
    EndkundeLabelsAnfrage:
      type: object
      additionalProperties: false
      required: [endkundeIds]
      properties:
        endkundeIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: >
            Obergrenze 100 (A2) — bewusst NICHT 500 wie beim Standort-Batch:
            dieser Endpunkt liegt nicht unter `{endkundeId}` und hat keine
            Mandantengrenze als natürlichen Deckel. 100 = `limit`-Maximum aus
            `api-contracts.md`; die aufrufende Seitengröße MUSS ≤ 100 bleiben
            (A2-Korollar K4). `uniqueItems` ist nicht bloß Hygiene (N2): ohne
            sie liessen sich 100 identische Ids senden und `anzahl_angefragt`
            gegenüber `anzahl_endkunden` aufblähen — das verfälschte genau die
            Differenz, mit der A4 nachgewiesen wird.
          items: { type: string, format: uuid }
    EndkundeLabelItem:
      type: object
      additionalProperties: false
      description: >
        `read:endkunde_pii`-Lesestufe — pii=true. AUSSCHLIESSLICH `{id, name}`
        (A1). Dediziertes Schema, NICHT wiederverwenden und NICHT um Felder
        erweitern (Erweiterung = neues `compliance-director`-Votum).
      required: [id, name]
      properties:
        id: { type: string, format: uuid, description: Pseudonym-Surrogat. }
        name:
          type: string
          maxLength: 512
          description: 'pii=true; grundlage=Art.6(1)(b)/(a); ADR-0004 Anhang B P1.'
    EndkundeListItem:
      type: object
      additionalProperties: false
      description: Listen-Projektion — PII-FREI (Linie 2).
      required: [id, verarbeitungsStatus, consentStatus, vonWissAuswertungAusgenommen, endkundengruppe, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Pseudonym-Surrogat (energy.endkunde.id, UUIDv7). pii=false.
        verarbeitungsStatus: { $ref: '#/components/schemas/VerarbeitungsStatus' }
        consentStatus:
          allOf: [{ $ref: '#/components/schemas/ConsentStatus' }]
          deprecated: true
          description: >-
            UEBERHOLT. Spiegelt `energy.endkunde.consent_status` — einen Slot aus
            V0002, den V0044 abgeloest hat. Die Einwilligung ist seither ein
            Ereignis (`consent.einwilligung`) und je Zweck und Subjektart zu
            beurteilen (`consent.zweck_subjekt`, V0047); ein einzelner Status am
            Endkunden kann das nicht abbilden. Das Feld steht dauerhaft auf
            `fehlt` und wird von keiner Schreibroute mehr gepflegt. Die
            belastbare Auskunft liefert `GET /consent/einwilligungen`. Bleibt
            vorerst im Vertrag (Entfernen waere ein Breaking Change), wird aber
            in der Oberflaeche nicht mehr angezeigt.
        vonWissAuswertungAusgenommen:
          type: boolean
          description: DE-04-Flag (Nicht-PII, ABAC-Eingabe).
        endkundengruppe:
          type: [string, 'null']
          maxLength: 200
          description: >
            Endkundengruppe/Branche für den LK-Nachweis (V0074) — z. B.
            „Kreditinstitut". Trägt die Blätter 1, 6b und 7 des
            Einsparungsnachweises und das BAFA-Formular „Nachweis der
            leistungsabhängigen Komponente".

            FREITEXT: Die maßgebliche Werteliste ist die des LK-Formulars und
            liegt dem Projekt nicht vor; eine erfundene Kategorienliste sähe
            verbindlich aus und müsste beim ersten echten Nachweis
            umgeschlüsselt werden. Erweiterung zur Katalogtabelle ist additiv
            vorgesehen.

            NICHT zu verwechseln mit der Rechtsform (natürliche/juristische
            Person). Der Wert verlässt das System im pseudonymisierten
            Nachweis — das ist sein Zweck.
        createdAt: { type: string, format: date-time }
    EndkundeListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten:
          type: array
          items: { $ref: '#/components/schemas/EndkundeListItem' }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    EndkundePii:
      type: object
      additionalProperties: false
      description: >
        Direkt-PII des Vertragspartners (identity.endkunde_pii.*_enc,
        AES-256-GCM). pii=true. Nur im Detail, nur projektions-erlaubt (D6).
      required: [name, anschrift]
      properties:
        name:
          type: string
          maxLength: 512
          description: 'pii=true; grundlage=Art.6(1)(b)/(a); ADR-0004 Anhang B P1.'
        anschrift:
          type: string
          maxLength: 1024
          description: 'pii=true; grundlage=Art.6(1)(b); ADR-0004 Anhang B P2.'
        kontakt:
          type: [string, 'null']
          maxLength: 512
          description: 'pii=true; grundlage=Art.6(1)(a) (TB-06); ADR-0004 Anhang B P3.'
    EndkundeDetail:
      type: object
      additionalProperties: false
      required: [id, verarbeitungsStatus, consentStatus, vonWissAuswertungAusgenommen, endkundengruppe, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, description: Pseudonym-Surrogat. }
        verarbeitungsStatus: { $ref: '#/components/schemas/VerarbeitungsStatus' }
        consentStatus:
          allOf: [{ $ref: '#/components/schemas/ConsentStatus' }]
          deprecated: true
          description: >-
            UEBERHOLT. Spiegelt `energy.endkunde.consent_status` — einen Slot aus
            V0002, den V0044 abgeloest hat. Die Einwilligung ist seither ein
            Ereignis (`consent.einwilligung`) und je Zweck und Subjektart zu
            beurteilen (`consent.zweck_subjekt`, V0047); ein einzelner Status am
            Endkunden kann das nicht abbilden. Das Feld steht dauerhaft auf
            `fehlt` und wird von keiner Schreibroute mehr gepflegt. Die
            belastbare Auskunft liefert `GET /consent/einwilligungen`. Bleibt
            vorerst im Vertrag (Entfernen waere ein Breaking Change), wird aber
            in der Oberflaeche nicht mehr angezeigt.
        consentTextVersion: { type: [string, 'null'], maxLength: 100 }
        vonWissAuswertungAusgenommen: { type: boolean }
        endkundengruppe:
          type: [string, 'null']
          maxLength: 200
          description: >
            Endkundengruppe/Branche für den LK-Nachweis (V0074) — z. B.
            „Kreditinstitut". Trägt die Blätter 1, 6b und 7 des
            Einsparungsnachweises und das BAFA-Formular „Nachweis der
            leistungsabhängigen Komponente".

            FREITEXT: Die maßgebliche Werteliste ist die des LK-Formulars und
            liegt dem Projekt nicht vor; eine erfundene Kategorienliste sähe
            verbindlich aus und müsste beim ersten echten Nachweis
            umgeschlüsselt werden. Erweiterung zur Katalogtabelle ist additiv
            vorgesehen.

            NICHT zu verwechseln mit der Rechtsform (natürliche/juristische
            Person). Der Wert verlässt das System im pseudonymisierten
            Nachweis — das ist sein Zweck.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        einschraenkungGrundCode:
          oneOf:
            - $ref: '#/components/schemas/EinschraenkungGrund'
            - type: 'null'
          description: >
            Art.-18-Grund der Verarbeitungseinschraenkung; `null`, solange der
            Endkunde nicht gesperrt ist — `ck_endkunde_einschraenkung_kohaerenz`
            (V0024) laesst den Grund ausschliesslich bei
            verarbeitungsStatus=gesperrt zu.
            INTERN (ADR-0007 C4 Punkt 6): verlaesst das System nur als neutraler
            Sammelcode `datenschutzrechtliche_einschraenkung` — BAFA-Export,
            Nutzerinformation und Mehrwertdienste sehen den differenzierten
            Grund NIE.
            Sichtbar fuer `betrieb` UND `compliance-auditor` (A11.4): `betrieb`
            setzt die Sperre und braucht den Grund zur Fristenkontrolle
            (Art. 18 Abs. 1 lit. a/d sind befristet); der Auditor prueft, ob die
            Preflight-Einstufung (FJ-07b vs. FJ-07c) zum dokumentierten Grund
            passt — ohne Sicht darauf ist genau diese Kontrolle nicht
            auditierbar.
            BEWUSST NICHT ueber `PiiProjektionsPolicy` maskiert: die liefert
            `null` fuer jeden nicht-aktiven Status, der Grund existiert aber nur
            bei `gesperrt` — er waere also nie sichtbar.
            NICHT filter-/sortierbar und NICHT im `EndkundeListItem`, sonst
            wuerde aus einem Zustandsfeld eine abfragbare
            Betroffenenrechts-Kartei.
        gesperrtSeit:
          type: [string, 'null']
          format: date-time
          description: >
            Zeitpunkt der Verarbeitungseinschraenkung (UTC, serverseitig
            gesetzt — kein Client-Wert, A11.3: kein Rueckdatieren; ein
            abweichendes Antragseingangsdatum gehoert in die Vorgangsakte).
            Grundlage der Fristenueberwachung fuer Art. 18 Abs. 1 lit. a/d.
        neuerhebungFortsetzen:
          type: [boolean, 'null']
          description: >
            Auflage C-8 — die am Sperrvorgang festgehaltene Entscheidung ueber
            die WEITERE ERHEBUNG. `null` heisst „Frage stellt sich nicht"
            (lit. a/lit. c) oder „keine Einschraenkung"; NICHT „entschieden,
            nicht weiterzuerheben". Wird beim Aufheben der Einschraenkung
            zusammen mit Grund und Zeitpunkt genullt — sie gehoert zu GENAU
            DIESER Einschraenkung. Sichtbarkeit wie `einschraenkungGrundCode`:
            wer den Grund sehen darf, muss auch sehen, was daraus fuer die
            Messung folgt.
        stammdatenPii:
          description: >
            PII-Block. NULL, wenn die aufrufende Rolle/der Zustand keinen
            PII-Zugriff erlaubt (compliance-auditor, gesperrt, geschreddert) —
            Laufzeit-Maskierung (D6). Für Rolle `betrieb` bei aktivem Subjekt befüllt.
          oneOf:
            - { $ref: '#/components/schemas/EndkundePii' }
            - { type: 'null' }
    EndkundeAnlegen:
      type: object
      additionalProperties: false
      required: [stammdatenPii]
      properties:
        stammdatenPii: { $ref: '#/components/schemas/EndkundePii' }
        endkundengruppe:
          type: string
          minLength: 1
          maxLength: 200
          description: 'Branche für den LK-Nachweis (V0074). S. `EndkundeDetail.endkundengruppe`.'
        vonWissAuswertungAusgenommen:
          type: boolean
          deprecated: true
          description: >
            WIRD ABGEWIESEN (**400**). Das DE-04-Ausnahme-Attribut wird seit
            AW-27 (V0052) AUSSCHLIESSLICH über eine Erklärung gesetzt:
            `POST /consent/widersprueche` mit `zweckCode: wiss_auswertung`.
            Ein von Hand gesetztes Flag behauptet einen Vorgang, den niemand
            belegen kann — für eine Auskunft nach Art. 15 und den Nachweis
            nach Art. 5 Abs. 2 ist aber genau die Frage, wer wann auf welchem
            Weg widersprochen hat.

            Das Feld bleibt im Vertrag, damit ein Aufruf mit ihm einen
            erklärten Fehler bekommt statt der generischen
            `forbidNonWhitelisted`-Meldung. Gelesen wird es weiterhin
            (`EndkundeDetail`, `EndkundeListItem`) — dort ist es die
            Durchsetzungsstelle.
    EndkundeAendern:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Teil-Update; consent_status ist NICHT setzbar (Consent-ADR).
      properties:
        stammdatenPii: { $ref: '#/components/schemas/EndkundePii' }
        endkundengruppe:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Branche für den LK-Nachweis (V0074), nachträglich setzbar oder
            korrigierbar. S. `EndkundeDetail.endkundengruppe`.
        vonWissAuswertungAusgenommen:
          type: boolean
          deprecated: true
          description: >
            WIRD ABGEWIESEN (**400**). Das DE-04-Ausnahme-Attribut wird seit
            AW-27 (V0052) AUSSCHLIESSLICH über eine Erklärung gesetzt:
            `POST /consent/widersprueche` mit `zweckCode: wiss_auswertung`.
            Ein von Hand gesetztes Flag behauptet einen Vorgang, den niemand
            belegen kann — für eine Auskunft nach Art. 15 und den Nachweis
            nach Art. 5 Abs. 2 ist aber genau die Frage, wer wann auf welchem
            Weg widersprochen hat.

            Das Feld bleibt im Vertrag, damit ein Aufruf mit ihm einen
            erklärten Fehler bekommt statt der generischen
            `forbidNonWhitelisted`-Meldung. Gelesen wird es weiterhin
            (`EndkundeDetail`, `EndkundeListItem`) — dort ist es die
            Durchsetzungsstelle.
    KryptoShreddingAnweisung:
      type: object
      additionalProperties: false
      required: [bestaetigung, grund]
      description: Expliziter Vorsatz für die irreversible Art.-17-Löschung.
      properties:
        bestaetigung:
          type: string
          enum: [ENDGUELTIG_LOESCHEN]
          description: Muss exakt `ENDGUELTIG_LOESCHEN` sein (Fehlbedienungsschutz).
        grund:
          type: string
          enum: [betroffenenantrag_art17, aufbewahrung_abgelaufen, sonstige_rechtsgrundlage]
          description: Whitelisted Löschgrund (kein Freitext, Linie 2).
    ShreddingErgebnis:
      type: object
      additionalProperties: false
      required: [id, verarbeitungsStatus, geschreddert, standortPiiNeutralisiert, analyticsLaeufeUnveraendert, einflussIntervalleUnveraendert]
      properties:
        id: { type: string, format: uuid }
        verarbeitungsStatus: { $ref: '#/components/schemas/VerarbeitungsStatus' }
        geschreddert: { type: boolean, description: true = DEK vernichtet (unwiderruflich). }
        standortPiiNeutralisiert:
          type: integer
          minimum: 0
          description: >
            ADR-0010 D4 (neue Shred-Dimension "Standort-PII", analog ADR-0005
            §26 GB-C) — Anzahl der in DIESEM Aufruf neutralisierten
            identity.standort_pii-Zeilen (Reichweiten-Nachweis). Der
            Endkunden-DEK (== Standort-DEK) wird ohnehin nur einmal
            vernichtet; dieses Feld belegt zusätzlich die Reichweite. `0` bei
            einem idempotenten Wiederholungsaufruf.
        analyticsLaeufeUnveraendert:
          type: integer
          minimum: 0
          description: >
            ADR-0006 P5b/A7 — Anzahl der pseudonymen
            analytics.berechnungslauf-Zeilen des Endkunden, die den Shred
            BEWUSST überleben (Art. 17(3)(b), BAFA-Nachweispflicht) und NICHT
            gelöscht werden. Ausweis der tatsächlich verbliebenen Bestände,
            damit der Report keine Vollständigkeit behauptet, die nicht
            besteht. Spiegelt den Bestand zum Shred-Zeitpunkt (auch beim
            idempotenten Wiederholungsaufruf).
        einflussIntervalleUnveraendert:
          type: integer
          minimum: 0
          description: >
            ADR-0006 P5b/A7 — analog zu analyticsLaeufeUnveraendert für die
            Einflussgrößen-Intervalle (einfluss.intervall) des Endkunden, die
            den Shred bewusst überleben (Art. 17(3)(b)). In v1 typischerweise
            0 (Einflussgrößen-Modul noch nicht implementiert, ADR-0006 C4/P3).

    # ---------------------------------------------------------------
    # Shred-Antrag (Vier-Augen-Krypto-Shredding-Workflow, ADR-0009,
    # Folgeauftrag ADR-0008 §29(C4)) — energy.endkunde_shred_antrag (V0008).
    # ---------------------------------------------------------------
    ShredAntragStatus:
      type: string
      enum: [beantragt, freigegeben, abgelehnt, ausgefuehrt, abgelaufen]
      description: >
        Zustandsautomat (ADR-0009 §2.1): beantragt -> (Freigabe durch zweite
        Person) -> ausgefuehrt; beantragt -> abgelehnt (terminal); beantragt
        -> abgelaufen (gueltigBis überschritten, terminal).
    ShredAblehnungsgrund:
      type: string
      enum: [kein_rechtsgrund, endkunde_widerspruch, fehlbedienung, sonstiges]
      description: >
        Whitelisted Ablehnungsgrund (kein Freitext, Linie 2). PROVISORISCHE
        v1-Liste (ADR-0009 §2.1/§8) — finale Bestätigung durch
        access-control-engineer/compliance-director steht aus.
    ShredAntrag:
      type: object
      additionalProperties: false
      required:
        - id
        - endkundeId
        - status
        - grund
        - beantragtVonSub
        - beantragtAm
        - gueltigBis
        - createdAt
        - updatedAt
      description: >
        `components/schemas/ShredAntrag` — EIN Schema für Listen-Item UND
        Einzel-Detail (ADR-0009 §2.1): keine PII zu maskieren,
        `beantragtVonSub`/`freigeberSub` sind opake, personenbeziehbare
        (pii=false) Principals, die das Frontend für die Vier-Augen-UX ohnehin
        immer benötigt (z. B. Freigeben-Button ausblenden, wenn
        `beantragtVonSub` === aktuelle Session-`sub`, ADR-0009 §2.5).
      properties:
        id: { type: string, format: uuid, description: Antrags-ID. }
        endkundeId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ShredAntragStatus' }
        grund:
          type: string
          enum: [betroffenenantrag_art17, aufbewahrung_abgelaufen, sonstige_rechtsgrundlage]
          description: Whitelisted Löschgrund aus dem ursprünglichen Antrag (kein Freitext, Linie 2).
        beantragtVonSub:
          type: string
          description: >
            Opaker Principal (kein FK). personenbeziehbar=true; pii=false;
            Vier-Augen-Workflow, analog audit.retention_freigabe.antragsteller
            (ADR-0009 §2.1/§2.6).
        beantragtAm: { type: string, format: date-time }
        freigeberSub:
          type: [string, 'null']
          description: >
            Opaker Principal, gesetzt bei Freigabe/Ablehnung. Muss !=
            beantragtVonSub sein (Vier-Augen, App-ABAC + DB-CHECK
            Integritäts-Guard, ADR-0009 §2.1/§2.7).
        entschiedenAm: { type: [string, 'null'], format: date-time }
        ablehnungsgrund:
          description: Whitelisted Ablehnungsgrund; NULL solange nicht abgelehnt.
          oneOf:
            - { $ref: '#/components/schemas/ShredAblehnungsgrund' }
            - { type: 'null' }
        gueltigBis:
          type: string
          format: date-time
          description: Verfallsfenster (beantragtAm + Frist, ADR-0009 §2.1/§5/§8).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ShredAntragListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/ShredAntrag' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    ShredFreigebenAnweisung:
      type: object
      additionalProperties: false
      required: [bestaetigung]
      description: >
        Eigenständiges Type-to-confirm der ZWEITEN Person (ADR-0009 §2.4) —
        bewusst getrennt von der Antragsentscheidung, kein `grund` (der steht
        bereits im ursprünglichen Antrag).
      properties:
        bestaetigung:
          type: string
          enum: [ENDGUELTIG_LOESCHEN]
          description: Muss exakt `ENDGUELTIG_LOESCHEN` sein (Fehlbedienungsschutz).
    ShredAblehnenAnweisung:
      type: object
      additionalProperties: false
      required: [ablehnungsgrund]
      properties:
        ablehnungsgrund: { $ref: '#/components/schemas/ShredAblehnungsgrund' }
    ShredFreigebenErgebnis:
      type: object
      additionalProperties: false
      required: [antrag, shredding]
      description: Antwort der `freigeben`-Route — aktualisierter Antrag + Shredding-Ergebnis (ADR-0009 §2.4).
      properties:
        antrag: { $ref: '#/components/schemas/ShredAntrag' }
        shredding: { $ref: '#/components/schemas/ShreddingErgebnis' }

    # ---------------------------------------------------------------
    # System / Messstelle
    # ---------------------------------------------------------------
    SystemListItem:
      type: object
      additionalProperties: false
      required: [id, endkundeId, bezeichnung, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid }
        bezeichnung: { type: string, maxLength: 200 }
        status: { $ref: '#/components/schemas/BetriebsStatus' }
        createdAt: { type: string, format: date-time }
    SystemListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/SystemListItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    SystemDetail:
      type: object
      additionalProperties: false
      required: [id, endkundeId, bezeichnung, systemgrenze, standortId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid }
        bezeichnung: { type: string, maxLength: 200 }
        systemgrenze:
          type: string
          maxLength: 2000
          description: Strukturelle/operative Grenze (TB-01 dokumentiert im Messkonzept).
        systembeschreibung: { type: [string, 'null'], maxLength: 4000 }
        standortId:
          type: [string, 'null']
          format: uuid
          description: >
            Standort (Liegenschaft/Gebäude) dieser Berechnungseinheit
            (V0074). Der Einsparungsnachweis definiert ein System als
            „1 Energieträger an 1 Standort eines Endkunden" und führt den
            Standort je System im Systemregister.

            NICHT dasselbe wie die Zähler-Verortung
            (`POST /stammdaten/zaehler/{id}/verortung`): die ist feiner
            (Raum/Etage) und temporal und sagt, wo ein GERÄT hängt. `null` =
            nicht erfasst; der Nachweis weist das aus, statt es zu erfinden.
            Der Standort muss DEMSELBEN Endkunden gehören (**400**).
        status: { $ref: '#/components/schemas/BetriebsStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SystemAnlegen:
      type: object
      additionalProperties: false
      required: [endkundeId, bezeichnung, systemgrenze]
      properties:
        endkundeId: { type: string, format: uuid }
        bezeichnung: { type: string, minLength: 1, maxLength: 200 }
        systemgrenze: { type: string, minLength: 1, maxLength: 2000 }
        systembeschreibung: { type: string, maxLength: 4000 }
        standortId:
          type: string
          format: uuid
          description: 'Optional; muss demselben Endkunden gehören (**400**). S. `SystemDetail.standortId`.'
    SystemAendern:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bezeichnung: { type: string, minLength: 1, maxLength: 200 }
        systemgrenze: { type: string, minLength: 1, maxLength: 2000 }
        systembeschreibung: { type: string, maxLength: 4000 }
        standortId:
          type: string
          format: uuid
          description: 'Nachträglich setzbar oder korrigierbar; muss demselben Endkunden gehören (**400**).'

    # ---------------------------------------------------------------
    # Zähler
    # ---------------------------------------------------------------
    ZaehlerListItem:
      type: object
      additionalProperties: false
      required: [id, systemId, systemBezeichnung, energietraeger, status, createdAt, angebunden, letzteUebertragung]
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        systemBezeichnung:
          type: string
          description: >
            Name des Systems, an dem der Zaehler haengt. Ohne ihn steht in der
            Liste nur eine Kennung, die erst nachgeschlagen werden muss. Kein
            Personenbezug — dieselbe Angabe fuehrt bereits die Systemliste.
        energietraeger: { $ref: '#/components/schemas/Energietraeger' }
        status: { $ref: '#/components/schemas/BetriebsStatus' }
        createdAt: { type: string, format: date-time }
        angebunden:
          type: boolean
          description: >
            Ob dem Zaehler derzeit ein Geraet aktiv zugeordnet ist. Sagt DASS,
            nicht welches — DevEUI und Blind-Index verlassen den Ingest-Pfad
            nicht (ADR-0005 §26.6).
        letzteUebertragung:
          type: [string, 'null']
          format: date-time
          description: >
            Juengster Empfangszeitpunkt ueber alle Kanaele des Zaehlers;
            `null` = noch nie etwas empfangen. Betriebs-Metadatum, KEIN
            Messwert (dieselbe Zusage wie `MesskanalFreshnessItem`).
    ZaehlerListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/ZaehlerListItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    ZaehlerDetail:
      type: object
      additionalProperties: false
      required: [id, systemId, geraetetyp, energietraeger, status, geraetAnbindung, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        geraetetyp: { type: string, maxLength: 200, description: Messgeräte-Wahl (TB-01). }
        energietraeger: { $ref: '#/components/schemas/Energietraeger' }
        status: { $ref: '#/components/schemas/BetriebsStatus' }
        geraetAnbindung:
          oneOf:
            - $ref: '#/components/schemas/GeraetAnbindung'
            - type: 'null'
          description: >
            Aktuell aktive Geraete-Zuordnung dieses Zaehlers, `null` wenn keine
            besteht (ADR-0011 D7). Bewusst ein FELD statt einer eigenen
            Lese-Route: `read:geraet_zuordnung` ist break-glass-gehaertet
            (Rolle `geraete-support`, Zweck-Whitelist, Ticket, Quota, ADR-0005
            §26.4 SEC-5) und waere fuer einen Statusblick der falsche
            Schluessel. Hier greift die ohnehin geltende `read:stammdaten`.
            Enthaelt KEINE DevEUI und keinen Blind-Index (RL-2) — nur den
            Lebenszyklus-Zustand. Historie wird NICHT ausgegeben: beendete und
            geschredderte Zuordnungen erscheinen als `null`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        # geraeteReferenz bewusst NICHT vorhanden (V0002, Quasi-Identifier offen, §12).
    GeraetAnbindung:
      type: object
      additionalProperties: false
      required: [id, status, gueltigVon, gueltigBis, pepperVersion]
      description: >
        Ausschnitt aus `GeraetZuordnungDetail` fuer die Anzeige am Zaehler
        (ADR-0011 D7). `zaehlerId` fehlt bewusst — sie ist der Zaehler, an dem
        dieses Objekt haengt. Wie `GeraetZuordnungDetail` OHNE DevEUI/
        Blind-Index (O4 Design-Prinzip 1).
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/GeraetZuordnungStatus' }
        gueltigVon: { type: string, format: date-time }
        gueltigBis: { type: [string, 'null'], format: date-time, description: null = aktuell aktiv. }
        pepperVersion: { type: integer, minimum: 1 }
    ZaehlerAnlegen:
      type: object
      additionalProperties: false
      required: [systemId, geraetetyp, energietraeger]
      properties:
        systemId: { type: string, format: uuid }
        geraetetyp: { type: string, minLength: 1, maxLength: 200 }
        energietraeger: { $ref: '#/components/schemas/Energietraeger' }
    ZaehlerAendern:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        geraetetyp: { type: string, minLength: 1, maxLength: 200 }

    # ---------------------------------------------------------------
    # Messkanal
    # ---------------------------------------------------------------
    Messrichtung:
      type: string
      enum: [bezug, eigenerzeugung, einspeisung]
      description: >
        Energierichtung des Messpunkts (V0074). Der Einsparungsnachweis
        rechnet `Ist-Verbrauch = Σ bezug + eigenerzeugung − einspeisung`
        ([Q3] Kap. 9) und verlangt, dass selbst erzeugte Energie GETRENNT vom
        Netzbezug ausgewiesen wird — selbsterzeugter Strom ist keine
        Einsparung.

        Default `bezug`. Bei Bestandskanälen ist das eine ANNAHME aus der
        Migration, keine Messung: Ein fälschlich als `bezug` geführter
        Einspeisekanal erhöht den ausgewiesenen Verbrauch und senkt die
        Einsparung. Vor dem ersten Verwendungsnachweis je Kanal zu
        bestätigen.

    MesskanalListItem:
      type: object
      additionalProperties: false
      required: [id, zaehlerId, messgroesse, einheit, art, status, istUntermessung, richtung, createdAt]
      properties:
        id: { type: string, format: uuid }
        zaehlerId: { type: string, format: uuid }
        messgroesse: { type: string, maxLength: 100, description: 'z. B. wirkarbeit, thermische_energie, volumen, temperatur.' }
        einheit: { type: string, maxLength: 50, description: 'z. B. kWh, m3, degC.' }
        art: { $ref: '#/components/schemas/MessgroesseArt' }
        status: { $ref: '#/components/schemas/BetriebsStatus' }
        obisKennzahl: { type: [string, 'null'], maxLength: 50, description: Nur Strom, sonst null. }
        istUntermessung:
          type: boolean
          description: '`true` = Untermessung (V0058); von der Einsparberechnung ausgelassen.'
        richtung: { $ref: '#/components/schemas/Messrichtung' }
        createdAt: { type: string, format: date-time }
    MesskanalListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/MesskanalListItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    MesskanalDetail:
      type: object
      additionalProperties: false
      required: [id, zaehlerId, messgroesse, einheit, art, status, istUntermessung, richtung, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        zaehlerId: { type: string, format: uuid }
        messgroesse: { type: string, maxLength: 100 }
        einheit: { type: string, maxLength: 50 }
        art: { $ref: '#/components/schemas/MessgroesseArt' }
        status: { $ref: '#/components/schemas/BetriebsStatus' }
        obisKennzahl: { type: [string, 'null'], maxLength: 50 }
        istUntermessung:
          type: boolean
          description: >
            `true` = dieser Kanal misst eine TEILMENGE dessen, was ein anderer
            Kanal desselben Systems bereits erfasst (Untermessung, V0058). Die
            Einsparberechnung laesst solche Kanaele aus — ohne die Angabe
            zaehlt sie denselben Verbrauch mehrfach und weist eine falsche
            Einsparung aus. Die Zuordnungsquote (TB-05) nimmt sie in den
            ZAEHLER, aber nicht in den NENNER.
        richtung: { $ref: '#/components/schemas/Messrichtung' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MesskanalAnlegen:
      type: object
      additionalProperties: false
      required: [messgroesse, einheit, art]
      properties:
        messgroesse: { type: string, minLength: 1, maxLength: 100 }
        einheit: { type: string, minLength: 1, maxLength: 50 }
        art: { $ref: '#/components/schemas/MessgroesseArt' }
        obisKennzahl: { type: string, maxLength: 50, description: Nur bei Strom setzen. }
        istUntermessung:
          type: boolean
          default: false
          description: >
            `true` = dieser Kanal misst eine TEILMENGE dessen, was ein anderer
            Kanal desselben Systems bereits erfasst (Untermessung, V0058). Die
            Einsparberechnung laesst solche Kanaele aus — ohne die Angabe
            zaehlt sie denselben Verbrauch mehrfach und weist eine falsche
            Einsparung aus. Die Zuordnungsquote (TB-05) nimmt sie in den
            ZAEHLER, aber nicht in den NENNER.
        richtung:
          allOf: [{ $ref: '#/components/schemas/Messrichtung' }]
          default: bezug
          description: >
            Weglassen setzt `bezug` — der Verbrauchszähler ist der Regelfall.
            Ein still auf `einspeisung` gesetzter Kanal würde vom
            Ist-Verbrauch ABGEZOGEN und die Einsparung rechnerisch erhöhen;
            das darf nie unbemerkt passieren.
    MesskanalAendern:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        einheit: { type: string, minLength: 1, maxLength: 50 }
        obisKennzahl: { type: string, maxLength: 50 }
        istUntermessung:
          type: boolean
          description: >
            Korrigierbar, weil eine Messstelle falsch erfasst worden sein kann.
            Wirkt auf KUENFTIGE Berechnungslaeufe; bereits gerechnete bleiben
            unveraendert (append-only).
        richtung:
          allOf: [{ $ref: '#/components/schemas/Messrichtung' }]
          description: >
            Korrigierbar aus demselben Grund — und weil der Default `bezug`
            für Bestandskanäle eine Annahme der Migration ist, keine Messung.

    # ---------------------------------------------------------------
    # Geraet-Zuordnung (O4-Kernkorrelation DevEUI<->Zaehler, ADR-0005 §26)
    # ---------------------------------------------------------------
    GeraetZuordnungStatus:
      type: string
      enum: [aktiv, inaktiv, geschreddert]
      description: >
        aktiv=aktuell gueltig (hoechstens eine je Zaehler, D-EXCL);
        inaktiv=deaktiviert/abgeloest (Geraete-Tausch); geschreddert=Art.-17-
        Krypto-Shredding (irreversibel, ADR-0005 §26.5).
    GeraetZuordnungAnlegen:
      type: object
      additionalProperties: false
      required: [devEui]
      description: >
        `zaehlerId` kommt aus dem Pfad (analog MesskanalAnlegen), NICHT Teil
        des Bodys.
      properties:
        devEui:
          type: string
          minLength: 16
          maxLength: 23
          pattern: '^[0-9A-Fa-f]{2}([:-]?[0-9A-Fa-f]{2}){7}$'
          description: >
            IEEE EUI-64, 16 Hex-Zeichen, optional je Byte-Paar getrennt durch
            ':' oder '-'. Wird NIE gespeichert oder geloggt (O4 Design-Prinzip
            1) — nur feldverschlüsselt (deveui_enc) + als deterministischer
            Blind-Index abgelegt.
    GeraetZuordnungAendern:
      type: object
      additionalProperties: false
      required: [aktion]
      properties:
        aktion:
          type: string
          enum: [deaktivieren]
          description: >
            v1 minimal — Deaktivierung (Geraete-Tausch = deaktivieren +
            separate Neu-Provisionierung, ADR-0005 §26.4).
    GeraetZuordnungDetail:
      type: object
      additionalProperties: false
      required: [id, zaehlerId, status, pepperVersion, gueltigVon, createdAt, updatedAt]
      description: >
        KEIN devEui-/Blind-Index-Feld (O4 Design-Prinzip 1, ADR-0005
        §11/§26.2) — die Klartext-DevEUI wird nach der Provisionierung NIE
        erneut über dieses Schema exponiert; Reverse-Auflösung ist der
        eigenständige, break-glass-gehärtete Endpunkt
        `POST .../reverse-aufloesung` (`read:geraet_zuordnung`, ADR-0005
        §26.4 SEC-5, `GeraetReverseAufloesungErgebnis`).
      properties:
        id: { type: string, format: uuid }
        zaehlerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/GeraetZuordnungStatus' }
        pepperVersion: { type: integer, minimum: 1, description: Blind-Index-Pepper-Rotationsversion (ADR-0005 §26.3). }
        gueltigVon: { type: string, format: date-time }
        gueltigBis: { type: [string, 'null'], format: date-time, description: null = aktuell aktiv. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GeraetReverseAufloesungAnfrage:
      type: object
      additionalProperties: false
      required: [zweck, ticketRef]
      description: >
        ADR-0005 §26.4 SEC-5 — strukturierte Begründungs-/Ticket-Pflicht,
        kein Freitext-Zweck-Code (rote Linie 2). Eigene Zweck-Whitelist,
        UNABHÄNGIG von der `read:verbrauch_detail`-Whitelist.
      properties:
        zweck:
          type: string
          enum: [geraete_stoerungsdiagnose]
          description: >
            PROVISORISCHE Whitelist (final `security-lead`/
            `access-control-engineer`/`compliance-director`).
        ticketRef:
          type: string
          pattern: '^[A-Z]+-[0-9]+$'
          description: >
            Strukturierter Vorgangs-Verweis (z. B. `HD-1234`), KEIN Freitext.
            Format PROVISORISCH (final `security-lead`/
            `access-control-engineer`).
    GeraetReverseAufloesungErgebnis:
      type: object
      additionalProperties: false
      required: [id, zaehlerId, devEui]
      description: >
        Das EINZIGE Response-Schema im gesamten Contract mit Klartext-
        `devEui` (ADR-0005 §26.4 SEC-5, RL-2) — verlässt das System
        AUSSCHLIESSLICH über diesen einen, break-glass-gehärteten Endpunkt.
      properties:
        id: { type: string, format: uuid }
        zaehlerId: { type: string, format: uuid }
        devEui:
          type: string
          description: Klartext-DevEUI (IEEE EUI-64), NIEMALS geloggt/gecacht.

    # ---------------------------------------------------------------
    # Messkonzept
    # ---------------------------------------------------------------
    EnergietraegerBaseline:
      type: object
      additionalProperties: false
      required: [energietraeger]
      description: Energieträger + Baseline-Slot (TB-01/TB-02) je Träger einer Version.
      properties:
        energietraeger: { $ref: '#/components/schemas/Energietraeger' }
        baselineWert: { type: [number, 'null'] }
        baselineEinheit: { type: [string, 'null'], maxLength: 50 }
        baselineMethode: { type: [string, 'null'], maxLength: 200 }
        baselineBegruendung:
          type: [string, 'null']
          maxLength: 2000
          description: >
            Pflicht wenn < 3 Jahresabrechnungen (TB-02). Seit V0065 wird das
            per DB-CHECK erzwungen, sobald `baselineAbrechnungenAnzahl`
            gesetzt ist — vorher stand die Pflicht nur als Schema-Kommentar,
            weil die Anzahl nirgends erfasst war.
        baselineBelegRef:
          type: [string, 'null']
          format: uuid
          description: >
            RESERVIERT und unbenutzt — Slot für die spätere Beleg-Ablage
            (Beleg-ADR). Der externe Verweis läuft über
            `baselineBelegAktenzeichen`/`baselineBelegAblageort`.
        baselineAbrechnungenAnzahl:
          type: [integer, 'null']
          minimum: 0
          maximum: 99
          description: >
            TB-02 ([Q3] Kap. 2.1.2): Zahl der Jahresabrechnungen, aus denen
            die Baseline gemittelt wurde. Bei einem Wert < 3 verlangt der
            Server eine `baselineBegruendung` (409/DB-CHECK).
        baselineBelegAktenzeichen:
          type: [string, 'null']
          maxLength: 200
          description: >
            Kennung, unter der die Jahresabrechnungen AUSSERHALB des Systems
            geführt werden (ADR-0006 O4). Die Dokumente selbst liegen bewusst
            nicht im System: sie sind voller Personendaten, und eine
            Dokumentenablage wäre ein neues Drittsystem mit eigenem ADR- und
            Security-Review. Verlässt das System nicht (kein BAFA-Export,
            kein Kundendokument).
        baselineBelegAblageort:
          type: [string, 'null']
          maxLength: 200
          description: >
            Wo die Abrechnungen liegen (Aktenordner, DMS, Laufwerk). Getrennt
            vom Aktenzeichen, weil ein Umzug der Ablage das Aktenzeichen nicht
            ändert. Verlässt das System nicht.
        energietraegerSubstitution:
          type: boolean
          default: false
          description: >
            ADR-0007 B13.4/B14/O-B3b (Auflage O-B3b) — explizites, vom
            Betriebs-Team gesetztes Kennzeichen: für dieses (Endkunde,
            Energieträger)-Paar liegt ein Energieträger-Wechsel (Substitution,
            z. B. Öl → Wärmepumpe) vor. NICHT automatisch erkannt. Ein
            gesetztes Kennzeichen führt im Einspar-Lauf zu
            status=ausgeschlossen MIT Ausweis (DE-02), NICHT zu einer
            abweichenden Berechnung (Merkblatt Technik v2.2 Kap. 3 verlangt
            in jedem Substitutionsfall das alternative/Standardmesskonzept).
    MesskonzeptVersionListItem:
      type: object
      additionalProperties: false
      required: [versionNr, typ, gueltigVon, createdAt]
      properties:
        versionNr: { type: integer, minimum: 1 }
        typ: { $ref: '#/components/schemas/MesskonzeptTyp' }
        gueltigVon: { type: string, format: date-time }
        gueltigBis: { type: [string, 'null'], format: date-time, description: null = aktuelle Version. }
        createdAt: { type: string, format: date-time }
    MesskonzeptVersionListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/MesskonzeptVersionListItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    EnergietraegerBaselineDetail:
      type: object
      additionalProperties: false
      required: [mvetId, energietraeger, energietraegerSubstitution]
      description: >
        Wie `EnergietraegerBaseline`, aber MIT der Kennung des Eintrags —
        das Antwort-Gegenstück.

        Die beiden sind bewusst getrennt: Beim ANLEGEN gibt es die Kennung
        noch nicht, und ein gemeinsames Schema mit `additionalProperties:
        false` würde sie im Request stillschweigend zulassen, obwohl das DTO
        sie abweist. `mvetId` ist zugleich der Schlüssel, den
        `BerechnungslaufAnlegen.mvetId` erwartet und über den die
        Systemgrenze adressiert wird.
      properties:
        mvetId: { type: string, format: uuid }
        energietraeger: { $ref: '#/components/schemas/Energietraeger' }
        baselineWert: { type: [number, 'null'] }
        baselineEinheit: { type: [string, 'null'], maxLength: 50 }
        baselineMethode: { type: [string, 'null'], maxLength: 200 }
        baselineBegruendung: { type: [string, 'null'], maxLength: 2000 }
        baselineBelegRef: { type: [string, 'null'], format: uuid }
        baselineAbrechnungenAnzahl: { type: [integer, 'null'], minimum: 0 }
        baselineBelegAktenzeichen: { type: [string, 'null'], maxLength: 200 }
        baselineBelegAblageort: { type: [string, 'null'], maxLength: 500 }
        energietraegerSubstitution: { type: boolean }

    SystemgrenzeSystem:
      type: object
      additionalProperties: false
      required: [systemId, bezeichnung]
      properties:
        systemId: { type: string, format: uuid }
        bezeichnung: { type: string }

    Systemgrenze:
      type: object
      additionalProperties: false
      required: [mvetId, energietraeger, systeme, waehlbar, greiftFallback]
      properties:
        mvetId: { type: string, format: uuid }
        energietraeger: { $ref: '#/components/schemas/Energietraeger' }
        systeme:
          type: array
          items: { $ref: '#/components/schemas/SystemgrenzeSystem' }
          description: Die Systeme IN der Grenze.
        waehlbar:
          type: array
          items: { $ref: '#/components/schemas/SystemgrenzeSystem' }
          description: Alle aktiven Systeme des Endkunden — die Auswahl, aus der die Grenze gebildet wird.
        greiftFallback:
          type: boolean
          description: >
            `true`, solange nichts zugeordnet ist. Der Berechnungslauf nimmt
            dann alle aktiven Zähler des Endkunden.

    SystemgrenzeSetzen:
      type: object
      additionalProperties: false
      required: [systemIds]
      properties:
        systemIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
          description: Die Systeme, die die Grenze künftig umfasst. Leer = zurück zum Fallback.

    BaselineEinheit:
      type: string
      enum: [kWh, MWh, GJ, m³, l, kg, t]
      description: >
        Geschlossene Liste, obwohl `baselineEinheit` an der mvet selbst
        Freitext ist. Weiter als das, was der Rechenweg verträgt (er weist
        alles außer `kWh` mit `BASELINE_EINHEIT_UNGUELTIG` ab) — die Menge
        einer Periode geht in KEINE Rechnung ein, sie belegt die Abrechnung.
        Eine Gasrechnung weist m³ aus.

    BaselinePeriode:
      type: object
      additionalProperties: false
      required: [id, von, bis, tage, letzterTag, laengeAuffaellig, menge, einheit]
      properties:
        id: { type: string, format: uuid }
        von: { type: string, format: date, description: Erster Tag des Abrechnungszeitraums (einschließlich). }
        bis:
          type: string
          format: date
          description: Erster Tag NACH dem Abrechnungszeitraum (AUSSCHLIESSLICH).
        tage: { type: integer, minimum: 1, description: Kalendertage, die die Periode umfasst. }
        letzterTag:
          type: string
          format: date
          description: >
            Der letzte Tag, der noch DAZUGEHÖRT (`bis` minus ein Tag). Steht
            mit in der Antwort, weil `bis` ausschließlich ist und genau dieser
            Unterschied sich sonst erst in der Einsparzahl zeigt.
        laengeAuffaellig:
          type: boolean
          description: >
            `true`, wenn die Länge um mehr als 40 Tage von einem Jahr
            abweicht. GTZ_base ist der ARITHMETISCHE Mittelwert der
            Gradtagzahl-Summen — nicht der auf ein Jahr normierte. Eine
            Halbjahres-Periode schleppt deshalb eine halbe Jahressumme in den
            Mittelwert und zieht ihn nach unten; der Rechenweg gleicht das
            NICHT aus.
        menge: { type: [number, 'null'], minimum: 0, description: Die abgerechnete Menge (Beleg, geht in keine Rechnung ein). }
        einheit:
          oneOf:
            - { $ref: '#/components/schemas/BaselineEinheit' }
            - { type: 'null' }

    BaselinePerioden:
      type: object
      additionalProperties: false
      required:
        [mvetId, energietraeger, perioden, baselineWert, baselineEinheit,
         abrechnungenAnzahlDeklariert, anzahlWeichtAb, gtzBaseErmittelbar, mengeMittel]
      properties:
        mvetId: { type: string, format: uuid }
        energietraeger: { $ref: '#/components/schemas/Energietraeger' }
        perioden:
          type: array
          items: { $ref: '#/components/schemas/BaselinePeriode' }
        baselineWert: { type: [number, 'null'], description: Die Baseline, gegen die diese Perioden belegen sollen. }
        baselineEinheit: { type: [string, 'null'], maxLength: 50 }
        abrechnungenAnzahlDeklariert:
          type: [integer, 'null']
          minimum: 0
          description: 'TB-02 (V0065): die an der mvet DEKLARIERTE Zahl der Jahresabrechnungen.'
        anzahlWeichtAb:
          type: boolean
          description: >
            `true`, wenn die deklarierte Zahl nicht zur Zahl der erfassten
            Perioden passt. Beides beschreibt dieselben Abrechnungen — weichen
            sie ab, ist eine der beiden Angaben falsch.
        gtzBaseErmittelbar:
          type: boolean
          description: >
            `true`, sobald mindestens eine Periode erfasst ist. Sonst weist
            der Berechnungslauf mit `GTZ_BASE_NICHT_ERMITTELBAR` ab (außer bei
            `gtzBaseOverride` oder Grundlastanteil 1).
        mengeMittel:
          type: [number, 'null']
          description: >
            Mittelwert der erfassten Mengen — NUR, wenn alle Perioden eine
            Menge in derselben Einheit wie die Baseline tragen, sonst `null`.
            TB-02 verlangt diesen Mittelwert als Baseline: Steht hier eine
            andere Zahl als in `baselineWert`, stimmt eines von beiden nicht.

    BaselinePeriodeSetzen:
      type: object
      additionalProperties: false
      required: [von, bis]
      properties:
        von: { type: string, format: date }
        bis: { type: string, format: date, description: AUSSCHLIESSLICH — erster Tag NACH dem Zeitraum. }
        menge: { type: number, minimum: 0 }
        einheit: { $ref: '#/components/schemas/BaselineEinheit' }

    BaselinePeriodenSetzen:
      type: object
      additionalProperties: false
      required: [perioden]
      properties:
        perioden:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/BaselinePeriodeSetzen' }
          description: >
            Die Bezugszeiträume, die künftig gelten. Leer = keine erfasst;
            GTZ_base ist dann nicht herleitbar. TB-02 erwartet drei
            Jahresabrechnungen.

    MesskonzeptVersionDetail:
      type: object
      additionalProperties: false
      required:
        [versionNr, typ, systemgrenze, systembeschreibung, bereinigungsverfahren,
         messgeraeteWahl, geraeteerkennungsVerfahren, gueltigVon, energietraeger, createdAt]
      description: Alle 7 TB-01-Pflichtinhalte (5 versionsweit + Energieträger/Baseline-Liste).
      properties:
        versionNr: { type: integer, minimum: 1 }
        typ: { $ref: '#/components/schemas/MesskonzeptTyp' }
        systemgrenze: { type: string, maxLength: 4000, description: 'TB-01 (2).' }
        systembeschreibung: { type: string, maxLength: 4000, description: 'TB-01 (3).' }
        bereinigungsverfahren: { type: string, maxLength: 4000, description: 'TB-01 (5).' }
        messgeraeteWahl: { type: string, maxLength: 4000, description: 'TB-01 (6).' }
        geraeteerkennungsVerfahren: { type: string, maxLength: 4000, description: 'TB-01 (7).' }
        aenderungsgrund: { type: [string, 'null'], maxLength: 2000 }
        anzeigeStatus: { type: [string, 'null'], maxLength: 50, description: Slot Anzeige-Workflow (späterer ADR). }
        gueltigVon: { type: string, format: date-time }
        gueltigBis: { type: [string, 'null'], format: date-time }
        energietraeger:
          type: array
          minItems: 1
          description: 'TB-01 (1) Energieträger + (4) Baseline je Träger.'
          items: { $ref: '#/components/schemas/EnergietraegerBaselineDetail' }
        createdAt: { type: string, format: date-time }
    MesskonzeptVersionAnlegen:
      type: object
      additionalProperties: false
      required:
        [typ, systemgrenze, systembeschreibung, bereinigungsverfahren,
         messgeraeteWahl, geraeteerkennungsVerfahren, energietraeger]
      description: >
        Neue (append-only) Version. version_nr, gueltig_von und der Abschluss der
        Vorgänger-Version setzt der Server. Editieren bestehender Versionen ist
        nicht möglich (Linie 3).
      properties:
        typ: { $ref: '#/components/schemas/MesskonzeptTyp' }
        systemgrenze: { type: string, minLength: 1, maxLength: 4000 }
        systembeschreibung: { type: string, minLength: 1, maxLength: 4000 }
        bereinigungsverfahren: { type: string, minLength: 1, maxLength: 4000 }
        messgeraeteWahl: { type: string, minLength: 1, maxLength: 4000 }
        geraeteerkennungsVerfahren: { type: string, minLength: 1, maxLength: 4000 }
        aenderungsgrund: { type: string, maxLength: 2000, description: 'TB-01: Änderungen darlegen.' }
        energietraeger:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/EnergietraegerBaseline' }

    # ---------------------------------------------------------------
    # Anschlussnutzer + Nutzungsverhältnis
    # ---------------------------------------------------------------
    AnschlussnutzerListItem:
      type: object
      additionalProperties: false
      description: Listen-Projektion — PII-FREI (Linie 2).
      required: [id, endkundeId, verarbeitungsStatus, createdAt]
      properties:
        id: { type: string, format: uuid, description: Pseudonym-Surrogat des Datensubjekts. }
        endkundeId: { type: string, format: uuid }
        verarbeitungsStatus: { $ref: '#/components/schemas/VerarbeitungsStatus' }
        createdAt: { type: string, format: date-time }
    AnschlussnutzerListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/AnschlussnutzerListItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    AnschlussnutzerPii:
      type: object
      additionalProperties: false
      description: 'Direkt-PII Datensubjekt (DS-07, identity.anschlussnutzer_pii). pii=true.'
      required: [name]
      properties:
        name:
          type: string
          maxLength: 512
          description: 'pii=true; grundlage=Art.6(1)(f)/(a) DS-07; ADR-0004 Anhang B P5.'
        kontakt:
          type: [string, 'null']
          maxLength: 512
          description: 'pii=true; grundlage=Art.6(1)(a); ADR-0004 Anhang B P6.'
    AnschlussnutzerDetail:
      type: object
      additionalProperties: false
      required: [id, endkundeId, verarbeitungsStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid }
        verarbeitungsStatus: { $ref: '#/components/schemas/VerarbeitungsStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        einschraenkungGrundCode:
          oneOf:
            - $ref: '#/components/schemas/EinschraenkungGrund'
            - type: 'null'
          description: >
            Art.-18-Grund; `null`, solange der Anschlussnutzer nicht gesperrt
            ist (`ck_anschlussnutzer_einschraenkung_kohaerenz`, V0024).
            Dieselben Grenzen wie bei `EndkundeDetail`: sichtbar fuer `betrieb`
            und `compliance-auditor`, NICHT ueber die PII-Projektion gefuehrt,
            NICHT im Listen-Item, kein Filter/Sort. Nach aussen verlaesst nur
            der neutrale Sammelcode `datenschutzrechtliche_einschraenkung` das
            System (ADR-0007 C4 Punkt 6).
        gesperrtSeit:
          type: [string, 'null']
          format: date-time
          description: >
            Zeitpunkt der Einschraenkung (UTC, serverseitig gesetzt, A11.3).
            Grundlage der Fristenueberwachung fuer Art. 18 Abs. 1 lit. a/d.
        neuerhebungFortsetzen:
          type: [boolean, 'null']
          description: >
            Auflage C-8 — die am Sperrvorgang festgehaltene Entscheidung ueber
            die WEITERE ERHEBUNG. `null` heisst „Frage stellt sich nicht"
            (lit. a/lit. c) oder „keine Einschraenkung"; NICHT „entschieden,
            nicht weiterzuerheben". Wird beim Aufheben der Einschraenkung
            zusammen mit Grund und Zeitpunkt genullt — sie gehoert zu GENAU
            DIESER Einschraenkung. Sichtbarkeit wie `einschraenkungGrundCode`:
            wer den Grund sehen darf, muss auch sehen, was daraus fuer die
            Messung folgt.
        stammdatenPii:
          description: PII-Block; NULL bei fehlender Berechtigung (DS-07-Innensicht, D6).
          oneOf:
            - { $ref: '#/components/schemas/AnschlussnutzerPii' }
            - { type: 'null' }
    AnschlussnutzerAnlegen:
      type: object
      additionalProperties: false
      required: [endkundeId, stammdatenPii]
      properties:
        endkundeId: { type: string, format: uuid }
        stammdatenPii: { $ref: '#/components/schemas/AnschlussnutzerPii' }
    NutzungsverhaeltnisListItem:
      type: object
      additionalProperties: false
      required: [id, endkundeId, anschlussnutzerId, systemId, datenklasse, rolle, gueltigVon, createdAt]
      properties:
        id: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid }
        anschlussnutzerId: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        datenklasse: { $ref: '#/components/schemas/Datenklasse' }
        rolle: { $ref: '#/components/schemas/NutzungsRolle' }
        gueltigVon: { type: string, format: date-time }
        gueltigBis: { type: [string, 'null'], format: date-time, description: null = aktuell. }
        createdAt: { type: string, format: date-time }
    NutzungsverhaeltnisListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/NutzungsverhaeltnisListItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    NutzungsverhaeltnisDetail:
      type: object
      additionalProperties: false
      required:
        [id, endkundeId, anschlussnutzerId, systemId, datenklasse, rolle, gueltigVon, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid }
        anschlussnutzerId: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        datenklasse: { $ref: '#/components/schemas/Datenklasse' }
        rolle: { $ref: '#/components/schemas/NutzungsRolle' }
        gueltigVon: { type: string, format: date-time }
        gueltigBis: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NutzungsverhaeltnisAnlegen:
      type: object
      additionalProperties: false
      required: [endkundeId, anschlussnutzerId, systemId, rolle, gueltigVon]
      properties:
        endkundeId: { type: string, format: uuid }
        anschlussnutzerId: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        datenklasse:
          allOf: [{ $ref: '#/components/schemas/Datenklasse' }]
          default: abrechnungsminimum
        rolle: { $ref: '#/components/schemas/NutzungsRolle' }
        gueltigVon: { type: string, format: date-time }
    NutzungsverhaeltnisBeenden:
      type: object
      additionalProperties: false
      required: [gueltigBis]
      properties:
        gueltigBis:
          type: string
          format: date-time
          description: Endzeitpunkt (UTC); muss >= gueltigVon liegen.

    # ---------------------------------------------------------------
    # Monitoring / Vollständigkeit
    # ---------------------------------------------------------------
    VollstaendigkeitItem:
      type: object
      additionalProperties: false
      description: Lücken-Metadaten je Entität — KEINE PII, KEIN Verbrauchsinhalt.
      required: [endkundeId, ebene, luecken, geprueftAm]
      properties:
        endkundeId: { type: string, format: uuid }
        systemId: { type: [string, 'null'], format: uuid }
        zaehlerId: { type: [string, 'null'], format: uuid }
        ebene:
          type: string
          enum: [endkunde, system, zaehler]
          description: Aggregationsebene des Eintrags.
        luecken:
          type: array
          description: Menge der fehlenden Stammdaten (leer = vollständig).
          items: { $ref: '#/components/schemas/LueckenTyp' }
        geprueftAm: { type: string, format: date-time }
    VollstaendigkeitListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/VollstaendigkeitItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }

    # ---------------------------------------------------------------
    # Standort-/Gebäudestruktur (ADR-0010) — energy.standort (PII-frei, RL-1),
    # energy.zaehler_standort (D3), identity.standort_pii (D4, feldverschlüsselt).
    # ---------------------------------------------------------------
    StandortTyp:
      type: string
      enum: [liegenschaft, gebaeude, bauteil, etage, einheit, raum]
      description: >
        Additiv erweiterbare Typ-Whitelist (D1). Wurzelknoten (kein
        `parentId`) müssen `liegenschaft` oder `gebaeude` sein (D2.4).
    StandortStatus:
      type: string
      enum: [aktiv, stillgelegt]
      description: Zustandswechsel, KEIN Hard-Delete (D2.6) — Ausnahme s. `delete:standort`.
    StandortStilllegenGrund:
      type: string
      enum: [fehlanlage_korrektur, gebaeude_ausser_betrieb, nutzung_beendet, sonstige]
      description: >
        Whitelisted Grund (kein Freitext, Linie 2). PROVISORISCHE v1-Liste
        (ADR-0010 §5 nennt keine konkreten Werte) — finale Bestätigung nach
        Review `access-control-engineer`/`compliance-director`.
    StandortStruktur:
      type: object
      additionalProperties: false
      description: >
        `read:standort`-Lesestufe — PII-FREI (RL-1/D5). NIEMALS
        `bezeichnung`/`anschrift`/`geo`. Einheitliche Projektion für die
        Baum-Liste UND jede strukturelle Mutation (anlegen/ändern/
        verschieben/stilllegen) — bewusste Design-Entscheidung: auch die
        Create-Antwort trägt kein Klartext-Label zurück (D5-Trennung, kein
        literales ADR-Zitat).
      required: [id, endkundeId, parentId, typ, pfad, ebene, sortierung, status, klimareferenz, hatAdresse, zaehlerAnzahl, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, description: Pseudonym-Surrogat (energy.standort.id). }
        endkundeId: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        typ: { $ref: '#/components/schemas/StandortTyp' }
        pfad:
          type: array
          description: Materialisierter Pfad (D6) — Vorfahrenkette INKLUSIVE eigener `id`.
          items: { type: string, format: uuid }
        ebene: { type: integer, minimum: 0, maximum: 9 }
        sortierung: { type: integer, description: Geschwisterreihenfolge (D1, ersetzt Label-Sortierung). }
        status: { $ref: '#/components/schemas/StandortStatus' }
        klimareferenz:
          type: [string, 'null']
          maxLength: 64
          description: >
            Klimastation dieses Standorts (ADR-0010), `null` = keine
            hinterlegt. Steht in der Antwort, damit ein Änderungsformular den
            aktuellen Wert vorbelegen kann — ohne das löschte eine Änderung an
            `typ` oder `sortierung` die Station beiläufig mit.
        hatAdresse:
          type: boolean
          description: >
            STRUKTURELL berechnet (D4-Adressfähigkeit: Wurzelknoten oder
            `gebaeude`) — NICHT ob tatsächlich eine Adresse hinterlegt ist
            (ein echter Presence-Check wäre ein `identity`-Zugriff, den diese
            Lesestufe ausdrücklich ausschließt).
        zaehlerAnzahl: { type: integer, minimum: 0, description: Anzahl aktuell (gueltig_bis IS NULL) verorteter Zähler. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StandortAnlegen:
      type: object
      additionalProperties: false
      required: [typ, bezeichnung]
      properties:
        typ: { $ref: '#/components/schemas/StandortTyp' }
        parentId: { type: string, format: uuid }
        sortierung: { type: integer, default: 0 }
        klimareferenz:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]*$'
          description: >
            Klimastation dieses Standorts (ADR-0010), z. B. `DWD-04094`. Sie
            gehört fachlich zum OBJEKT, nicht zum einzelnen Rechenlauf.

            Der Berechnungslauf löst sie NICHT zur Laufzeit auf (ADR-0006 D4:
            eingefrorene `stationRef` je Lauf) — der Parametervorschlag bietet
            sie an, und der Bediener übernimmt sie bewusst.

            Zeichen-Whitelist wie bei `stationRef`: Der DWD-Adapter setzt die
            Kennung in Pfade auf `opendata.dwd.de` ein.
        bezeichnung:
          type: string
          maxLength: 512
          description: 'pii=true; grundlage=Art.6(1)(b); wird feldverschlüsselt (identity.standort_pii.bezeichnung_enc, D4).'
        adresse:
          type: string
          maxLength: 1024
          description: 'pii=true; grundlage=Art.6(1)(b); Pflicht auf Wurzelknoten, optional auf gebaeude, sonst unzulässig (D4).'
    StandortAendern:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Struktur NUR — NICHT status (eigene Aktion stilllegen) und NICHT Label/Adresse (eigene Route .../pii).
      properties:
        typ: { $ref: '#/components/schemas/StandortTyp' }
        sortierung: { type: integer }
        klimareferenz:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]*$'
          description: >
            Klimastation dieses Standorts (ADR-0010), z. B. `DWD-04094`. Sie
            gehört fachlich zum OBJEKT, nicht zum einzelnen Rechenlauf.

            Der Berechnungslauf löst sie NICHT zur Laufzeit auf (ADR-0006 D4:
            eingefrorene `stationRef` je Lauf) — der Parametervorschlag bietet
            sie an, und der Bediener übernimmt sie bewusst.

            Zeichen-Whitelist wie bei `stationRef`: Der DWD-Adapter setzt die
            Kennung in Pfade auf `opendata.dwd.de` ein.
          # Leerstring = Station wieder entfernen.
    StandortPiiAendern:
      type: object
      additionalProperties: false
      required: [bezeichnung]
      description: Vollersatz (kein Feld-Teil-Update) — ein weggelassenes `adresse` löscht die hinterlegte Adresse.
      properties:
        bezeichnung: { type: string, maxLength: 512, description: 'pii=true; grundlage=Art.6(1)(b).' }
        adresse: { type: string, maxLength: 1024, description: 'pii=true; grundlage=Art.6(1)(b).' }
        geo: { type: string, maxLength: 128, description: 'pii=true; grundlage=Art.6(1)(b); NIEMALS nach energy gespiegelt (RL-1/RL-3).' }
    StandortPiiDetail:
      type: object
      additionalProperties: false
      description: Echo des soeben geschriebenen Labels (`PUT .../pii`) — pii=true.
      required: [id, bezeichnung, anschrift, geo]
      properties:
        id: { type: string, format: uuid }
        bezeichnung: { type: string }
        anschrift: { type: [string, 'null'] }
        geo: { type: [string, 'null'] }
    StandortLabelsAnfrage:
      type: object
      additionalProperties: false
      required: [standortIds]
      properties:
        standortIds:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
    StandortLabelItem:
      type: object
      additionalProperties: false
      description: '`read:standort_pii`-Lesestufe — pii=true.'
      required: [id, bezeichnung, anschrift]
      properties:
        id: { type: string, format: uuid }
        bezeichnung: { type: string }
        anschrift: { type: [string, 'null'] }
    StandortVerschieben:
      type: object
      additionalProperties: false
      required: [neuerParentId]
      properties:
        neuerParentId:
          type: [string, 'null']
          format: uuid
          description: '`null` = an die Wurzel verschieben (nur zulässig für typ liegenschaft/gebaeude, D2.4).'
    StandortVerschobenErgebnis:
      type: object
      additionalProperties: false
      required: [standort, parentIdAlt, nachfahrenAktualisiert]
      properties:
        standort: { $ref: '#/components/schemas/StandortStruktur' }
        parentIdAlt: { type: [string, 'null'], format: uuid, description: Parent VOR dem Verschieben. }
        nachfahrenAktualisiert:
          type: integer
          minimum: 0
          description: Anzahl der vom rekursiven Nachfahren-Pfad-Update mitaktualisierten Zeilen (D6, Reichweiten-Nachweis).
    StandortStilllegen:
      type: object
      additionalProperties: false
      required: [grund]
      properties:
        grund: { $ref: '#/components/schemas/StandortStilllegenGrund' }
    StandortStillgelegtErgebnis:
      type: object
      additionalProperties: false
      required: [standort, statusAlt]
      properties:
        standort: { $ref: '#/components/schemas/StandortStruktur' }
        statusAlt: { $ref: '#/components/schemas/StandortStatus' }
    StandortLoeschErgebnis:
      type: object
      additionalProperties: false
      required: [id, geloescht, endkundeId, typ, parentIdAlt]
      properties:
        id: { type: string, format: uuid }
        geloescht: { type: boolean }
        endkundeId: { type: string, format: uuid }
        typ: { $ref: '#/components/schemas/StandortTyp' }
        parentIdAlt: { type: [string, 'null'], format: uuid, description: Letzter bekannter Parent vor der Löschung. }

    ZaehlerVerortungAnlegen:
      type: object
      additionalProperties: false
      required: [standortId, gueltigVon]
      properties:
        standortId: { type: string, format: uuid }
        gueltigVon: { type: string, format: date-time }
    ZaehlerVerortungBeenden:
      type: object
      additionalProperties: false
      required: [gueltigBis]
      properties:
        gueltigBis: { type: string, format: date-time }
    ZaehlerStandortDetail:
      type: object
      additionalProperties: false
      required: [id, zaehlerId, standortId, gueltigVon, gueltigBis, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        zaehlerId: { type: string, format: uuid }
        standortId: { type: string, format: uuid }
        gueltigVon: { type: string, format: date-time }
        gueltigBis: { type: [string, 'null'], format: date-time, description: 'NULL = aktuell (offene Zeitscheibe).' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ZaehlerUnterKnotenItem:
      type: object
      additionalProperties: false
      description: 1:1-Projektion von energy.zaehler (PII-frei, kein geraeteReferenz, §12) — Ergebnis der Kern-Query (D6).
      required: [id, systemId, geraetetyp, energietraeger, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        geraetetyp: { type: string }
        energietraeger: { $ref: '#/components/schemas/Energietraeger' }
        status: { $ref: '#/components/schemas/BetriebsStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StandortPfadEintrag:
      type: object
      additionalProperties: false
      description: >
        EIN Knoten der Breadcrumb-Vorfahrenkette (`GET .../zaehler/{zaehlerId}/verortung`,
        D6) — PII-FREI (D5, `read:standort`-Lesestufe): NIEMALS `bezeichnung`/`anschrift`.
      required: [id, parentId, typ, ebene, status]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, 'null'], format: uuid }
        typ: { $ref: '#/components/schemas/StandortTyp' }
        ebene: { type: integer, minimum: 0, maximum: 9 }
        status: { $ref: '#/components/schemas/StandortStatus' }
    ZaehlerStandortAktuellDetail:
      type: object
      additionalProperties: false
      description: >
        `GET /stammdaten/zaehler/{zaehlerId}/verortung` — aktuelle Verortung
        (`gueltig_bis IS NULL`) inklusive Breadcrumb-Pfad (D6, Wurzel
        zuerst), PII-frei (D5). `verortet=false` ist der EMPTY-STATE (kein
        Standort ODER nur historische Verortungen) — KEIN Fehler.
      required: [zaehlerId, verortet, standortId, verortetSeit, pfad]
      properties:
        zaehlerId: { type: string, format: uuid }
        verortet: { type: boolean }
        standortId: { type: [string, 'null'], format: uuid }
        verortetSeit: { type: [string, 'null'], format: date-time }
        pfad:
          type: array
          description: Vorfahrenkette INKLUSIVE des eigenen Standort-Knotens, WURZEL ZUERST. Leer, wenn `verortet=false`.
          items: { $ref: '#/components/schemas/StandortPfadEintrag' }

    # ---------------------------------------------------------------
    # TB-04-Ausfall/Freshness (ADR-0005 §27, D15) — ingest.kanal_status/
    # ingest.ausfall_vorgang, bislang nur geschrieben, jetzt gelesen.
    # ---------------------------------------------------------------
    AusfallVorgangStatus:
      type: string
      enum: [offen, andauernd, behoben]
      description: >
        `ingest.ausfall_vorgang.status`. Aktuell schreibt KEIN Job diese
        Tabelle (periodischer TB-04-Freshness-Check ist offener Punkt,
        ADR-0005 §31) — `ausfallStatus` ist daher in der Praxis überwiegend
        `null`; die Listen stützen sich auf die query-zeit-berechnete
        `ueberfaellig`-Ableitung aus `ingest.kanal_status.letzter_ts`.
    AusfallListeItem:
      type: object
      additionalProperties: false
      description: >
        TB-04 (ADR-0005 §27) — Kanal mit überfälliger Freshness oder
        dokumentiertem, nicht behobenem Ausfall. PII-frei (Pseudonym-
        Surrogate NUR).
      required: [messkanalId, zaehlerId, letzteUebertragung, ueberfaellig, ausfallStatus, ausfallSeit]
      properties:
        messkanalId: { type: string, format: uuid }
        zaehlerId: { type: string, format: uuid }
        letzteUebertragung: { type: string, format: date-time }
        ueberfaellig: { type: boolean }
        ausfallStatus:
          oneOf:
            - $ref: '#/components/schemas/AusfallVorgangStatus'
            - type: 'null'
        ausfallSeit: { type: [string, 'null'], format: date-time }
    ErwarteterMesskanal:
      type: object
      additionalProperties: false
      required: [messgroesse, einheit, art, beschreibung]
      description: >
        Vorlage fuer EINEN Messkanal. Die drei erstgenannten Felder sind
        zeichengenau so anzulegen; `beschreibung` ist reiner Anzeigetext.
      properties:
        messgroesse: { type: string }
        einheit: { type: string }
        art: { $ref: '#/components/schemas/MessgroesseArt' }
        beschreibung: { type: string }
    GeraetetypKatalogItem:
      type: object
      additionalProperties: false
      required: [geraetetyp, version, erwarteteKanaele]
      properties:
        geraetetyp:
          type: string
          description: >
            In der Schreibweise des Decoders. Beim Anlegen eines Zaehlers wird
            der Gerätetyp ohne Ruecksicht auf Gross-/Kleinschreibung und
            Randleerzeichen zugeordnet.
        version: { type: integer, minimum: 1, description: Version der Feldabbildung. }
        erwarteteKanaele:
          type: array
          description: Kann leer sein — s. Pfad-Beschreibung.
          items: { $ref: '#/components/schemas/ErwarteterMesskanal' }
    GeraetetypKatalog:
      type: object
      additionalProperties: false
      required: [daten]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/GeraetetypKatalogItem' } }
    IngestQuelle:
      type: object
      additionalProperties: false
      required:
        - quelleCode
        - brokerHost
        - topic
        - clientId
        - verbunden
        - lebendig
        - letzteVerbindungAt
        - letzterHerzschlagAt
        - gepflegt
        - gepflegtInaktiv
        - abweichendeFelder
      description: >
        Zustand EINES Netzservers, wie sein Worker ihn zuletzt gemeldet hat.
        Enthaelt KEINE Zugangsdaten (`brokerHost` ist auf Host[:Port]
        reduziert, DB-CHECK als Backstop, V0039).
      properties:
        quelleCode: { type: string, description: 'Kennung des Netzservers (`EDMS_INGEST_QUELLE_CODE`).' }
        brokerHost: { type: string, description: 'Host[:Port] — ohne Benutzer und Passwort.' }
        topic: { type: string, description: Abonniertes Uplink-Topic. }
        clientId: { type: string, description: 'MQTT-Client-Id — macht doppelt vergebene Sitzungen sichtbar.' }
        verbunden: { type: boolean, description: 'Selbstauskunft des Workers. ALLEIN nicht aussagekraeftig — s. `lebendig`.' }
        lebendig:
          type: boolean
          description: >
            `verbunden` UND frischer Herzschlag. Die einzige Angabe, auf die
            man sich verlassen sollte.
        letzteVerbindungAt: { type: [string, 'null'], format: date-time, description: 'null = seit Prozessstart nie verbunden.' }
        letzterHerzschlagAt: { type: string, format: date-time }
        gepflegt:
          type: boolean
          description: >
            Ob es zu dieser Kennung eine gepflegte Quelle gibt
            (`ingest.quelle`, V0059). `false` = hier laeuft ein Worker, dessen
            Konfiguration aus Umgebungsvariablen kommt (zulaessig, Verhalten
            vor V0059) — in der Plattform steht dann nichts, woran sich jemand
            orientieren koennte.
        gepflegtInaktiv:
          type: boolean
          description: >
            Die gepflegte Quelle steht auf `inaktiv`, der Prozess laeuft aber
            noch. Kein Widerspruch, sondern der Normalfall direkt nach dem
            Deaktivieren: Ein laufender Worker liest nicht neu. Beim naechsten
            Start bleibt er stehen (fail-closed).
        abweichendeFelder:
          type: array
          items: { type: string }
          description: >
            Felder, in denen der LAUFENDE Prozess von der gepflegten
            Konfiguration abweicht (`brokerHost`, `topic`, `clientId`). Der
            Worker laedt seine Quelle nur beim Start; wird sie danach
            geaendert, faehrt er mit der alten weiter. Ohne diese Angabe
            zeigte die Oberflaeche die gepflegten Werte, waehrend er andere
            benutzt — also das Gegenteil dessen, wofuer man sie aufruft.
    HerkunftMapping:
      type: object
      description: >
        Eine Herkunfts-Zuordnung (ADR-0011 B2/D3). AUSSCHLIESSLICH Kennungen,
        keine Namen — s. die Beschreibung von `GET /monitoring/ingest/herkunft`.
      required: [id, quelleCode, chirpstackTenantId, chirpstackApplicationId, endkundeId, standortId, standortTyp, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        quelleCode:
          type: string
          description: Aus welchem Netz die Zuordnung stammt (ADR-0011 D8).
          pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
        chirpstackTenantId: { type: string, format: uuid }
        chirpstackApplicationId: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid }
        standortId: { type: string, format: uuid }
        standortTyp:
          type: string
          description: >
            `energy.standort.typ` — die einzige beschreibende Angabe, die ohne
            PII zu haben ist. Beantwortet die Plausibilitätsfrage „ist das
            überhaupt ein Gebäude?".
          enum: [liegenschaft, gebaeude, bauteil, etage, einheit, raum]
        createdAt: { type: string, format: date-time }

    HerkunftMappingAnlegen:
      type: object
      required: [chirpstackTenantId, chirpstackApplicationId, endkundeId, standortId]
      additionalProperties: false
      properties:
        quelleCode:
          type: string
          description: >
            Ohne Angabe die Kennung dieses Deployments
            (`EDMS_INGEST_QUELLE_CODE`, Default `standard`). Bei genau einem
            Netzserver muss sie damit niemand tippen; ab dem zweiten ist sie
            die Angabe, die den Unterschied macht.
          pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
        chirpstackTenantId: { type: string, format: uuid }
        chirpstackApplicationId: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid }
        standortId: { type: string, format: uuid }

    IngestQuarantaeneGrund:
      type: string
      enum:
        - envelope_parse_fehler
        - devEUI_unbekannt
        - unbekannter_geraetetyp
        - decode_fehler
        - kanal_unbekannt
        - unplausibel_monotonie_verletzt
        - einheit_inkonsistent
        - zeitstempel_fehlt
        - herkunft_widerspruechlich
        - skalensprung_verdacht
      description: >
        Geschlossene Liste, gespiegelt aus `ck_quarantaene_grund` (V0011,
        erweitert um `herkunft_widerspruechlich` in V0042 und
        `skalensprung_verdacht` in V0049). Jeder Wert benennt die Stufe, an
        der ein Uplink liegen blieb.
    IngestQuarantaeneGrundAnzahl:
      type: object
      additionalProperties: false
      required: [grund, anzahl]
      properties:
        grund: { $ref: '#/components/schemas/IngestQuarantaeneGrund' }
        anzahl: { type: string, description: 'Anzahl als String (`bigint`-Herkunft).' }
    IngestStatus:
      type: object
      additionalProperties: false
      required:
        - quellen
        - letzterMesswertAt
        - letzteSchreibungAt
        - letzteQuarantaeneAt
        - quarantaeneGesamt
        - quarantaeneJeGrund
        - verwurfTage
        - verwurfSumme
      description: Aus der Datenbank abgeleiteter Betriebszustand.
      properties:
        quellen:
          type: array
          description: Leer = es lief noch nie ein Worker.
          items: { $ref: '#/components/schemas/IngestQuelle' }
        letzterMesswertAt:
          type: [string, 'null']
          format: date-time
          description: >
            Juengster MESSZEITPUNKT ueber alle Kanaele
            (`MAX(ingest.kanal_status.letzter_ts)`). `null` = es wurde noch
            nie ein Messwert geschrieben.
        letzteSchreibungAt:
          type: [string, 'null']
          format: date-time
          description: >
            Juengster SCHREIB-Zeitpunkt (`MAX(ingest.kanal_status.updated_at)`),
            ueber ALLE Quellen. Unterscheidet sich vom Messzeitpunkt bei
            Backfill. Bei mehreren Quellen sagt dieser Wert NICHT, ob eine
            einzelne ausgefallen ist — dafuer ist `quellen` da.
        letzteQuarantaeneAt:
          type: [string, 'null']
          format: date-time
          description: Juengster liegengebliebener Uplink (`MAX(empfangen_at)`).
        quarantaeneGesamt: { type: string, description: 'Gesamtzahl als String (`bigint`-Herkunft).' }
        quarantaeneJeGrund:
          type: array
          description: Nur Gruende mit Anzahl > 0, absteigend nach Anzahl.
          items: { $ref: '#/components/schemas/IngestQuarantaeneGrundAnzahl' }
        verwurfTage:
          type: array
          description: >
            Auflage C-6 — VERWORFENE Uplinks je Kalendertag und Grund, die
            letzten 14 Tage (`ingest.verwurf_tagesaggregat`, V0085).

            Der Gegenpart zur Quarantaene: Ein Uplink ohne Rechtsgrundlage
            wird verworfen und hinterlaesst BEWUSST keine Quarantaene-Zeile
            (A12-13) — ohne diese Zahlen haette die Betriebssicht eine Luecke
            genau dort, wo Daten verschwinden.

            SUBJEKTFREI: kein Zaehler, kein Geraet, keine Uhrzeit unterhalb
            des Tages. Ein Verwurfsprotokoll mit Subjektbezug waere selbst
            eine Verarbeitung genau der Daten, deren Grundlage gerade fehlt.
          items: { $ref: '#/components/schemas/IngestVerwurfTag' }
        verwurfSumme:
          type: string
          description: >
            Summe ueber das 14-Tage-Fenster als String (`bigint`-Herkunft).
            `"0"` heisst „nichts verworfen" — und ist damit etwas anderes als
            eine fehlende Angabe, die offen liesse, ob niemand nachgesehen
            hat.
    IngestVerwurfTag:
      type: object
      additionalProperties: false
      required: [tag, grund, anzahl]
      description: Verworfene Uplinks EINES Kalendertages zu EINEM Grund (V0085).
      properties:
        tag:
          type: string
          format: date
          description: Kalendertag (UTC). Bewusst grob — eine feinere Aufloesung waere in einer kleinen Anlage ein Zeitprofil.
        grund:
          type: string
          enum: [rechtsgrundlage_fehlt]
          description: Geschlossene Werteliste; Erweiterung nur per Migration.
        anzahl:
          type: string
          description: Anzahl als String (`bigint`-Herkunft).

    TlsModus:
      type: string
      enum: [kein_tls, tls, mtls]
      description: >
        `kein_tls` ist nur fuer den lokalen Dev-Broker vertretbar. Vor
        Real-Ingest ist mTLS vorgesehen (ADR-0005 §31 SA-3).
    IngestQuelleGeheimnisFeld:
      type: string
      enum: [benutzername, passwort, ca_zertifikat, client_zertifikat, client_schluessel]
    IngestQuelleKonfig:
      type: object
      additionalProperties: false
      required:
        - id
        - quelleCode
        - bezeichnung
        - brokerHost
        - topic
        - clientId
        - tlsModus
        - status
        - notiz
        - hinterlegteGeheimnisse
        - caZertifikatGueltigBis
        - clientZertifikatGueltigBis
        - createdAt
        - updatedAt
      description: >
        Die gepflegte Konfiguration einer Datenquelle. Was hier FEHLT, fehlt
        mit Absicht: kein Benutzername, kein Passwort, kein Zertifikat und
        kein privater Schluessel — auch nicht gekuerzt, maskiert oder gehasht.
        `hinterlegteGeheimnisse` nennt stattdessen, welche Felder belegt sind.
      properties:
        id: { type: string, format: uuid }
        quelleCode:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
          description: Kennung, ueber die ein Worker seine Konfiguration laedt. Nicht aenderbar.
        bezeichnung: { type: string, description: Klartext fuer Menschen. }
        brokerHost: { type: string, description: 'NUR Host[:Port] — niemals Zugangsdaten.' }
        topic: { type: string }
        clientId: { type: string }
        tlsModus: { $ref: '#/components/schemas/TlsModus' }
        status: { type: string, enum: [aktiv, inaktiv] }
        notiz: { type: [string, 'null'] }
        hinterlegteGeheimnisse:
          type: array
          items: { $ref: '#/components/schemas/IngestQuelleGeheimnisFeld' }
          description: Feldnamen der hinterlegten Geheimnisse — niemals deren Werte.
        caZertifikatGueltigBis:
          type: [string, 'null']
          format: date-time
          description: >
            `notAfter` des hinterlegten CA-Zertifikats; `null` = keines
            hinterlegt (NICHT: unbegrenzt gueltig). Kein Geheimnis — steht im
            oeffentlichen Teil des Zertifikats.
        clientZertifikatGueltigBis:
          type: [string, 'null']
          format: date-time
          description: >
            `notAfter` des Client-Zertifikats. Laeuft es ab, verweigert der
            Broker die Verbindung und die Datenaufnahme steht still — die
            Betriebssicht warnt daher vorher. Ein bereits abgelaufenes
            Zertifikat wird beim Anlegen/Aendern mit 400 abgewiesen.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IngestQuelleAnlegen:
      type: object
      additionalProperties: false
      required: [quelleCode, bezeichnung, brokerHost, topic, clientId, tlsModus]
      properties:
        quelleCode: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,62}$' }
        bezeichnung: { type: string, minLength: 1, maxLength: 200 }
        brokerHost:
          type: string
          maxLength: 255
          pattern: '^[A-Za-z0-9.\-_]+(:\d{1,5})?$'
          description: 'NUR Host[:Port]. Zugangsdaten gehoeren in benutzername/passwort.'
        topic: { type: string, minLength: 1, maxLength: 255 }
        clientId: { type: string, minLength: 1, maxLength: 128 }
        tlsModus: { $ref: '#/components/schemas/TlsModus' }
        benutzername: { type: string, maxLength: 255 }
        passwort: { type: string, maxLength: 1024, description: Wird feldverschluesselt abgelegt und nie wieder ausgegeben. }
        caZertifikat: { type: string, maxLength: 64000, description: PEM-Block. }
        clientZertifikat: { type: string, maxLength: 64000, description: 'PEM-Block. Pflicht bei tlsModus=mtls.' }
        clientSchluessel: { type: string, maxLength: 64000, description: 'PEM-Block, privater Schluessel. Pflicht bei tlsModus=mtls.' }
        notiz: { type: string, maxLength: 2000 }
    IngestQuelleAendern:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        Ein weggelassenes Feld bleibt unveraendert; ein LEERER String bei einem
        Geheimnis ENTFERNT es. `quelleCode` fehlt bewusst — er ist nicht
        aenderbar.
      properties:
        bezeichnung: { type: string, minLength: 1, maxLength: 200 }
        brokerHost: { type: string, maxLength: 255, pattern: '^[A-Za-z0-9.\-_]+(:\d{1,5})?$' }
        topic: { type: string, minLength: 1, maxLength: 255 }
        clientId: { type: string, minLength: 1, maxLength: 128 }
        tlsModus: { $ref: '#/components/schemas/TlsModus' }
        status: { type: string, enum: [aktiv, inaktiv] }
        notiz: { type: string, maxLength: 2000 }
        benutzername: { type: string, maxLength: 255 }
        passwort: { type: string, maxLength: 1024 }
        caZertifikat: { type: string, maxLength: 64000 }
        clientZertifikat: { type: string, maxLength: 64000 }
        clientSchluessel: { type: string, maxLength: 64000 }
    IngestQuarantaeneItem:
      type: object
      additionalProperties: false
      required:
        - id
        - grund
        - zaehlerId
        - messkanalKey
        - fPort
        - quelleCode
        - chirpstackTenantId
        - chirpstackApplicationId
        - topicRedacted
        - empfangenAt
        - zaehlerMessgroessen
      description: >
        OHNE DevEUI-Blind-Index, `payload_hash` und Rohpayload — s.
        Pfad-Beschreibung. Die Herkunfts-Felder sind NUR opake Kennungen; die
        Namen aus dem Netzserver (`tenantName`, `applicationName`,
        `deviceName`, `tags`) werden bewusst weder gespeichert noch
        ausgegeben (ADR-0011 D1).
      properties:
        id: { type: string, format: uuid }
        grund: { $ref: '#/components/schemas/IngestQuarantaeneGrund' }
        zaehlerId:
          type: [string, 'null']
          format: uuid
          description: Pseudonym; `null`, wenn das Geraet nicht aufloesbar war.
        messkanalKey: { type: [integer, 'null'] }
        fPort:
          type: [integer, 'null']
          description: 'Aus dem redigierten Envelope; `null` bei `envelope_parse_fehler` (dort gibt es keinen).'
        quelleCode:
          type: [string, 'null']
          description: >
            Welcher Worker-Prozess die Nachricht empfangen hat (ADR-0011 D8).
            `null` bei Zeilen aus der Zeit vor V0041 — ein Default waere eine
            Behauptung ueber Vergangenes.
        chirpstackTenantId:
          type: [string, 'null']
          format: uuid
          description: 'Opake Mandanten-Kennung des Netzservers; beim Betreiber ein Endkunde. `null`, wenn der Envelope sie nicht trug.'
        chirpstackApplicationId:
          type: [string, 'null']
          format: uuid
          description: 'Opake Application-Kennung; beim Betreiber ein Gebaeude.'
        topicRedacted: { type: string, description: MQTT-Topic mit redigiertem Geraete-Segment (RL-2). }
        empfangenAt: { type: string, format: date-time }
        zaehlerMessgroessen:
          type: [string, 'null']
          description: >
            Die Messgroessen, die der betroffene Zaehler TATSAECHLICH fuehrt,
            als `messgroesse (einheit)`-Liste; `null` ohne aufloesbaren Zaehler
            oder ohne Kanaele. Technische Groessen, kein Personenbezug.
            Sie steht hier, weil der Kanal-Lookup der Aufnahme `messgroesse`
            EXAKT vergleicht: Weicht die Schreibweise am Zaehler von dem ab,
            was der Decoder liefert, faellt jeder Uplink als `kanal_unbekannt`
            in Quarantaene — ohne diese Liste war die Ursache nur zu finden,
            indem man die Nutzlast von Hand dekodierte.
    IngestQuarantaeneListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/IngestQuarantaeneItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    AusfallListe:
      type: object
      additionalProperties: false
      required: [daten, seite]
      properties:
        daten: { type: array, items: { $ref: '#/components/schemas/AusfallListeItem' } }
        seite: { $ref: '#/components/schemas/SeitenInfo' }
    MesskanalFreshnessItem:
      type: object
      additionalProperties: false
      description: >
        Betriebs-Metadatum (letzte Übertragung je Messkanal) — KEIN
        Messwert, KEIN break-glass.
      required: [messkanalId, letzteUebertragung, ueberfaellig, ausfallStatus, ausfallSeit]
      properties:
        messkanalId: { type: string, format: uuid }
        letzteUebertragung: { type: [string, 'null'], format: date-time, description: 'null = noch nie empfangen.' }
        ueberfaellig: { type: boolean }
        ausfallStatus:
          oneOf:
            - $ref: '#/components/schemas/AusfallVorgangStatus'
            - type: 'null'
        ausfallSeit: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------------------
    # Einflussgrößen (ADR-0006 Teil B, B8/B10) — einfluss.katalog/intervall/befund (V0020/V0021)
    # ---------------------------------------------------------------
    EinflussBetroffenerTyp:
      type: string
      enum: [endkunde, anschlussnutzer]
      description: 'Bei anschlussnutzer: rechtsgrundlage=art6_1f, abwaegungRef und art14InformationAt zwingend (Art. 14 DSGVO, V0020-CHECK).'
    EinflussQuelleTyp:
      type: string
      enum: [endkunde, anschlussnutzer, betriebsteam, vor_ort]
    EinflussRechtsgrundlage:
      type: string
      enum: [art6_1b, art6_1f]
    EinflussAnlassCode:
      type: string
      enum: [ersterfassung, turnusaktualisierung, korrektur, systemgrenzenaenderung, meldung_aenderung, sonstige]
      description: Geschlossene Liste (B12.5), KEIN Freitext. `korrektur` wird bei `PATCH .../einflussgroessen/{id}` server-seitig gesetzt, nicht client-wählbar.
    EinflussUeberschreitungKlasse:
      type: string
      enum: [schwelle_ueberschritten, deutlich_ueberschritten, stark_ueberschritten]
      description: Klassiert (B10/B12.5) — KEIN Rohprozentsatz im Report.
    EinflussgroesseErfassen:
      type: object
      additionalProperties: false
      required: [groesseCode, gueltigAbMonat, betroffenerTyp, quelleTyp, rechtsgrundlage]
      description: >
        `endkundeId` ist BEWUSST NICHT Teil dieses Schemas — wird
        server-seitig aus `systemId` (Pfad) abgeleitet (RL-B1). `wertNum`
        XOR `wertCode`, abhängig von `wert_art` des `groesseCode`-Katalog-
        Eintrags (Service-seitig geprüft, nicht statisch im Schema).
      properties:
        standortId: { type: string, format: uuid, description: 'Nur wo gemessen wird (A1) — Vorbedingung RL-B1 (aktive Zähler-Verortung im Zeitraum).' }
        groesseCode: { type: string, minLength: 1, maxLength: 64, description: 'einfluss.katalog.code (governt, erweiterbar) — z. B. personenanzahl/nutzflaeche/nutzungszweck/energietraeger_mix/geraeteabschaffung.' }
        wertNum: { type: number, minimum: 0, description: 'pii=true — Personenzahl/Nutzflaeche sind der PII-Wert selbst (A8). NIE in Logs/Audit-Kontext.' }
        wertCode: { type: string, minLength: 1, maxLength: 64, description: 'pii=true. Bei groesseCode=nutzungszweck aus der B12.5-Liste (wohnen/buero/handel/produktion/lager/sonstige).' }
        gueltigAbMonat: { type: string, pattern: '^\d{4}-\d{2}-01$', description: Monatsanfang (YYYY-MM-01). }
        gueltigBisMonat: { type: string, pattern: '^\d{4}-\d{2}-01$', description: Monatsanfang, EXKLUSIV. Offen (unbefristet), wenn weggelassen. }
        betroffenerTyp: { $ref: '#/components/schemas/EinflussBetroffenerTyp' }
        quelleTyp: { $ref: '#/components/schemas/EinflussQuelleTyp' }
        rechtsgrundlage: { $ref: '#/components/schemas/EinflussRechtsgrundlage' }
        abwaegungRef: { type: string, minLength: 1, maxLength: 256, description: Verweis auf die dokumentierte Interessenabwägung (LIA) — Pflicht bei betroffenerTyp=anschlussnutzer. }
        art14InformationAt: { type: string, format: date-time, description: Zeitpunkt der Art.-14-Information — Pflicht bei betroffenerTyp=anschlussnutzer. }
        anlassCode: { $ref: '#/components/schemas/EinflussAnlassCode' }
    EinflussgroesseKorrekturWerte:
      type: object
      additionalProperties: false
      required: [gueltigAbMonat, betroffenerTyp, quelleTyp, rechtsgrundlage]
      description: >
        Vollständige Felder der NEUEN Korrektur-Zeile (append-only). `groesseCode`
        ist NICHT Teil dieses Schemas — wird vom ursprünglichen Intervall
        GEERBT. `anlassCode` ist EBENFALLS nicht Teil dieses Schemas — der
        Server setzt ihn HART auf `korrektur`.
      properties:
        standortId: { type: string, format: uuid }
        wertNum: { type: number, minimum: 0, description: 'pii=true.' }
        wertCode: { type: string, minLength: 1, maxLength: 64, description: 'pii=true.' }
        gueltigAbMonat: { type: string, pattern: '^\d{4}-\d{2}-01$' }
        gueltigBisMonat: { type: string, pattern: '^\d{4}-\d{2}-01$' }
        betroffenerTyp: { $ref: '#/components/schemas/EinflussBetroffenerTyp' }
        quelleTyp: { $ref: '#/components/schemas/EinflussQuelleTyp' }
        rechtsgrundlage: { $ref: '#/components/schemas/EinflussRechtsgrundlage' }
        abwaegungRef: { type: string, minLength: 1, maxLength: 256 }
        art14InformationAt: { type: string, format: date-time }
    EinflussgroesseKorrigieren:
      type: object
      additionalProperties: false
      required: [gueltigBisMonat]
      properties:
        gueltigBisMonat: { type: string, pattern: '^\d{4}-\d{2}-01$', description: Schließt das adressierte Intervall — PFLICHT bei jedem Aufruf. }
        korrektur: { $ref: '#/components/schemas/EinflussgroesseKorrekturWerte' }
    EinflussgroesseDetail:
      type: object
      additionalProperties: false
      description: >
        `read:einflussgroesse`-Lesestufe — KLARTEXT-PII (A8/B10). `wertNum`
        ist ein STRING (numeric(18,3)-Präzisionserhalt), NIEMALS in `number`
        gewandelt.
      required: [id, endkundeId, systemId, standortId, groesseCode, wertNum, wertCode, gueltigAbMonat, gueltigBisMonat, betroffenerTyp, quelleTyp, rechtsgrundlage, abwaegungRef, art14InformationAt, anlassCode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        endkundeId: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        standortId: { type: [string, 'null'], format: uuid }
        groesseCode: { type: string }
        wertNum: { type: [string, 'null'], description: 'pii=true; numeric(18,3) als String.' }
        wertCode: { type: [string, 'null'], description: 'pii=true.' }
        gueltigAbMonat: { type: string }
        gueltigBisMonat: { type: [string, 'null'] }
        betroffenerTyp: { $ref: '#/components/schemas/EinflussBetroffenerTyp' }
        quelleTyp: { $ref: '#/components/schemas/EinflussQuelleTyp' }
        rechtsgrundlage: { $ref: '#/components/schemas/EinflussRechtsgrundlage' }
        abwaegungRef: { type: [string, 'null'] }
        art14InformationAt: { type: [string, 'null'], format: date-time }
        anlassCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EinflussgroesseKorrekturErgebnis:
      type: object
      additionalProperties: false
      required: [geschlossen, neu]
      properties:
        geschlossen: { $ref: '#/components/schemas/EinflussgroesseDetail' }
        neu:
          oneOf:
            - $ref: '#/components/schemas/EinflussgroesseDetail'
            - type: 'null'
          description: 'null, wenn der Aufruf NUR geschlossen hat (kein korrektur-Feld im Request).'
    EinflussgroesseBefundItem:
      type: object
      additionalProperties: false
      description: v1 NUR lesend — die Schwellwert-Erkennung selbst ist NICHT Teil dieser Version.
      required: [id, systemId, groesseCode, zeitraumVon, zeitraumBis, ueberschreitungKlasse, erkanntAt]
      properties:
        id: { type: string, format: uuid }
        systemId: { type: string, format: uuid }
        groesseCode: { type: string }
        zeitraumVon: { type: string }
        zeitraumBis:
          type: string
          description: >-
            Monat, AB DEM die TB-03-Anzeigepflicht entsteht (Beginn der
            Änderung + Mindestdauer) — NICHT das Ende des auslösenden
            Zustands. Bei offenen Intervallen (z. B. dauerhafter
            Belegungswechsel ohne bekanntes Enddatum) besteht die Lage über
            diesen Monat hinaus fort.
        ueberschreitungKlasse: { $ref: '#/components/schemas/EinflussUeberschreitungKlasse' }
        erkanntAt: { type: string, format: date-time }
