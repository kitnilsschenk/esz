  /stammdaten/messkonzept-energietraeger/{mvetId}/systeme:
    parameters:
      - name: mvetId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Kennung des Messkonzept-Energieträgers (`MesskonzeptVersionDetail.energietraeger[].mvetId`).
    get:
      operationId: systemgrenzeLesen
      tags: [messkonzept]
      summary: Systemgrenze eines Messkonzept-Energieträgers lesen
      description: >
        ABAC-Aktion `read:stammdaten`. Rollen `betrieb` und
        `compliance-auditor`.

        Die Systemgrenze bestimmt, WELCHE Systeme — und damit welche Zähler —
        ein Berechnungslauf umfasst. Die Antwort trägt zusätzlich die
        wählbaren Systeme des Endkunden, weil eine Oberfläche, die eine Menge
        bearbeiten lässt, beides in einem Zug braucht.

        `greiftFallback: true` heißt: Es ist NICHTS zugeordnet, und der
        Berechnungslauf nimmt alle aktiven Zähler des Endkunden mit passendem
        Energieträger (`endkunde_fallback`). Bei einem Kunden mit mehreren
        Messkonzepten fließt dabei fremder Verbrauch ein — deshalb steht es
        ausdrücklich in der Antwort, statt sich still auszuwirken.
      responses:
        '200':
          description: Systemgrenze samt Auswahl.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Systemgrenze' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    put:
      operationId: systemgrenzeSetzen
      tags: [messkonzept]
      summary: Systemgrenze setzen (ganze Menge, idempotent)
      description: >
        ABAC-Aktion `update:messkonzept_version`. Rolle `betrieb`.

        `PUT` und nicht POST/DELETE je Eintrag: Die Systemgrenze ist eine
        Menge, und wer sie ändert, meint den neuen Zustand. Ein zweiter Aufruf
        mit demselben Inhalt ändert nichts.

        Ein LEERES Array ist zulässig und bedeutet „zurück zum Fallback" —
        sonst käme man aus einer falsch gesetzten Grenze nicht mehr heraus.
        Systeme, die nicht zu diesem Endkunden gehören oder stillgelegt sind,
        werden mit **400** abgewiesen.

        Audit `messkonzept.systemgrenze.zugeordnet` (mit Anzahl vorher/nachher).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemgrenzeSetzen' }
      responses:
        '200':
          description: Die neue Systemgrenze.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Systemgrenze' }
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/messkonzept-energietraeger/{mvetId}/baseline-perioden:
    parameters:
      - name: mvetId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Kennung des Messkonzept-Energieträgers (`MesskonzeptVersionDetail.energietraeger[].mvetId`).
    get:
      operationId: baselinePeriodenLesen
      tags: [messkonzept]
      summary: Baseline-Bezugszeiträume eines Messkonzept-Energieträgers lesen
      description: >
        ABAC-Aktion `read:stammdaten`. Rollen `betrieb` und
        `compliance-auditor`.

        Die Perioden sind die Zeiträume der Jahresabrechnungen, aus denen die
        Baseline gemittelt wurde (TB-02, [Q3] Kap. 2.1.2). Aus ihnen bildet
        der Berechnungslauf **GTZ_base** als Mittelwert der
        Gradtagzahl-Summen je Periode — den Nenner der Witterungsbereinigung.

        Ist `gtzBaseErmittelbar: false`, weist der Berechnungslauf mit
        `GTZ_BASE_NICHT_ERMITTELBAR` ab, sofern kein `gtzBaseOverride` gesetzt
        ist und der Grundlastanteil unter 1 liegt. Ein `gtzBaseOverride` ist
        eine von Hand gesetzte Gradtagzahl — er macht die Rechnung nicht
        richtiger, sondern nur möglich.

        Die Antwort trägt die Baseline-Kopfdaten mit, damit sichtbar ist, ob
        die Perioden zu dem passen, was sie belegen sollen.
      responses:
        '200':
          description: Die erfassten Perioden samt Baseline-Bezug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BaselinePerioden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }
    put:
      operationId: baselinePeriodenSetzen
      tags: [messkonzept]
      summary: Baseline-Bezugszeiträume setzen (ganze Menge, idempotent)
      description: >
        ABAC-Aktion `update:messkonzept_version`. Rolle `betrieb`.

        `PUT` und nicht POST/DELETE je Periode: Die Perioden wirken nur
        gemeinsam — der Lauf mittelt über alle. Wer eine ändert, verschiebt
        den Nenner der Witterungsbereinigung und soll dabei den ganzen Satz
        sehen. Ein zweiter Aufruf mit demselben Inhalt ändert nichts.

        **`bis` ist AUSSCHLIESSLICH.** Eine Abrechnung über das Kalenderjahr
        2023 wird als `von: 2023-01-01, bis: 2024-01-01` erfasst. Die Antwort
        gibt je Periode `tage` und `letzterTag` zurück, damit dieser
        Unterschied nicht erst in der Einsparzahl auffällt.

        Mit **400** abgewiesen werden `bis <= von` und ÜBERSCHNEIDUNGEN —
        überschneidende Tage zählen doppelt in den Mittelwert, und zwei
        Jahresabrechnungen desselben Versorgers überschneiden sich nicht.
        Eine ungewöhnliche LÄNGE wird NICHT abgewiesen (ein unterjähriger
        Abrechnungszeitraum ist ein echter Fall), sondern über
        `laengeAuffaellig` ausgewiesen.

        Audit `messkonzept.baseline_periode.erfasst` (mit Anzahl vorher/nachher).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BaselinePeriodenSetzen' }
      responses:
        '200':
          description: Die neuen Perioden samt Baseline-Bezug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BaselinePerioden' }
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        default: { $ref: '#/components/responses/Unerwartet' }

  # =====================================================================
  # Anschlussnutzer (DS-07-Datensubjekt, strukturell) + Nutzungsverhältnis
  # =====================================================================
  /stammdaten/anschlussnutzer:
    get:
      operationId: anschlussnutzerListe
      tags: [anschlussnutzer]
      summary: Anschlussnutzer auflisten (PII-frei)
      description: >
        ABAC-Aktion `read:stammdaten`. Nur Pseudonym + Nicht-PII (Linie 2).
        Optionaler Filter nach Endkunde.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: endkundeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Seite von Anschlussnutzern.
          content:
            application/json:
