  # =====================================================================
  # Geraet-Zuordnung (O4-Kernkorrelation DevEUI<->Zaehler, ADR-0005 §26)
  # =====================================================================
  /stammdaten/zaehler/{zaehlerId}/geraet-zuordnungen:
    parameters:
      - $ref: '#/components/parameters/ZaehlerIdPath'
    post:
      operationId: geraetZuordnungAnlegen
      tags: [geraet-zuordnung]
      summary: Geraete-Zuordnung provisionieren (DevEUI<->Zaehler-Erstanlage)
      description: >
        ABAC-Aktion `create:geraet_zuordnung`. Rolle `betrieb`. Synthetic-only
        (ADR-0005 §0/§19 — Ingest-Gate bleibt ZU). `devEui` wird AES-256-GCM
        feldverschlüsselt (AAD=zaehlerId||'deveui') + als Blind-Index
        (HMAC-SHA256, systemweiter Pepper) abgelegt — NIE im Klartext
        zurückgegeben oder geloggt (O4 Design-Prinzip 1). Höchstens EINE
        aktive Zuordnung je Zähler gleichzeitig (D-EXCL) => 409 bei Verstoß;
        dieselbe DevEUI darf nicht gleichzeitig aktiv zwei Zählern zugeordnet
        sein (partieller Unique-Index) => ebenfalls 409. Audit
        `geraet_zuordnung.stammdaten.provisioniert`
        (kontext={synthetic,zaehler_id,pepper_version}, RL-2: kein
        DevEUI-Klartext/Blind-Index im Kontext).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeraetZuordnungAnlegen'
      responses:
        '201':
          description: Geraete-Zuordnung angelegt.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeraetZuordnungDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/geraet-zuordnungen/{geraetZuordnungId}:
    parameters:
      - $ref: '#/components/parameters/GeraetZuordnungIdPath'
    patch:
      operationId: geraetZuordnungAendern
      tags: [geraet-zuordnung]
      summary: Geraete-Zuordnung deaktivieren (v1 minimal)
      description: >
        ABAC-Aktion `update:geraet_zuordnung`. Rolle `betrieb`. v1 MINIMAL:
        `aktion=deaktivieren` (status=inaktiv, gueltig_bis=now(), IDEMPOTENT).
        Ein Geräte-Tausch am selben Zähler ist v1 ZWEI Aufrufe (dieses PATCH
        + anschließendes POST auf die Create-Route mit der neuen DevEUI).
        Bereits krypto-geschredderte Zuordnungen (Art. 17) liefern 409. Audit
        `geraet_zuordnung.stammdaten.aktualisiert`
        (kontext={synthetic,zaehler_id}).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeraetZuordnungAendern'
      responses:
        '200':
          description: Geraete-Zuordnung deaktiviert (oder war es bereits).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeraetZuordnungDetail'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

  /stammdaten/geraet-zuordnungen/{geraetZuordnungId}/reverse-aufloesung:
    parameters:
      - $ref: '#/components/parameters/GeraetZuordnungIdPath'
    post:
      operationId: geraetZuordnungReverseAufloesen
      tags: [geraet-zuordnung]
      summary: Reverse-Aufloesung — Blind-Index/Zeile zu Klartext-DevEUI (break-glass)
      description: >
        ABAC-Aktion `read:geraet_zuordnung`. **EIGENSTAENDIGE break-glass-
        Haertung** (ADR-0005 §26.4 SEC-5, NICHT das `read:verbrauch_detail`-
        Muster): Rolle **`geraete-support`** (NICHT `betrieb`, eigene,
        rezertifizierungspflichtige Rolle) UND `zweck` aus einer eigenen
        Whitelist (unabhängig von `read:verbrauch_detail`) UND strukturiertes
        `ticketRef` (Format `^[A-Z]+-[0-9]+$`, kein Freitext) UND Velocity/
        Quota (höchstens N erfolgreiche Aufloesungen je Subjekt im
        gleitenden 24h-Fenster, gezaehlt ueber den Audit-Trail selbst) →
        `permit`; sonst `deny` (403). `compliance-auditor` erhaelt
        UNBEDINGT `deny` (eigene PDP-Regel, unabhaengig von einer eventuell
        zusaetzlich zugewiesenen `geraete-support`-Rolle). Bei `permit`:
        Klartext-`devEui` in der Response (das EINZIGE Schema im gesamten
        Contract mit Klartext-DevEUI) + Echtzeit-Alert (`actorSub`,
        `zaehlerId`, `zweck`, `ticketRef`, `zeitpunkt` — NIEMALS DevEUI) +
        Audit `geraet_zuordnung.stammdaten.reverse_aufgeloest`
        (kontext={synthetic,zaehler_id,zweck,ticket_ref}), **auch bei
        `deny`** auditiert (ADR-0005 §26.4: "jede Auflösung wird auditiert").
        Bewusst KEIN `Idempotency-Key` (reine, wiederholbare Lese-Operation,
        keine State-Aenderung an `device.*`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeraetReverseAufloesungAnfrage'
      responses:
        '200':
          description: Reverse-Aufloesung erfolgreich (Klartext-DevEUI in der Response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeraetReverseAufloesungErgebnis'
        '400': { $ref: '#/components/responses/UngueltigeEingabe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409': { $ref: '#/components/responses/Konflikt' }
        default: { $ref: '#/components/responses/Unerwartet' }

